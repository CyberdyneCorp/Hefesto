schema = 1
id = "MODEL-G-042"
area = "MODEL"
capability = "layout-labels-ports"
requirements = ["Labels on contacts and stacked contacts"]
tool = "magic"
description = "A .mag with a label on via1+via2; load and save."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
