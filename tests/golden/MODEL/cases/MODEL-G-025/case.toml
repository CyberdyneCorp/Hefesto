schema = 1
id = "MODEL-G-025"
area = "MODEL"
capability = "layout-paint-semantics"
requirements = ["Active (locked) layers"]
tool = "magic"
description = "tech locked metal2, then paint via1."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
