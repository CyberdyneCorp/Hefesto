schema = 1
id = "MODEL-G-031"
area = "MODEL"
capability = "layout-hierarchy"
requirements = ["Bounding box and extended bounding box"]
tool = "magic"
description = "Children: paint + point label, label only, empty, flabels; parent use boxes (Q-MODEL-6, Q-MODEL-19)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[outputs]]
