[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "c1.mag"
source = "c1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "c2.mag"
source = "c2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "c3.mag"
