#
# MODEL-G-012 (MODEL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "MODEL-G-012"
area = "MODEL"
capability = "layout-geometry-model"
requirements = ["Transforming positions, angles and triangles"]
tool = "magic"
description = "Child flabels rotated 0/90/180/270 (input/fl.mag) placed 90; flattened."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "flat.mag"
source = "flat.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
