#
# MODEL-G-018 (MODEL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "MODEL-G-018"
area = "MODEL"
capability = "layout-paint-semantics"
requirements = ["Stacked contacts"]
tool = "magic"
description = "via1 and via2 on 0 0 4 4, then erase via2."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "a1.mag"
source = "a1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "a2.mag"
source = "a2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
