schema = 1
id = "MODEL-G-058"
area = "MODEL"
capability = "layout-undo"
requirements = ["Undo and redo semantics", "undo command", "redo command"]
tool = "magic"
description = "Three paints in one box, undo twice, paint, redo (nothing to redo)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
