#
# Documented deviations: captured cases whose Magic output shows behavior
# Hefesto deliberately does not reproduce, each with the decision behind it
# and the outputs allowed to differ. Format and rules:
# tools/golden/goldenlib/deviations.py. replay.py reports these cases as
# DEVIATION (skipped); a listed case fails if another output differs or if it
# starts to pass. Add an entry only for a resolved decision, never for a bug.

# --- TECH -------------------------------------------------------------------

[TECH-G08]
decisions = ["Q-TECH-2", "Q-TECH-10"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "a missing include is discarded and fails the load (no 'Bad section header' follow-on, so the next section is read); the failed load keeps the previous technology, where Magic keeps the partly loaded one"

[TECH-G09]
decisions = ["Q-TECH-2"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "a missing include inside a section fails the load instead of being parsed as a connect line"

[TECH-G17]
decisions = ["Q-TECH-10", "Q-TECH-11"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "a rejected types line leaves no names behind and the failed load keeps the previous technology, so m3 and foo do not resolve"

[TECH-G30]
decisions = ["Q-TECH-24"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "missing display files never fail a technology load (display resources are a platform concern, X-4)"

[TECH-G43]
decisions = ["Q-TECH-25"]
outputs = ["stdout.txt"]
reason = "tech revert * re-locks the layers locked in the technology file"

# --- MODEL ------------------------------------------------------------------

[MODEL-G-035]
decisions = ["Q-MODEL-31"]
outputs = ["top.mag"]
reason = "in-place flatten renames the child's labels <id>[x][y]/<text>; Magic's renaming overflows its buffer and leaves them unprefixed"

[MODEL-G-040]
decisions = ["Q-MODEL-12"]
outputs = ["stdout.txt"]
reason = "undo replay marks the cell modified, so cellname list modified prints it, and the save in the same second as the previous one prints Magic's 'writing out-of-date timestamp' note for the pending stamp"

[MODEL-G-043]
decisions = ["Q-CELL-12"]
outputs = ["a.mag"]
reason = "port renumber orders VDD and vdd by the total natural order (byte tie-break); Magic's comparator ties them and the order depends on the host qsort"

# --- CELL -------------------------------------------------------------------

[CELL-PR-10]
decisions = ["Q-CELL-16"]
outputs = ["stderr.txt", "x_out.mag"]
reason = "when both x.mag and x.mag.gz exist, x.mag is read with a warning; Magic reads the compressed file"

[CELL-PR-11]
decisions = ["Q-CELL-12"]
outputs = ["stdout.txt"]
reason = "cellname list orders inv before inv_a (a natural prefix sorts first)"

[CELL-RD-12]
decisions = ["Q-CELL-1"]
outputs = ["stdout.txt", "stderr.txt", "a_out.mag"]
reason = "empty lines in a .mag file are skipped; Magic reports a format error and abandons the rest of the file"

[CELL-RD-17]
decisions = ["Q-CELL-5"]
outputs = ["a_out.mag"]
reason = "label text longer than 99 characters is kept in full; Magic truncates it on read"

[CELL-RD-18]
decisions = ["Q-CELL-6", "Q-CELL-43"]
outputs = ["stderr.txt", "a_out.mag"]
reason = "a 3-token port record is accepted with its third token read as the class (Magic skips the line), and each unknown use/shape warning ends with a line feed"

[CELL-RD-19]
decisions = ["Q-CELL-11", "Q-CELL-44"]
outputs = ["stdout.txt", "a_out.mag"]
reason = "elements are written sorted by name (Magic: hash order), and the style name red, unknown to Magic's display styles, is kept instead of being dropped with a 'has no styles' warning"

[CELL-RD-21]
decisions = ["Q-CELL-42"]
outputs = ["stdout.txt", "a_out.mag"]
reason = "a property value longer than the line buffer does not keep the line feed of its last chunk"

[CELL-WR-06]
decisions = ["Q-CELL-12"]
outputs = ["a_out.mag"]
reason = "uses a1 and A1 are written in the total natural order (byte tie-break: A1 first); Magic's order depends on the host qsort"

[CELL-WR-08]
decisions = ["Q-CELL-11", "Q-CELL-44"]
outputs = ["stdout.txt", "a_out.mag"]
reason = "elements are written sorted by name (Magic: hash order), and the style name red, unknown to Magic's display styles, is kept instead of being dropped with a 'has no styles' warning"

[CELL-WR-11]
decisions = ["Q-CELL-14"]
outputs = ["top.tcl"]
reason = "the command-script writer keeps instance transforms and quotes label text (corrected writer), and writes no DRC checkpaint areas (no DRC in M1, design.md Non-Goals)"

# --- UI ---------------------------------------------------------------------

[UI-G-023]
decisions = ["Q-UI-17"]
outputs = ["stdout.txt"]
reason = "windowpositions returns one list per window; Magic returns only the last window's values"

[UI-G-040]
decisions = ["Q-UI-21"]
outputs = ["stdout.txt"]
reason = "an out-of-range grid multiple is rejected without being stored"

[UI-G-065]
decisions = ["Q-UI-24"]
outputs = ["f.txt"]
reason = "feedback save writes the box coordinates with an i suffix so the file replays under any units setting"

# --- CMDEDIT ----------------------------------------------------------------

[CMDEDIT-MISC-03]
decisions = ["Q-UI-24"]
outputs = ["f.tcl"]
reason = "feedback save writes the box coordinates with an i suffix so the file replays under any units setting"

[CMDEDIT-BOX-05]
decisions = ["Q-CMDEDIT-9"]
outputs = ["stdout.txt"]
reason = "box corner DIR X Y moves the corner to (X, Y); Magic rejects the five-word form with the box help and keeps the box"

[CMDEDIT-PAINT-01]
decisions = ["Q-MODEL-12"]
outputs = ["stdout.txt"]
reason = "undo replay marks the cell modified and pending a new timestamp; saving it in the same second as the previous save prints Magic's 'writing out-of-date timestamp' note, which Magic, whose paint replay marks nothing, does not reach"

[CMDEDIT-PAINT-13]
decisions = ["Q-CMDEDIT-21"]
outputs = ["stderr.txt"]
reason = "with magic-compat ON a non-diagonal splitpaint direction is mapped as Magic maps it, with the warning 'Direction \"n\" is not a corner; using nw' (the .mag files match)"

[CMDEDIT-BOX-08]
decisions = ["Q-CMDEDIT-12"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "box values checks both corners against the coordinate limit, so 0 0 2000000000i 1 is refused with 'Box out of bounds.' and the box is kept; Magic tests only the lower-left corner"

[CMDEDIT-COORD-03]
decisions = ["Q-CMDEDIT-2"]
outputs = ["stderr.txt"]
reason = "1um+2um is evaluated as 1um as in Magic, and with magic-compat ON Hefesto warns that the trailing text was ignored"

[CMDEDIT-COORD-11]
decisions = ["Q-CMDEDIT-7", "Q-UI-21"]
outputs = ["stdout.txt"]
reason = "grid multiple 300 is rejected without being stored, so grid multiple returns 1; Magic stores 300 modulo 256 (44)"

[CMDEDIT-SEL-14]
decisions = ["Q-CMDEDIT-62"]
outputs = ["stdout.txt", "stderr.txt", "a.mag"]
reason = "orient 180v is sideways (as getcell maps it) where Magic prints the usage; orient is relative, so every later orientation and the saved transform differ by that flip"

[CMDEDIT-HIER-11]
decisions = ["Q-CELL-34"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "archive read X tries X before X.mag, so the archive just written as arch.mag is read back (with the reader's timestamp and duplicate-id notes); Magic looks for arch.mag.mag and reports 'Cannot open archive file'"
