[SCRIPT-API-11]
decisions = ["Q-SCRIPT-3"]
outputs = ["stdout.txt"]
reason = "tag %r inserts the result as one list-quoted word; Magic wraps it in unescaped double quotes, so a result with quotes or brackets breaks its tag script ('extra characters after close-quote')"

