[UI-G-013]
decisions = ["Q-UI-12", "Q-UI-42"]
outputs = ["stdout.txt"]
reason = "the copied table lists the box table's bindings: with the keysym bindings Hefesto adds (Q-UI-12) it has more entries in another hash order"

[UI-G-046]
decisions = ["Q-UI-12", "Q-UI-42"]
outputs = ["stdout.txt"]
reason = "tool info lists the button bindings, which Magic's null display cannot define (keysym names)"

[UI-G-049]
decisions = ["Q-UI-12", "Q-UI-42"]
outputs = ["stdout.txt"]
