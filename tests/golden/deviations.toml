outputs = ["stdout.txt"]
reason = "readspice reports 'port order was modified' only when an index changed; Magic compares each pin's moved-out index with n and reports every cell that already had named ports"

[SCRIPT-API-08]
decisions = ["Q-SCRIPT-3"]
outputs = ["stdout.txt"]
