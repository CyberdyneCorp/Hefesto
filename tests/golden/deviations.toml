[CELL-RD-19]
decisions = ["Q-CELL-11", "Q-CELL-44"]
outputs = ["stdout.txt", "a_out.mag"]
reason = "elements are written sorted by name (Magic: hash order), and the style name red, unknown to Magic's display styles, is kept instead of being dropped with a 'has no styles' warning"

[CELL-RD-21]
decisions = ["Q-CELL-42"]
outputs = ["stdout.txt", "a_out.mag"]
reason = "a property value longer than the line buffer does not keep the line feed of its last chunk"

[CELL-WR-06]
