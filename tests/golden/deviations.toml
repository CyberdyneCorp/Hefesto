[UI-G-013]
decisions = ["Q-UI-12", "Q-UI-42"]
outputs = ["stdout.txt"]
reason = "the copied table lists the box table's bindings: with the keysym bindings Hefesto adds (Q-UI-12) it has more entries in another hash order"

[UI-G-046]
decisions = ["Q-UI-12", "Q-UI-42"]
outputs = ["stdout.txt"]
reason = "tool info lists the button bindings, which Magic's null display cannot define (keysym names)"

[UI-G-049]
decisions = ["Q-UI-12", "Q-UI-42"]
outputs = ["stdout.txt"]
reason = "the box, wiring and color tables hold the keysym and button bindings Magic's null display cannot define, so they list more entries in another hash order (the wiring copy of Magic's headless table is reproduced exactly by macro_test 'null-display bindings')"

# --- CMDEDIT ----------------------------------------------------------------

[CMDEDIT-MISC-03]
decisions = ["Q-UI-24"]
outputs = ["f.tcl"]
reason = "feedback save writes the box coordinates with an i suffix so the file replays under any units setting"

[CMDEDIT-BOX-05]
decisions = ["Q-CMDEDIT-9"]
outputs = ["stdout.txt"]
reason = "box corner DIR X Y moves the corner to (X, Y); Magic rejects the five-word form with the box help and keeps the box"

[CMDEDIT-PAINT-13]
decisions = ["Q-CMDEDIT-21"]
outputs = ["stderr.txt"]
reason = "with magic-compat ON a non-diagonal splitpaint direction is mapped as Magic maps it, with the warning 'Direction \"n\" is not a corner; using nw' (the .mag files match)"

[CMDEDIT-BOX-08]
decisions = ["Q-CMDEDIT-12"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "box values checks both corners against the coordinate limit, so 0 0 2000000000i 1 is refused with 'Box out of bounds.' and the box is kept; Magic tests only the lower-left corner"

[CMDEDIT-COORD-03]
decisions = ["Q-CMDEDIT-2"]
outputs = ["stderr.txt"]
reason = "1um+2um is evaluated as 1um as in Magic, and with magic-compat ON Hefesto warns that the trailing text was ignored"

[CMDEDIT-COORD-11]
decisions = ["Q-CMDEDIT-7", "Q-UI-21"]
outputs = ["stdout.txt"]
reason = "grid multiple 300 is rejected without being stored, so grid multiple returns 1; Magic stores 300 modulo 256 (44)"

[CMDEDIT-SEL-14]
decisions = ["Q-CMDEDIT-62"]
outputs = ["stdout.txt", "stderr.txt", "a.mag"]
reason = "orient 180v is sideways (as getcell maps it) where Magic prints the usage; orient is relative, so every later orientation and the saved transform differ by that flip"

[CMDEDIT-HIER-11]
decisions = ["Q-CELL-34"]
outputs = ["stdout.txt", "stderr.txt"]
reason = "archive read X tries X before X.mag, so the archive just written as arch.mag is read back (with the reader's timestamp and duplicate-id notes); Magic looks for arch.mag.mag and reports 'Cannot open archive file'"

# --- MISC -------------------------------------------------------------------

[MISC-MH-10]
decisions = ["Q-MISC-14"]
outputs = ["stdout.txt", "stderr.txt", "top.mag"]
reason = "flatten -doinplace also copies the hints of the flattened grandchild (MASKHINTS_X); Magic copies only the flattened instance's own hints and loses them"

[MISC-MH-11]
decisions = ["Q-MISC-15"]
outputs = ["stdout.txt", "stderr.txt", "flat.mag"]
reason = "flatten -doproperty also copies the hints of the flattened instances and their flattened descendants (MASKHINTS_F, MASKHINTS_X); Magic copies only the kept instance's hints (MASKHINTS_K, kept under magic-compat)"

