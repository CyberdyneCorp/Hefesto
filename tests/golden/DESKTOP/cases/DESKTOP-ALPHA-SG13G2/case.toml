#
# DESKTOP-ALPHA-SG13G2 (DESKTOP/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Script: tests/e2e/desktop_alpha_sg13g2.tcl (copied unchanged).

schema = 1
id = "DESKTOP-ALPHA-SG13G2"
area = "DESKTOP"
capability = "scripting-pdk-integration"
requirements = ["PDK startup file contract", "PDK device-script contract", "Command surface used by device generators"]
tool = "magic"
description = "Desktop Alpha exit check on ihp-sg13g2 (design D18)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "ihp-sg13g2", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "ihp-sg13g2"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "saved.mag"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
