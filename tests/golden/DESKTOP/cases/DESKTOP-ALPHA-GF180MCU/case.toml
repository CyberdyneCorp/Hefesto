#
# DESKTOP-ALPHA-GF180MCU (DESKTOP/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Script: tests/e2e/desktop_alpha_gf180mcu.tcl (copied unchanged).
# Needs the fixed-device library (libs.ref/*_fd_pr/mag) in the pinned data set (scripts/fetch_pdk.py); capture fails until it is added.

schema = 1
id = "DESKTOP-ALPHA-GF180MCU"
area = "DESKTOP"
capability = "scripting-pdk-integration"
requirements = ["PDK startup file contract", "PDK device-script contract", "Command surface used by device generators"]
tool = "magic"
description = "Desktop Alpha exit check on gf180mcuD (design D18)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "gf180mcuD", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "gf180mcuD"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic"
to = "pdk/gf180mcuD/libs.tech/magic"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/mag/gf180mcu_fd_sc_mcu7t5v0__inv_1.mag"
to = "pdk/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/mag/gf180mcu_fd_sc_mcu7t5v0__inv_1.mag"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/mag/gf180mcu_fd_sc_mcu7t5v0__nand2_1.mag"
to = "pdk/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/mag/gf180mcu_fd_sc_mcu7t5v0__nand2_1.mag"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.ref/gf180mcu_fd_pr/mag/npn_10p00x10p00_0.mag"
to = "pdk/gf180mcuD/libs.ref/gf180mcu_fd_pr/mag/npn_10p00x10p00_0.mag"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "saved.mag"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
