#
# UI-G-065 (UI/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.
# Q-UI-24 (fix): Hefesto writes the box coordinates with an `i` suffix; the deviation is
# recorded in tests/golden/deviations.toml by INTEGRATION.

schema = 1
id = "UI-G-065"
area = "UI"
capability = "ui-feedback-and-highlights"
requirements = ["feedback command"]
tool = "magic"
description = "The UI-G-063/064 areas plus a quoted text, then feedback save f.txt."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "f.txt"
source = "f.txt"
comparator = "bytes"
masks = []
