#
# UI-G-067 (UI/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.
# solid_highlights is a long name of the mos display styles, which both tools read at startup.

schema = 1
id = "UI-G-067"
area = "UI"
capability = "ui-feedback-and-highlights"
requirements = ["feedback command"]
tool = "magic"
description = "feedback add with a numeric third argument, an unknown style and a style long name."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.dstyle"
to = "mos.OpenGL.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.std.cmap"
to = "mos.OpenGL.std.cmap"

[[external]]
source = "magic-sys"
path = "graphics/color.glyphs"
to = "color.glyphs"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
