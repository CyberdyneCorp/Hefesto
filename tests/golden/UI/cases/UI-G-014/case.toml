schema = 1
id = "UI-G-014"
area = "UI"
capability = "ui-command-dispatch"
requirements = ["macro and imacro commands"]
tool = "magic"
description = "macro wind3d L \"level up\" in a build without 3-D."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
