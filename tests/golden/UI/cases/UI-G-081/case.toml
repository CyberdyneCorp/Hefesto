#
# UI-G-081 (UI/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.
# *files prints each descriptor's inode number, which changes from run to run, and the
# type of descriptor 0, which is the runner's standard input: both masked.

schema = 1
id = "UI-G-081"
area = "UI"
capability = "ui-wizard-and-debug"
requirements = ["Layout wizard commands", "Window-client wizard commands"]
tool = "magic"
description = "*coord with a box set; *winddebug twice; *files."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", 'regex:(?<=inode number )\d+', 'regex:(?<=file descriptor 0: open  \(type: \x27)[^\x27]+', "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", 'regex:(?<=inode number )\d+', 'regex:(?<=file descriptor 0: open  \(type: \x27)[^\x27]+', "magic-tech-sections"]
