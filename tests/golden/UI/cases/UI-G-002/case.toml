schema = 1
id = "UI-G-002"
area = "UI"
capability = "ui-command-dispatch"
requirements = ["Command name lookup", "Command dispatch across global and client tables"]
tool = "magic"
description = "The prefix e and the unique prefix extr are not command names in a script (Q-UI-41); the registered alias id is (ext, the alias of extract, waits for the extractor)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
