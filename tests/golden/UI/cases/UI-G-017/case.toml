#
# UI-G-017 (UI/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "UI-G-017"
area = "UI"
capability = "ui-command-dispatch"
requirements = ["Command logging"]
tool = "magic"
description = "logcommands log.txt update; box 0 0 1 1; logcommands."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "log.txt"
source = "log.txt"
comparator = "bytes"
masks = []
