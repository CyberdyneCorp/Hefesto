#
# LEG-MZ-10 (LEGACY/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/legacy_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Capture runs 45817717718 and 45865742204: Magic exits 139 (SIGSEGV) in the third probe (start already connected to the destination), after "Start label 'nosuch' not found.". Crash fixed in both modes (standing rule); stdout shows the last probe that finished.

schema = 1
id = "LEG-MZ-10"
area = "LEGACY"
capability = "router-maze-iroute"
requirements = ["iroute route options", "Route results"]
tool = "magic"
description = "iroute route -foo; -slabel nosuch; start already connected to the destination; Magic's exit status is recorded because its first capture ended in SIGSEGV (exit 139)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "exit.txt"
source = "exitcode"
comparator = "bytes"
masks = []
