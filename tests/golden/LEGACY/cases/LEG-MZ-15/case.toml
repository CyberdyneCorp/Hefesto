#
# LEG-MZ-15 (LEGACY/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/legacy_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Capture run 45817717718: Magic exited 139 (SIGSEGV) during the route. Crash fixed in both modes (standing rule); stdout shows the last probe that finished, and routed.mag is collected only when written.

schema = 1
id = "LEG-MZ-15"
area = "LEGACY"
capability = "router-maze"
requirements = ["Destination areas", "Walk extension"]
tool = "magic"
description = "destination label B on a small part of a larger same-net metal1 area; expandEndpoints on; Magic's exit status is recorded because its first capture ended in SIGSEGV (exit 139)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "exit.txt"
source = "exitcode"
comparator = "bytes"
masks = []

[[collect]]
pattern = "routed.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
