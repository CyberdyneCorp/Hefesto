#
# LEG-MZ-28 (LEGACY/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/legacy_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Q-LEGACY-40 verify: the outcome is read from exit.txt (137: killed by the guard), stdout (the prompt and the Tcl result) and collected/routed.mag (present only if the route ended).

schema = 1
id = "LEG-MZ-28"
area = "LEGACY"
capability = "router-maze-iroute"
requirements = ["Route context and endpoints"]
tool = "magic"
description = "two unconnected nodes (metal1 X, metal2 Y) under the start point; batch run with standard input at end of file, under timeout -s KILL 120 (Q-LEGACY-40 verify: exit status 137 is the outcome 'hang')"

[reference]
script = "input/commands.tcl"
argv = ["timeout", "-s", "KILL", "120", "magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "exit.txt"
source = "exitcode"
comparator = "bytes"
masks = []

[[collect]]
pattern = "routed.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
