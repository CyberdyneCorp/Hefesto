#
# LEG-MZ-27 (LEGACY/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/legacy_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "LEG-MZ-27"
area = "LEGACY"
capability = "router-maze-iroute"
requirements = ["Derived irouter style", "iroute availability and dispatch"]
tool = "magic"
description = "sky130A (no irouter style in its mzrouter section): iroute, iroute layers (Q-LEGACY-37, ON)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
