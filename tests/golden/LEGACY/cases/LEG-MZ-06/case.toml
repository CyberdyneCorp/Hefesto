#
# LEG-MZ-06 (LEGACY/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/legacy_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "LEG-MZ-06"
area = "LEGACY"
capability = "router-maze"
requirements = ["Hint, fence and rotate layers"]
tool = "magic"
description = "as LEG-MZ-03 with magnet paint offset 20 from the straight line"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "routed.mag"
source = "routed.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
