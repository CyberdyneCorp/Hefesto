#
# LEG-MZ-14 (LEGACY/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/legacy_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "LEG-MZ-14"
area = "LEGACY"
capability = "router-maze"
requirements = ["Cost estimation", "Windowed bloom search"]
tool = "magic"
description = "an opaque unexpanded subcell between A and B; verbosity 2 statistics with estimation on (r1.mag) and off (r2.mag)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "r1.mag"
source = "r1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "r2.mag"
source = "r2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
