#
# MISC-PLOT-18 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "MISC-PLOT-18"
area = "MISC"
capability = "plot-output"
requirements = ["Plot command and plotted region", "PNM rasterisation and file format"]
tool = "magic"
description = "the .pnm extension rule (Q-MISC-55, ON): plot pnm out 100, plot pnm ./out2 100, plot pnm sub.d/out3 100 (a name with a dot keeps it)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "out.pnm"
source = "out.pnm"
comparator = "pnm-image"
masks = []

[[outputs]]
name = "out2"
source = "out2"
comparator = "pnm-image"
masks = []

[[outputs]]
name = "sub.d__out3"
source = "sub.d/out3"
comparator = "pnm-image"
masks = []
