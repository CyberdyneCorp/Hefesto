#
# MISC-3D-11 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Captured in the magic-gl image (m10-3d-view design D13, Open Question 3 (a)).

schema = 1
id = "MISC-3D-11"
area = "MISC"
capability = "view-3d"
requirements = ["Opening the 3D window", "3D view commands"]
tool = "magic"
description = "technology with no cifoutput section (Q-MISC-73): specialopen wind3d, then the camera, cif and render; Magic dereferences the missing output style when the window opens"

[reference]
script = "input/commands.tcl"
argv = ["timeout", "-s", "KILL", "300", "magic", "-d", "OGL", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"
image = "magic-gl"
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "OGL", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.dstyle"
to = "mos.OpenGL.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.std.cmap"
to = "mos.OpenGL.std.cmap"

[[external]]
source = "magic-sys"
path = "graphics/color.glyphs"
to = "color.glyphs"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "exit.txt"
source = "exitcode"
comparator = "bytes"
masks = []
