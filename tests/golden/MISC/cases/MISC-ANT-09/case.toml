#
# MISC-ANT-09 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/antenna_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/top.mag; input/anttest.tech (authoring/antenna_cases.py; design D21).

schema = 1
id = "MISC-ANT-09"
area = "MISC"
capability = "antenna-check"
requirements = ["Shared antenna definitions for LEF output"]
tool = "magic"
description = "lef write of a macro whose input pin drives two 2x10 nfet gates and whose output pin reaches an ndiff tie-down: ANTENNAGATEAREA and ANTENNADIFFAREA from the antenna check's gate and tie-down sets"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "top.lef"
source = "top.lef"
comparator = "lef-text"
masks = []
