#
# MISC-MH-06 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.

schema = 1
id = "MISC-MH-06"
area = "MISC"
capability = "mask-hints"
requirements = ["Mask hints from cifinput templayers"]
tool = "magic"
description = "cifinput templayers SRAMH (81/2) and SRAMH2 (81/3), each with mask-hints SRAM: MASKHINTS_SRAM after a GDS read (Q-MISC-11: Magic keeps only the second region, Hefesto the union)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
