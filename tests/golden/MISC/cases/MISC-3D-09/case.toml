#
# MISC-3D-09 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Captured in the magic-gl image (m10-3d-view design D13, Open Question 3 (a)).

schema = 1
id = "MISC-3D-09"
area = "MISC"
capability = "view-3d"
requirements = ["Default view", "3D view commands"]
tool = "magic"
description = "cif round trip with scalefactor 30 nanometers (f = 3 after the GCF reduction) on the cell (-15,-7)-(86,44): values at open, after a relative scroll and zoom, after four cif toggles and after defaults"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "OGL", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"
image = "magic-gl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "OGL", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.dstyle"
to = "mos.OpenGL.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.std.cmap"
to = "mos.OpenGL.std.cmap"

[[external]]
source = "magic-sys"
path = "graphics/color.glyphs"
to = "color.glyphs"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
