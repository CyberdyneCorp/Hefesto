schema = 1
id = "MISC-FL-03"
area = "MISC"
capability = "font-labels"
requirements = ["Transforming font labels"]
tool = "magic"
description = "Child font label (rotation 30, offset 1 0) placed 90 and v; flatten; flatten -dotoplabels; flatten -doinplace -dotoplabels child_0; flatten -doinplace -nolabels -dotoplabels child_1 (Q-MISC-21)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeSerif.pt3"
to = "FreeSerif.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeMono.pt3"
to = "FreeMono.pt3"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "child.mag"
source = "child.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "flat.mag"
source = "flat.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "flat_t.mag"
source = "flat_t.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
