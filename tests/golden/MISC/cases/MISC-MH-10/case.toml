#
# MISC-MH-10 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "MISC-MH-10"
area = "MISC"
capability = "mask-hints"
requirements = ["Copying, flattening and transforming hints"]
tool = "magic"
description = "Two-level hierarchy with a hint at each level (leaf X inside mid, mid Y); flatten -doinplace the mid instance: Magic copies only Y, Hefesto also X (Q-MISC-14)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "leaf.mag"
source = "leaf.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "mid.mag"
source = "mid.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
