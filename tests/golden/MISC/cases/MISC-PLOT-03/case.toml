#
# MISC-PLOT-03 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "MISC-PLOT-03"
area = "MISC"
capability = "plot-output"
requirements = ["PostScript cell outlines", "PostScript labels", "PostScript label margins"]
tool = "magic"
description = "an unexpanded 3 x 2 array of a subcell, labels at all nine positions (two on the area's edges, Q-MISC-43; one with '(', Q-MISC-42), area (90,90)-(210,200) not at the origin; plot postscript c.ps"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "c.ps"
source = "c.ps"
comparator = "ps-text"
masks = []
