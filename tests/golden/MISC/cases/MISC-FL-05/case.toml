#
# MISC-FL-05 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.

schema = 1
id = "MISC-FL-05"
area = "MISC"
capability = "font-labels"
requirements = ["GDS representation of font attributes"]
tool = "magic"
description = "Font labels with each of the 9 justifications (FreeSans and FreeSerif, sizes 8..72, rotations 0..315) on metal1; gds write; the cell renamed; gds read of the output; the re-read cell saved."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeSerif.pt3"
to = "FreeSerif.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeMono.pt3"
to = "FreeMono.pt3"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "out.gds"
source = "out.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
