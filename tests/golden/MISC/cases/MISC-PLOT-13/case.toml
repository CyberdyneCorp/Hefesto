#
# MISC-PLOT-13 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Q-MISC-51 (a) mask: the three `plot versatec` lines of each help list; every other line is compared.
# Captured in the magic-cairo image (m10-plot-route design D19, Q-MISC-52 (a)).

schema = 1
id = "MISC-PLOT-13"
area = "MISC"
capability = "plot-output"
requirements = ["Plot command and plotted region"]
tool = "magic"
description = "plot, plot help and plot foo in Magic's Cairo Tcl build (the option list with `svg`); plot versatec is not run (it would spool through lp)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "XR", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"
image = "magic-cairo"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "XR", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
