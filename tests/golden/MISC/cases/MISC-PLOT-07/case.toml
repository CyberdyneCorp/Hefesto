#
# MISC-PLOT-07 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "MISC-PLOT-07"
area = "MISC"
capability = "plot-output"
requirements = ["PNM rasterisation and file format"]
tool = "magic"
description = "the region of MISC-PLOT-06 at 50, 33 and 1000 pixels (antialiasing, scale below and above 1)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "out50.pnm"
source = "out50.pnm"
comparator = "pnm-image"
masks = []

[[outputs]]
name = "out33.pnm"
source = "out33.pnm"
comparator = "pnm-image"
masks = []

[[outputs]]
name = "out1000.pnm"
source = "out1000.pnm"
comparator = "pnm-image"
masks = []
