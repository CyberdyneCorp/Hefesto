#
# MISC-MH-02 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "MISC-MH-02"
area = "MISC"
capability = "mask-hints"
requirements = ["Mask hints in .mag files"]
tool = "magic"
description = "A hint 0 0 9 9 read at the default grid, then a file at magscale 1 2 with the same hint (the grid becomes 1/2), then scalegrid 1 2; the hint values after each step; writeall."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "input__a.mag"
source = "input/a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "input__b.mag"
source = "input/b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
