#
# MISC-MH-03 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# Magic 8.3.694 takes `property plane` as the compat switch (PROPERTY_TYPE_COMPAT is the index of plane, commands/CmdLQ.c:2345-2348); `property compat false` would query a property named false.
# Q-MISC-10 (fix): Magic reads the dimension line back as integers, which its mask-hints operator then takes for a hint plane (cif/CIFgen.c:5695), so its write may crash.

schema = 1
id = "MISC-MH-03"
area = "MISC"
capability = "mask-hints"
requirements = ["Mask hints in .mag files", "Mask-hint output operator"]
tool = "magic"
description = "Property compat mode off (property plane false): a cell with MASKHINTS_SRAM saved (a dimension line), flushed and read back; the hint queried; gds write with a mask-hints SRAM layer (Q-MISC-10)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "out.gds"
source = "out.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
