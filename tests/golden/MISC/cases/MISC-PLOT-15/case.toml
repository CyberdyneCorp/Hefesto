#
# MISC-PLOT-15 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "MISC-PLOT-15"
area = "MISC"
capability = "plot-output"
requirements = ["PNM rasterisation and file format", "PNM style lines"]
tool = "magic"
description = "gf180mcuD gf180mcu_fd_sc_mcu7t5v0__inv_1; plot pnm inv 400"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "gf180mcuD", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "gf180mcuD"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic"
to = "pdk/gf180mcuD/libs.tech/magic"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/mag/gf180mcu_fd_sc_mcu7t5v0__inv_1.mag"
to = "pdk/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/mag/gf180mcu_fd_sc_mcu7t5v0__inv_1.mag"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "inv.pnm"
source = "inv.pnm"
comparator = "pnm-image"
masks = []
