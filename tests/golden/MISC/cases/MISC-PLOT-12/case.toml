#
# MISC-PLOT-12 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Captured in the magic-cairo image (m10-plot-route design D19, Q-MISC-52 (a)).

schema = 1
id = "MISC-PLOT-12"
area = "MISC"
capability = "plot-output"
requirements = ["SVG plot"]
tool = "magic"
description = "plot svg v under the Cairo display (-d XR): v.svg written for the whole window; compared on the root element, the file name and the numeric width and height (svg-shape)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "XR", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"
image = "magic-cairo"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "XR", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "v.svg"
source = "v.svg"
comparator = "svg-shape"
masks = []
