#
# MISC-3D-17 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Captured in the magic-gl image (m10-3d-view design D13, Open Question 3 (a)).

schema = 1
id = "MISC-3D-17"
area = "MISC"
capability = "view-3d"
requirements = ["Rendered geometry"]
tool = "magic"
description = "mask-layer mode with render statements (sky130A stand-in): MET1, MET2 and POLY prisms, a split tile, the temporary layer and NWELL (no render: flat) clipped to the bounding box"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "OGL", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"
image = "magic-gl"
gl_capture = true

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "OGL", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[env]
HEFESTO_GL_CAPTURE = "{work}/gl.log"

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.dstyle"
to = "mos.OpenGL.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.std.cmap"
to = "mos.OpenGL.std.cmap"

[[external]]
source = "magic-sys"
path = "graphics/color.glyphs"
to = "color.glyphs"

[[outputs]]
name = "gl-faces.txt"
source = "derived:gl-faces:gl.log"
comparator = "bytes"
masks = []
