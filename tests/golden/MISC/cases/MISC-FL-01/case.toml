#
# MISC-FL-01 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "MISC-FL-01"
area = "MISC"
capability = "font-labels"
requirements = ["Font label geometry", "Outline font file loading"]
tool = "magic"
description = "label A FreeSans 10 0 0 0 center m1 at (0,0) on metal1; save (flabel line)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeSerif.pt3"
to = "FreeSerif.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeMono.pt3"
to = "FreeMono.pt3"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
