#
# MISC-PLOT-14 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "MISC-PLOT-14"
area = "MISC"
capability = "plot-output"
requirements = ["PNM rasterisation and file format", "PNM style lines"]
tool = "magic"
description = "sky130A sky130_fd_sc_hd__inv_1 (pnm `default`, `draw ... no_color_at_all`); plot pnm inv (1000 pixels)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "pdk"
path = "sky130A/libs.ref/sky130_fd_sc_hd/mag/sky130_fd_sc_hd__inv_1.mag"
to = "pdk/sky130A/libs.ref/sky130_fd_sc_hd/mag/sky130_fd_sc_hd__inv_1.mag"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "inv.pnm"
source = "inv.pnm"
comparator = "pnm-image"
masks = []
