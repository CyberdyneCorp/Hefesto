#
# MISC-PLOT-17 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Q-MISC-51 (a) mask: the `pnmplotRTL:` line and the "HP/Versatec plotting parameters are:" group of the listing `plot parameters nosuch 1` prints; every other line is compared.

schema = 1
id = "MISC-PLOT-17"
area = "MISC"
capability = "plot-output"
requirements = ["Plot command and plotted region", "Plot parameters"]
tool = "magic"
description = "argument errors: plot postscript, plot pnm a 1 2 3, plot pnm x abc, plot pnm x 0, plot parameters ps_cellid 3 (ambiguous), plot parameters nosuch 1"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
