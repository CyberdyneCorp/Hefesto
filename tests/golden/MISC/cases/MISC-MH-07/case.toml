schema = 1
id = "MISC-MH-07"
area = "MISC"
capability = "mask-hints"
requirements = ["Copying, flattening and transforming hints"]
tool = "magic"
description = "Child with a hint placed with rotation 90; flatten into a new cell; flatten -doinplace the instance."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
