masks = ["mag-timestamp"]

[[outputs]]
name = "flat.mag"
source = "flat.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
