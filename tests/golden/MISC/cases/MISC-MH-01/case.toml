schema = 1
id = "MISC-MH-01"
area = "MISC"
capability = "mask-hints"
requirements = ["Mask hints in .mag files", "Setting mask hints with the property command"]
tool = "magic"
description = "property MASKHINTS_SRAM with two overlapping rectangles; save; read back a file with a hint value."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
