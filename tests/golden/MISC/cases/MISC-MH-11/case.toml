#
# MISC-MH-11 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "MISC-MH-11"
area = "MISC"
capability = "mask-hints"
requirements = ["Copying, flattening and transforming hints"]
tool = "magic"
description = "flatten -doproperty: a kept instance (keep, hint K) and a flattened one (fl, hint F, with a flattened leaf, hint X): Magic copies only K, Hefesto F and X as well (Q-MISC-15)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "flat.mag"
source = "flat.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
