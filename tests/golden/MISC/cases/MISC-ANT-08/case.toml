#
# MISC-ANT-08 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/antenna_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written input/top.ext and input/top.mag; input/anttest.tech (authoring/antenna_cases.py; design D21).

schema = 1
id = "MISC-ANT-08"
area = "MISC"
capability = "antenna-check"
requirements = ["Gate nets visited once", "Antenna check command"]
tool = "magic"
description = "150 distinct gate nets on 200 devices (the first 50 nets twice): the progress line after 100 distinct gate nets, once"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
