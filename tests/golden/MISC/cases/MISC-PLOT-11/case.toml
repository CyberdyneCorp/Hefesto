#
# MISC-PLOT-11 (MISC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m10_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Capture run 45816703069: Magic exited 139 (SIGSEGV) after 'Warning:  No plot section in techfile, using defaults.' in plot pnm (plot/plotPNM.c:600-604, default styles on -dnull). Capture run 45865742204 (PostScript first): plot postscript also exits 139, leaving an empty x.ps. Crash fixed in both modes (standing rule); the files are collected only when written.

schema = 1
id = "MISC-PLOT-11"
area = "MISC"
capability = "plot-output"
requirements = ["Technology plot section structure"]
tool = "magic"
description = "a technology with no plot section; plot postscript x.ps, then plot pnm x (the warning, then the default PNM styles); Magic's exit status is recorded because its first capture ended in SIGSEGV (exit 139) right after the PNM warning"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.dstyle"
to = "mos.7bit.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.7bit.std.cmap"
to = "mos.7bit.std.cmap"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "exit.txt"
source = "exitcode"
comparator = "bytes"
masks = []

[[collect]]
pattern = "x.ps"
comparator = "ps-text"
masks = []

[[collect]]
pattern = "x.pnm"
comparator = "pnm-image"
masks = []
