#
# LEFDEF-111 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): 2 writes in one session, compared side by side: lef write inv; lef write inv2.

schema = 1
id = "LEFDEF-111"
area = "LEFDEF"
capability = "lef-write"
requirements = ["Library header", "Macro PROPERTY lines"]
tool = "magic"
description = "Cell with LEFproperties `CDL \"inv x\" MASK 1` and `A 1 B` variants. Captures: PROPERTYDEFINITIONS and PROPERTY lines."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "inv.lef"
source = "inv.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "inv2.lef"
source = "inv2.lef"
comparator = "lef-text"
masks = []
