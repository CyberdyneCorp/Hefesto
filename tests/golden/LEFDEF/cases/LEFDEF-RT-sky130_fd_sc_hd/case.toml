#
# LEFDEF-RT-sky130_fd_sc_hd (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF-RT case (m6-lef-def-oasis task 15.5): fresh session with the PDK's rc and random seed 1.
# lefdef_rt.lef is compared through its SHA-256 and per-macro summary (goldenlib/derived.py).
# Needs the sky130-lef set: golden-capture.yml FETCH_LEF_SETS must be "true".

schema = 1
id = "LEFDEF-RT-sky130_fd_sc_hd"
area = "LEFDEF"
capability = "lef-write"
requirements = ["LEF file grammar", "Library header", "Macro header lines", "Pin enumeration and ordering", "PORT blocks", "Geometry record emission", "writeall macro order"]
tool = "magic"
description = "Library round trip of sky130A sky130_fd_sc_hd: lef read of sky130_fd_sc_hd__nom.tlef and sky130_fd_sc_hd.lef, a wrapper placing every cell read, lef writeall -notop."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "pdk"
set = "sky130-lef"
path = "sky130A/libs.ref/sky130_fd_sc_hd/techlef/sky130_fd_sc_hd__nom.tlef"
to = "lef/sky130_fd_sc_hd__nom.tlef"

[[external]]
source = "pdk"
set = "sky130-lef"
path = "sky130A/libs.ref/sky130_fd_sc_hd/lef/sky130_fd_sc_hd.lef"
to = "lef/sky130_fd_sc_hd.lef"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "lefdef_rt.lef.sha256"
source = "derived:digest:lefdef_rt.lef"
comparator = "bytes"
masks = []

[[outputs]]
name = "lefdef_rt.lef.summary.txt"
source = "derived:lef-summary:lefdef_rt.lef"
comparator = "bytes"
masks = []
