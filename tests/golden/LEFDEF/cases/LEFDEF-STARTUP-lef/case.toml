#
# LEFDEF-STARTUP-lef (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Startup case (m6-lef-def-oasis task 15.4): the LEF read runs before any command, so its datestamp cannot be pinned; the saved cells are compared with their timestamp masked.

schema = 1
id = "LEFDEF-STARTUP-lef"
area = "LEFDEF"
capability = "app-startup"
requirements = ["Command-line file arguments"]
tool = "magic"
description = "magic -T input/lefdef input/cells.lef, commands on standard input: the LEF macros read at startup (the cells listed and saved)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "-T", "input/lefdef", "input/cells.lef"]
stdin = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "-T", "input/lefdef", "input/cells.lef"]
requires_commands = []
stdin = "input/commands.tcl"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "cells.txt"
source = "derived:files:**/*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
