#
# LEFDEF-240 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# PDK case (task 15.5): the PDK's rc and random seed 1; the sky130-lef set (golden-capture.yml FETCH_LEF_SETS must be "true").

schema = 1
id = "LEFDEF-240"
area = "LEFDEF"
capability = "def-read"
requirements = ["Unit scaling", "Design cell selection", "Die area", "VIAS section grammar", "Rectangle-based DEF vias", "COMPONENTS section", "Component placement transform", "PINS section grammar", "Pin geometry placement", "Pin port labels", "NETS and SPECIALNETS grammar", "Route layer resolution and width selection", "Route wire segment geometry", "Route via placement", "Route painting and net labels", "Top-level DEF grammar and section dispatch", "Read completion"]
tool = "magic"
description = "full OpenROAD-style small DEF (sky130 inverter chain) after tech LEF + cell LEF. Captures: complete written .mag of design cell."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeSerif.pt3"
to = "FreeSerif.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeMono.pt3"
to = "FreeMono.pt3"

[[external]]
source = "pdk"
set = "sky130-lef"
path = "sky130A/libs.ref/sky130_fd_sc_hd/techlef/sky130_fd_sc_hd__nom.tlef"
to = "lef/sky130_fd_sc_hd__nom.tlef"

[[external]]
source = "pdk"
set = "sky130-lef"
path = "sky130A/libs.ref/sky130_fd_sc_hd/lef/sky130_fd_sc_hd.lef"
to = "lef/sky130_fd_sc_hd.lef"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "inv_chain.mag"
source = "inv_chain.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
