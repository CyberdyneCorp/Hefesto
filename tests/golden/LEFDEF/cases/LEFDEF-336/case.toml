#
# LEFDEF-336 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# m7-extraction task 17.6 (Open Question 9 (a)): the inputs are LEFDEF-317's without its Magic-written top.ext; input/top.ext is written by the run and collected.

schema = 1
id = "LEFDEF-336"
area = "LEFDEF"
capability = "def-write"
requirements = ["Net classification"]
tool = "magic"
description = "LEFDEF-317's layout (vdd! without a port, port A, labeled internal clkint) extracted by extract all, then def write: SPECIALNETS / NETS membership and counts from the tool's own .ext"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "top.def"
source = "top.def"
comparator = "def-text"
masks = []

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
