#
# LEFDEF-136 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): lef write -toplayer with the nwell masterslice entry, then with the technology reloaded without it.

schema = 1
id = "LEFDEF-136"
area = "LEFDEF"
capability = "lef-write"
requirements = ["Top-layer pins"]
tool = "magic"
description = "`lef write -toplayer` on metal1/metal2 pin, with and without nwell masterslice. Captures: PORT planes and OBS."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "a.lef"
source = "a.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "b.lef"
source = "b.lef"
comparator = "lef-text"
masks = []
