#
# LEFDEF-102 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): one write per output style: nanometres, grid limit 5, grid limit 10, angstroms.

schema = 1
id = "LEFDEF-102"
area = "LEFDEF"
capability = "lef-write"
requirements = ["Output scale and LEF database units", "Distance number formatting"]
tool = "magic"
description = "Same tech with cifoutput in nanometres, gridlimit 5, then gridlimit 10, then angstroms. Captures: DATABASE MICRONS value and coordinate decimals."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "nm.lef"
source = "nm.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "g5.lef"
source = "g5.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "g10.lef"
source = "g10.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "a.lef"
source = "a.lef"
comparator = "lef-text"
masks = []
