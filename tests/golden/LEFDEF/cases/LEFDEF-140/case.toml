#
# LEFDEF-140 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): 3 writes in one session, compared side by side: lef writeall; lef writeall -notop; lef writeall -notop -all.

schema = 1
id = "LEFDEF-140"
area = "LEFDEF"
capability = "lef-write"
requirements = ["lef writeall arguments and scope", "writeall macro order"]
tool = "magic"
description = "Hierarchy top{a{c},b}; `lef writeall`, `-notop`, `-notop -all`. Captures: MACRO order and set."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "w1.lef"
source = "w1.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "w2.lef"
source = "w2.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "w3.lef"
source = "w3.lef"
comparator = "lef-text"
masks = []
