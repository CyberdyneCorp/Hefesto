#
# LEFDEF-116 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): the .mag classes, uses and shapes, then the reset, scan and tie-off uses that only a DEF read sets (lef write of the DEF design cell).

schema = 1
id = "LEFDEF-116"
area = "LEFDEF"
capability = "lef-write"
requirements = ["Pin header records"]
tool = "magic"
description = "Pins with every direction/use/shape value incl. reset/scan/tieoff. Captures: PIN header lines."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "pins.lef"
source = "pins.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "resetpins.lef"
source = "resetpins.lef"
comparator = "lef-text"
masks = []
