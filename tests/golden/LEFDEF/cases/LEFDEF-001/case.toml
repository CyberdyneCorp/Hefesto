#
# LEFDEF-001 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.

schema = 1
id = "LEFDEF-001"
area = "LEFDEF"
capability = "lef-tech-section"
requirements = ["Lef section line grammar", "Magic type resolution in lef lines", "Keyword to LEF class mapping", "LEF name aliasing and canonical names"]
tool = "magic"
description = "tech with lef section using every keyword (layer on contact/non-contact, route, routing, cut, contact, obstruction with 2 types, masterslice, overlap, bound, ignore), plus bad lines (ambiguous `rout`, missing names, 3 types, duplicate name). Captures: tech-load error messages; `lef write -tech` output of a trivial cell to observe the classes and canonical names."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "top.lef"
source = "top.lef"
comparator = "lef-text"
masks = []
