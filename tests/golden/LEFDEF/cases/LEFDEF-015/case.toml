#
# LEFDEF-015 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.

schema = 1
id = "LEFDEF-015"
area = "LEFDEF"
capability = "lef-read"
requirements = ["PIN attributes", "Port labels in creation mode", "PORT and OBS geometry"]
tool = "magic"
description = "macro with PINs using every DIRECTION/USE/SHAPE value (incl. OUTPUT TRISTATE, USE SCAN), DIRECTION after PORT, multiple RECTs and a POLYGON per PORT, two PORTs per PIN. Captures: .mag `rlabel`/`port` lines (order, indices, flags)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "cells.txt"
source = "derived:files:**/*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
