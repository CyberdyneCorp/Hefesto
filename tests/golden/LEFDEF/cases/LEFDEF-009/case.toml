#
# LEFDEF-009 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.

schema = 1
id = "LEFDEF-009"
area = "LEFDEF"
capability = "lef-read"
requirements = ["LEF LAYER section"]
tool = "magic"
description = "technology LEF: LAYER for a tech routing layer (WIDTH/SPACING twice/PITCH/DIRECTION), TYPE CUT on a routing layer, LAYER for an unmapped magic name, LAYER for a contact-type magic name, then `lef write -tech`. Captures: messages; written LAYER blocks."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "top.lef"
source = "top.lef"
comparator = "lef-text"
masks = []
