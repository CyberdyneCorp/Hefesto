#
# LEFDEF-241 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# Q-LEFDEF-83 (fix, both modes): Magic keeps the duplicate instance id u1 on the second use; Hefesto places it and renames it with the cell-file-format rule. The approved deviation (stdout.txt, stderr.txt, cells.txt) is recorded in deviations.toml after the capture.

schema = 1
id = "LEFDEF-241"
area = "LEFDEF"
capability = "def-read"
requirements = ["COMPONENTS section"]
tool = "magic"
description = "two COMPONENTS named u1 (master inv, placed at two points) after the cell LEF. Captures: message log; both uses placed, the second renamed (Hefesto) or kept with the duplicate id (Magic)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "cells.txt"
source = "derived:files:**/*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
