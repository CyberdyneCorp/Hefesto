#
# LEFDEF-318 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# Re-authored (decision D4, 2026-11-19): Magic crashed on the first input (SIGSEGV in def write: the unlabeled net m1_0_50#, a net neither special nor a port (Q-LEFDEF-101)); that input is kept in tests/golden/LEFDEF/magic-crash/LEFDEF-318/ for Hefesto-only tests.

schema = 1
id = "LEFDEF-318"
area = "LEFDEF"
capability = "def-write"
requirements = ["Net classification"]
tool = "magic"
description = "same as 317 with `-allspecial`. Captures: SPECIALNETS contents; no NETS."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "top.def"
source = "top.def"
comparator = "def-text"
masks = []
