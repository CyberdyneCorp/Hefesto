#
# LEFDEF-002 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.

schema = 1
id = "LEFDEF-002"
area = "LEFDEF"
capability = "lef-tech-section"
requirements = ["Default routing parameters", "Filling defaults after grid scaling"]
tool = "magic"
description = "1:1-grid tech with DRC width/spacing for m1 and none for m5; `lef write -tech`. Captures: WIDTH/SPACING lines for m1 (expected absent) and m5 (3/4 in µm)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "top.lef"
source = "top.lef"
comparator = "lef-text"
masks = []
