#
# LEFDEF-315 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# The reset, scan and tie-off port uses exist only through a DEF read (Magic's .mag and port commands do not set them), so the cell is the DEF design cell.

schema = 1
id = "LEFDEF-315"
area = "LEFDEF"
capability = "def-write"
requirements = ["PINS section"]
tool = "magic"
description = "port labels with every class/use combination incl. default, reset, tieoff. Captures: PINS section."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "p.def"
source = "p.def"
comparator = "def-text"
masks = []
