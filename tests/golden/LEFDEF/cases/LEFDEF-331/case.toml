#
# LEFDEF-331 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): 2 writes in one session, compared side by side: def write; def write.

schema = 1
id = "LEFDEF-331"
area = "LEFDEF"
capability = "def-write"
requirements = ["Session state after writing"]
tool = "magic"
description = "write cell with wide wire, then write second cell without. Captures: second file still has rule."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "c1.def"
source = "c1.def"
comparator = "def-text"
masks = []

[[outputs]]
name = "c2.def"
source = "c2.def"
comparator = "def-text"
masks = []
