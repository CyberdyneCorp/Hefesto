#
# LEFDEF-RT-sg13g2_stdcell (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF-RT case (m6-lef-def-oasis task 15.5): fresh session with the PDK's rc and random seed 1.
# lefdef_rt.lef is compared through its SHA-256 and per-macro summary (goldenlib/derived.py).
# Needs the ihp-lef set: golden-capture.yml FETCH_LEF_SETS must be "true".

schema = 1
id = "LEFDEF-RT-sg13g2_stdcell"
area = "LEFDEF"
capability = "lef-write"
requirements = ["LEF file grammar", "Library header", "Macro header lines", "Pin enumeration and ordering", "PORT blocks", "Geometry record emission", "writeall macro order"]
tool = "magic"
description = "Library round trip of ihp-sg13g2 sg13g2_stdcell: lef read of sg13g2_tech.lef and sg13g2_stdcell.lef, a wrapper placing every cell read, lef writeall -notop."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "ihp-sg13g2", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "ihp-sg13g2"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[external]]
source = "pdk"
set = "ihp-lef"
path = "ihp-sg13g2/libs.ref/sg13g2_stdcell/lef/sg13g2_tech.lef"
to = "lef/sg13g2_tech.lef"

[[external]]
source = "pdk"
set = "ihp-lef"
path = "ihp-sg13g2/libs.ref/sg13g2_stdcell/lef/sg13g2_stdcell.lef"
to = "lef/sg13g2_stdcell.lef"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "lefdef_rt.lef.sha256"
source = "derived:digest:lefdef_rt.lef"
comparator = "bytes"
masks = []

[[outputs]]
name = "lefdef_rt.lef.summary.txt"
source = "derived:lef-summary:lefdef_rt.lef"
comparator = "bytes"
masks = []

[[outputs]]
name = "lefdef_rt.probe.lef"
source = "lefdef_rt.probe.lef"
comparator = "bytes"
masks = []
