#
# LEFDEF-300 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.

schema = 1
id = "LEFDEF-300"
area = "LEFDEF"
capability = "def-write"
requirements = ["Output scale and number formatting", "DEF output file grammar and section order"]
tool = "magic"
description = "tech demo (10 nm grid, metal1/metal2/via1 lef section); empty cell `e`; `def write`. Captures: full e.def."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "e.def"
source = "e.def"
comparator = "def-text"
masks = []
