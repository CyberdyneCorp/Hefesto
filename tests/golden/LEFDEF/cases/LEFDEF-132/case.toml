#
# LEFDEF-132 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): 2 writes in one session, compared side by side: lef write -hide; lef write -hide.

schema = 1
id = "LEFDEF-132"
area = "LEFDEF"
capability = "lef-write"
requirements = ["Obstructions with zero setback"]
tool = "magic"
description = "`lef write -hide` with OBS_BBOX property valid and malformed. Captures: OBS cover extent; error text."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "obsok.lef"
source = "obsok.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "obsbad.lef"
source = "obsbad.lef"
comparator = "lef-text"
masks = []
