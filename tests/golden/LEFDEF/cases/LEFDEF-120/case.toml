#
# LEFDEF-120 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.

schema = 1
id = "LEFDEF-120"
area = "LEFDEF"
capability = "lef-write"
requirements = ["Pin enumeration and ordering"]
tool = "magic"
description = "Labels listed in order Y(1), A(0), VDD(2), gap at index 3, OUT(4). Captures: PIN order."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "order.lef"
source = "order.lef"
comparator = "lef-text"
masks = []
