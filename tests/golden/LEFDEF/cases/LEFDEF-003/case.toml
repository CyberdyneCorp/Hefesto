#
# LEFDEF-003 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): a 2:1-grid technology (lef write -tech, a DEF net with no width, writeall), then a shrinking grid (tech lambda 1 2, the plain technology reloaded, lef write -tech).
# Re-authored (decision D4, 2026-11-19): Magic crashed on the first input (SIGFPE: its minimum-grid style was scalefactor 20 nanometers with gridlimit 10, so Magic computed 0 internal units per lambda and divided by zero in the table rescale (utils/tech.c:808-823, cif/CIFtech.c CIFTechOutputScale); the style now uses scalefactor 20 (centimicrons)); that input is kept in tests/golden/LEFDEF/magic-crash/LEFDEF-003/ for Hefesto-only tests.

schema = 1
id = "LEFDEF-003"
area = "LEFDEF"
capability = "lef-tech-section"
requirements = ["Filling defaults after grid scaling", "Scaling the LEF table"]
tool = "magic"
description = "same tech with cifoutput `gridlimit` forcing a 2:1 internal grid (`scalefactor 20`, `gridlimit 10`, `set-minimum-grid`); and a variant with a shrinking grid. Captures: tech-load output and `lef write -tech` WIDTH lines; DEF read default wire width of a net with no width."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "grid2.lef"
source = "grid2.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "shrink.lef"
source = "shrink.lef"
comparator = "lef-text"
masks = []

[[outputs]]
name = "cells.txt"
source = "derived:files:**/*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
