schema = 1
id = "LEFDEF-RT-gf180mcu_fd_sc_mcu7t5v0"
area = "LEFDEF"
capability = "lef-write"
requirements = ["LEF file grammar", "Library header", "Macro header lines", "Pin enumeration and ordering", "PORT blocks", "Geometry record emission", "writeall macro order"]
tool = "magic"
description = "Library round trip of gf180mcuD gf180mcu_fd_sc_mcu7t5v0: lef read of gf180mcu_fd_sc_mcu7t5v0__nom.tlef and gf180mcu_fd_sc_mcu7t5v0.lef, a wrapper placing every cell read, lef writeall -notop."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "gf180mcuD", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "gf180mcuD"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic"
to = "pdk/gf180mcuD/libs.tech/magic"

[[external]]
source = "pdk"
set = "gf180mcu-lef"
path = "gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/techlef/gf180mcu_fd_sc_mcu7t5v0__nom.tlef"
to = "lef/gf180mcu_fd_sc_mcu7t5v0__nom.tlef"

[[external]]
source = "pdk"
set = "gf180mcu-lef"
path = "gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lef/gf180mcu_fd_sc_mcu7t5v0.lef"
to = "lef/gf180mcu_fd_sc_mcu7t5v0.lef"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "lefdef_rt.lef.sha256"
source = "derived:digest:lefdef_rt.lef"
comparator = "bytes"
masks = []

[[outputs]]
name = "lefdef_rt.lef.summary.txt"
source = "derived:lef-summary:lefdef_rt.lef"
comparator = "bytes"
masks = []
