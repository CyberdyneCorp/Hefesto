#
# LEFDEF-RT-gf180mcu_fd_sc_mcu7t5v0 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF-RT case (m6-lef-def-oasis task 15.5): fresh session with the PDK's rc and random seed 1.
# lefdef_rt.lef is compared through its SHA-256 and per-macro summary (goldenlib/derived.py).
