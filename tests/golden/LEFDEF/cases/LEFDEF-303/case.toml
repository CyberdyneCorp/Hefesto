#
# LEFDEF-303 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# History case (design D19): 2 writes in one session, compared side by side: def write out -units 2000; def write r.txt.

schema = 1
id = "LEFDEF-303"
area = "LEFDEF"
capability = "def-write"
requirements = ["def write command", "Output file naming"]
tool = "magic"
description = "cell `top`; `def write out -units 2000` and `def write r.txt`. Captures: file names, UNITS line, coordinates."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-undo-note", "magic-tech-sections"]

[[outputs]]
name = "out.def"
source = "out.def"
comparator = "def-text"
masks = []

[[outputs]]
name = "r.txt"
source = "r.txt"
comparator = "def-text"
masks = []
