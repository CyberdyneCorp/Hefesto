#
# LEFDEF-016 (LEFDEF/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# LEFDEF case (m6-lef-def-oasis design D19): fresh session, drc off, one write unless a history note names the steps.
# Also covers lef-tech-section "Default contact area" (CASES.md): tech lambda 1 2 before the load gives the shrinking (1:2) grid that fills the contact area.

schema = 1
id = "LEFDEF-016"
area = "LEFDEF"
capability = "lef-read"
requirements = ["PORT and OBS geometry"]
tool = "magic"
description = "tech `contact pc cont1` with a shrinking grid so the contact area is filled; macro PORT RECT on cont1. Captures: painted cut rectangle in .mag."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "lef-text"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "cells.txt"
source = "derived:files:**/*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
