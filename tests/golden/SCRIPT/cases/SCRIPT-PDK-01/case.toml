#
# SCRIPT-PDK-01 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-PDK-01"
area = "SCRIPT"
capability = "scripting-pdk-integration"
requirements = ["PDK startup file contract", "PDK device-script contract", "Startup files are scripts"]
tool = "magic"
description = "PDK_ROOT=/pdk magic -dnull -noconsole -rcfile /pdk/<tech>/libs.tech/magic/<tech>.magicrc t.tcl for sky130A, gf180mcuD and ihp-sg13g2 (IHP with PDK_ROOT unset), where t.tcl prints $VDD $GND $SUB [te..."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic"
to = "pdk/gf180mcuD/libs.tech/magic"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
