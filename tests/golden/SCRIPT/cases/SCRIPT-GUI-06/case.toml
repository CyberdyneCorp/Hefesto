#
# SCRIPT-GUI-06 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-GUI-06"
area = "SCRIPT"
capability = "ui-gui-managers"
requirements = ["Layer toolbar", "Toolbar order presets file"]
tool = "magic"
description = "GUI: build the toolbar with and without ./<tech>_toolbars.tcl; event-generate the bindings on the poly row"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "X11", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "X11", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "scmos_toolbars.tcl"
source = "scmos_toolbars.tcl"
comparator = "bytes"
masks = []
