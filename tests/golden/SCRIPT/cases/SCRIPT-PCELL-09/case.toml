schema = 1
id = "SCRIPT-PCELL-09"
area = "SCRIPT"
capability = "pcell-toolkit"
requirements = ["Library and device procedure contract", "gencell entry point dispatch"]
tool = "magic"
description = "magic::gencell toy::nosuch x; magic::gencell {} with nothing selected; odd argument count"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
