#
# SCRIPT-GUI-09 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-GUI-09"
area = "SCRIPT"
capability = "ui-gui-managers"
requirements = ["DRC manager and DRC report file"]
tool = "magic"
description = "scmos layout with known DRC errors: drc_save_report; drc_load_report; feedback find"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "X11", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "X11", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.dstyle"
to = "mos.OpenGL.dstyle"

[[external]]
source = "magic-sys"
path = "scmos/mos.OpenGL.std.cmap"
to = "mos.OpenGL.std.cmap"

[[external]]
source = "magic-sys"
path = "graphics/color.glyphs"
to = "color.glyphs"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "drc.out"
source = "drc.out"
comparator = "bytes"
masks = []
