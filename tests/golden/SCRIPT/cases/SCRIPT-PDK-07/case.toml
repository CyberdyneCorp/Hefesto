#
# SCRIPT-PDK-07 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Also covers Deterministic generated-cell naming (another capability's requirement).
# Also covers Native generator equivalence (another capability's requirement).

schema = 1
id = "SCRIPT-PDK-07"
area = "SCRIPT"
capability = "scripting-pdk-integration"
requirements = ["PDK device-script contract", "Command surface used by device generators"]
tool = "magic"
description = "each PDK, NULL graphics: for every device in the PDK menus (36 sky130, 39 gf180mcu, 21 sg13g2), magic::gencell <ns>::<dev> X<i> with defaults; save each generated cell"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic"
to = "pdk/gf180mcuD/libs.tech/magic"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
