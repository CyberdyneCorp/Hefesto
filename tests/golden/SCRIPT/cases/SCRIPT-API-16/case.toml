#
# SCRIPT-API-16 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-API-16"
area = "SCRIPT"
capability = "scripting-api"
requirements = ["Script variables read by the engine"]
tool = "magic"
description = "tech whose extract substrate is $SUB; extract with SUB set to VSUBS and then unset"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.ext"
source = "top.ext"
comparator = "bytes"
masks = ["ext-timestamp"]

[[outputs]]
name = "top2.ext"
source = "top2.ext"
comparator = "bytes"
masks = ["ext-timestamp"]
