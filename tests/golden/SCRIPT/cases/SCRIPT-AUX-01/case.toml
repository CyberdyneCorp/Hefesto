#
# SCRIPT-AUX-01 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-AUX-01"
area = "SCRIPT"
capability = "scripting-auxiliary-tools"
requirements = ["Reference-library stripper"]
tool = "magic"
description = "run strip_reflibs.tcl in a directory with 2 .mag files containing GDS_START, GDS_END and GDS_FILE lines"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "input__lib__a.mag"
source = "input/lib/a.mag"
comparator = "bytes"
masks = []

[[outputs]]
name = "input__lib__b.mag"
source = "input/lib/b.mag"
comparator = "bytes"
masks = []
