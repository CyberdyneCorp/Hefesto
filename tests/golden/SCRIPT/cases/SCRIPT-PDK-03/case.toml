#
# SCRIPT-PDK-03 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-PDK-03"
area = "SCRIPT"
capability = "scripting-pdk-integration"
requirements = ["Command-line file arguments", "Command-line options in the script host"]
tool = "magic"
description = "command line a.gds b.lef c.def d.cif e.tcl f.mag g g.mag.gz h.xyz -foo in wrapper mode and NULL mode"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl", "a.gds", "b.lef", "c.def", "d.cif", "e.tcl", "f.mag", "g", "g.mag.gz", "h.xyz", "-foo"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl", "a.gds", "b.lef", "c.def", "d.cif", "e.tcl", "f.mag", "g", "g.mag.gz", "h.xyz", "-foo"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
