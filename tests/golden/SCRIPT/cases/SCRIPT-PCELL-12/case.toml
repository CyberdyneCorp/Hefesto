#
# SCRIPT-PCELL-12 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-PCELL-12"
area = "SCRIPT"
capability = "pcell-toolkit"
requirements = ["SPICE netlist to layout seeding", "Seeding a subcircuit cell"]
tool = "magic"
description = "magic::netlist_to_layout top.spice toy, where top.spice has 2 subckts (one existing on disk), ideal C/R/L elements, bus pins vout[0], continuation lines, .command block, M=2 subcircuit call"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "sub1.mag"
source = "sub1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
