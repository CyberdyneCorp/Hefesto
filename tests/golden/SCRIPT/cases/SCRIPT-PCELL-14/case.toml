#
# SCRIPT-PCELL-14 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-PCELL-14"
area = "SCRIPT"
capability = "pcell-toolkit"
requirements = ["Selection-driven dialog refresh and key binding"]
tool = "magic"
description = "GUI: dialog open, then select cell M2"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "X11", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "X11", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
