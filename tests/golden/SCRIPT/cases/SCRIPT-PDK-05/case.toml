#
# SCRIPT-PDK-05 (SCRIPT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).

schema = 1
id = "SCRIPT-PDK-05"
area = "SCRIPT"
capability = "scripting-pdk-integration"
requirements = ["Technology auto-discovery from layout files"]
tool = "magic"
description = "empty session, PDK_ROOT=/pdk (env) then as a Tcl var only; load inv from a sky130A file"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "pdk"
path = "sky130A/libs.ref/sky130_fd_sc_hd/mag/sky130_fd_sc_hd__inv_1.mag"
to = "pdk/sky130A/libs.ref/sky130_fd_sc_hd/mag/sky130_fd_sc_hd__inv_1.mag"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
