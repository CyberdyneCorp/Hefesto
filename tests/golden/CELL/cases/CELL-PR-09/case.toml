schema = 1
id = "CELL-PR-09"
area = "CELL"
capability = "cell-library-resolution"
requirements = ["Cell file lookup order", "Dereferencing"]
tool = "magic"
description = "Bad recorded path with the cell in an addpath directory; then load -dereference."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
