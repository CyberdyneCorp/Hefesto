#
# CELL-WR-01 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-WR-01"
area = "CELL"
capability = "cell-file-format"
requirements = ["Writer header and scale reduction", "Writer paint sections", "Writer use blocks"]
tool = "magic"
description = "scmos: poly, metal1, a triangle and two instances; save."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = []

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = []

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "leaf.mag"
source = "leaf.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
