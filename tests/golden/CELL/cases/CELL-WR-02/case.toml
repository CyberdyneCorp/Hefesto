#
# CELL-WR-02 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-WR-02"
area = "CELL"
capability = "cell-file-format"
requirements = ["Writer header and scale reduction"]
tool = "magic"
description = "scalegrid 1 2; all-even cell saved; then an odd rect."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = []

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = []

[[outputs]]
name = "a1.mag"
source = "a1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "a2.mag"
source = "a2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
