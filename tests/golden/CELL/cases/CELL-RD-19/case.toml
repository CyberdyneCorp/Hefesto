#
# CELL-RD-19 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-RD-19"
area = "CELL"
capability = "cell-file-format"
requirements = ["Element records"]
tool = "magic"
description = "Elements: rectangle, line with flags, text, malformed."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "a_out.mag"
source = "a_out.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
