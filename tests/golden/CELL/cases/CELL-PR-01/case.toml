#
# CELL-PR-01 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-PR-01"
area = "CELL"
capability = "cell-library-resolution"
requirements = ["Reading instance paths", "Duplicate cell conflicts on read"]
tool = "magic"
description = "Parent mid/top uses inv from ../lib; a second parent other/top2 references ../lib too."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top_out.mag"
source = "top_out.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
