#
# CELL-TS-02 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "CELL-TS-02"
area = "CELL"
capability = "cell-timestamps"
requirements = ["Timestamps on cell read", "Deferred mismatch processing"]
tool = "magic"
description = "Edit leaf alone and save it; then load top (timestamp mismatch processing and the DRC check areas it leaves); save top."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "input__top.mag"
source = "input/top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "input__mid.mag"
source = "input/mid.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
