#
# CELL-RD-04 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-RD-04"
area = "CELL"
capability = "cell-file-format"
requirements = ["Coordinate scaling on read"]
tool = "magic"
description = "magscale 1 2 file in a fresh session, then a file without magscale holding rect 0 0 3 5."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a_out.mag"
source = "a_out.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "a2.mag"
source = "a2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
