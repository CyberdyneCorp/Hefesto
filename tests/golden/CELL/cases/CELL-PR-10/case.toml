#
# CELL-PR-10 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-PR-10"
area = "CELL"
capability = "cell-library-resolution"
requirements = ["Cell file lookup order"]
tool = "magic"
description = "x.mag and x.mag.gz with different content; locking on and off."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "x_out.mag"
source = "x_out.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "y_out.mag"
source = "y_out.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
