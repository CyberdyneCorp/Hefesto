schema = 1
id = "CELL-RD-11"
area = "CELL"
capability = "cell-file-format"
requirements = ["Body section dispatch"]
tool = "magic"
description = "Unknown layer << nolayer >>; alias section allm1 (tiny)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
