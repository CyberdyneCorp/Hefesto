#
# CELL-RD-17 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-RD-17"
area = "CELL"
capability = "cell-file-format"
requirements = ["Label records"]
tool = "magic"
description = "rlabel sticky and not, flabel known/unknown font, old label form, 120-char and spaced text, unknown layer, contact layer."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a_out.mag"
source = "a_out.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
