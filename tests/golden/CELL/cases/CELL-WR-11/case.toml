#
# CELL-WR-11 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-WR-11"
area = "CELL"
capability = "cell-file-format"
requirements = ["Command-script save variant", "Command-script content"]
tool = "magic"
description = "save top.tcl of a cell with paint, a split tile, an instance, labels, ports and properties."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "top.tcl"
source = "top.tcl"
comparator = "bytes"
masks = []
