#
# CELL-TS-08 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "CELL-TS-08"
area = "CELL"
capability = "cell-timestamps"
requirements = ["Generating new stamps"]
tool = "magic"
description = "A read-only child with a DRC violation (its DRC result pending a stamp) under a parent; check, catchup; modify the parent; writeall force."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "input__parent.mag"
source = "input/parent.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "input__child.mag"
source = "input/child.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
