schema = 1
id = "CELL-PW-01"
area = "CELL"
capability = "cell-library-resolution"
requirements = ["Writing instance paths"]
tool = "magic"
description = "Child in a subdirectory of the parent directory; save the parent."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
