#
# CELL-WR-04 (CELL/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "CELL-WR-04"
area = "CELL"
capability = "cell-file-format"
requirements = ["Writer paint sections"]
tool = "magic"
description = "metal1 A, B and a 4-rect staircase: record order."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
