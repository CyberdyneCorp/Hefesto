schema = 1
id = "DRC-SUR-5"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Trigger rules"]
tool = "magic"
description = "surround via m1 2 5 directional; surround 1 left/right and 3 top/bottom; and 1 everywhere."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
