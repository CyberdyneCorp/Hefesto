#
# DRC-STYLE-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-STYLE-1"
area = "DRC"
capability = "drc-rule-language"
requirements = ["DRC styles and variants", "Style selection at run time"]
tool = "magic"
description = "style s variant A,B with variant-restricted rules; drc style sA and sB; printrules and CAP each."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "rulesA.txt"
source = "rulesA.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "rulesB.txt"
source = "rulesB.txt"
comparator = "bytes"
masks = []
