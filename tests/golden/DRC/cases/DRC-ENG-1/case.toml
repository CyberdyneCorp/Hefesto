#
# DRC-ENG-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-ENG-1"
area = "DRC"
capability = "drc-engine"
requirements = ["Marking changed areas"]
tool = "magic"
description = "top > mid > leaf; paint in the leaf after building; the checkpaint sections of all three before any check."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "mid.mag"
source = "mid.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "leaf.mag"
source = "leaf.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
