#
# DRC-PDK-3 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m4_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Replaces the cap_cmomf row of DRC/CASES.md: IHP-Open-PDK 5e6d592e has no cap_cmomf generator (m4-scripting tasks.md 12.3).

schema = 1
id = "DRC-PDK-3"
area = "DRC"
capability = "drc-engine"
requirements = ["Step square processing"]
tool = "magic"
description = "ihp-sg13g2: two MiM capacitors of the PDK's cap_cmim generator (no cap_cmomf generator in IHP-Open-PDK) with the plates 0.4 um apart (MIM.b 0.6 um); CAP."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "ihp-sg13g2", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "ihp-sg13g2"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "mim.mag"
source = "mim.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
