#
# DRC-PDK-3 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-PDK-3"
area = "DRC"
capability = "drc-engine"
requirements = ["Step square processing"]
tool = "magic"
description = "ihp-sg13g2: a metal1 MOM finger capacitor drawn with box/paint (stand-in for the cap_cmomf generator, design D12) with one finger too close; CAP."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic/ihp-sg13g2.tech"
to = "ihp-sg13g2.tech"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic/ihp-sg13g2-cifout.tech"
to = "ihp-sg13g2-cifout.tech"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic/ihp-sg13g2-cifin.tech"
to = "ihp-sg13g2-cifin.tech"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic/ihp-sg13g2-drc.tech"
to = "ihp-sg13g2-drc.tech"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic/ihp-sg13g2-extract.tech"
to = "ihp-sg13g2-extract.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "mom.mag"
source = "mom.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
