schema = 1
id = "DRC-SUR-4"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Standard edge rule check region"]
tool = "magic"
description = "surround m1c m1 1 exact_width (contact in metal) and surround via m2 1 exact_width (another plane, Q-DRC-18); exact and too-wide surrounds."

[reference]
script = "input/commands.tcl"

[hefesto]
