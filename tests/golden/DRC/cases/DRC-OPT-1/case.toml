#
# DRC-OPT-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-OPT-1"
area = "DRC"
capability = "drc-rule-language"
requirements = ["Illegal-edge rule pruning"]
tool = "magic"
description = "spacing poly ndiff 1 touching_illegal \"A\", width ndiff 3 \"B\"; poly abutting ndiff; printrules, CAP."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "rules.txt"
source = "rules.txt"
comparator = "bytes"
masks = []
