#
# DRC-CIF-6 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Mask-layer checks are M5 (design D13); deviations.toml defers this case.
# drctest.tech gains the output style fine (scalefactor 10) for this case.

schema = 1
id = "DRC-CIF-6"
area = "DRC"
capability = "drc-cif-rules"
requirements = ["Mapping mask errors to layout coordinates"]
tool = "magic"
description = "Mask errors at negative coordinates and below one internal unit: output style fine (10 centimicrons per unit), cifwidth MET1 25."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = ["cif"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
