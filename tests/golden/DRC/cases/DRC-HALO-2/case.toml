schema = 1
id = "DRC-HALO-2"
area = "DRC"
capability = "drc-engine"
requirements = ["Halo override"]
tool = "magic"
description = "drc *halo 2 with a 5-unit spacing rule; violations 4 apart, flat and across the hierarchy."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "child.mag"
source = "child.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
