#
# DRC-OPT-3 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-OPT-3"
area = "DRC"
capability = "drc-rule-language"
requirements = ["Covered rule elimination"]
tool = "magic"
description = "edge4way space m1 2 m1 m1 2 \"A\" then edge space m1 3 m1 m1 3 \"B\" (Q-DRC-5); L-shaped m1 and notches."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "rules.txt"
source = "rules.txt"
comparator = "bytes"
masks = []
