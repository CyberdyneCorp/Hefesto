schema = 1
id = "DRC-W-2"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Standard edge rule check region"]
tool = "magic"
description = "width poly 2 \"w\"; poly L-shape with a 1-wide step at the inner corner (corner extension)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
