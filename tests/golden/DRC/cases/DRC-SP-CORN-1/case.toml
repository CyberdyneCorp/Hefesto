#
# DRC-SP-CORN-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Distance 2 with a 1-unit gap stands for CASES.md's distance 1 with a 0.5 gap (integer grid).

schema = 1
id = "DRC-SP-CORN-1"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Standard edge rule check region"]
tool = "magic"
description = "spacing poly ndiff 2 corner_ok nfet; poly meeting ndiff at an nfet corner; a 1-unit poly-ndiff gap."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
