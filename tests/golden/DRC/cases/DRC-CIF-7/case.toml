#
# DRC-CIF-7 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Mask-layer checks are M5 (design D13); deviations.toml defers this case.

schema = 1
id = "DRC-CIF-7"
area = "DRC"
capability = "drc-cif-rules"
requirements = ["Mask style binding"]
tool = "magic"
description = "cifstyle naming the non-current output style other; then cif ostyle other; load messages and CAP before and after."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = ["cif"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
