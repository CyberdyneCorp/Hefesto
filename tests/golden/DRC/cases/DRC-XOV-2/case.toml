schema = 1
id = "DRC-XOV-2"
area = "DRC"
capability = "drc-engine"
requirements = ["Exact-overlap check"]
tool = "magic"
description = "exact_overlap m1c; contacts exactly coincident in two cells."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
