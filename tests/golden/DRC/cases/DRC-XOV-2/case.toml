[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "b.mag"
source = "b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
