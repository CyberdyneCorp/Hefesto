# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-OG-1"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Off-grid rule"]
tool = "magic"
description = "off_grid m1 5; m1 [3,10]x[0,10]; m1 [-8,-3]x[-7,2] (Q-DRC-9)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
