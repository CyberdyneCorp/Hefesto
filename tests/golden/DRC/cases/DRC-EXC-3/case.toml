#
# DRC-EXC-3 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-EXC-3"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Exceptions and exemptions at check time"]
tool = "magic"
description = "exception SRAM width rule; a vertical 2-wide wire with a hint touching or straddling its left or right edge (Q-DRC-11), one cell each."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "l.mag"
source = "l.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "r.mag"
source = "r.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "ls.mag"
source = "ls.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "rs.mag"
source = "rs.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
