#
# DRC-SCALE-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-SCALE-1"
area = "DRC"
capability = "drc-rule-language"
requirements = ["Scale factor and distance units"]
tool = "magic"
description = "scalefactor 10: spacing 25, maxwidth 25 bend_illegal, area 1050 20; printrules, *halo, *stepsize, CAP."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "rules.txt"
source = "rules.txt"
comparator = "bytes"
masks = []
