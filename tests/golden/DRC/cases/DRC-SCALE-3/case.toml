#
# DRC-SCALE-3 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# The area rule is in its own technology, loaded after scalegrid 2 1 restores the grid, so that it, too, is compiled at 1:1 before the rescale.

schema = 1
id = "DRC-SCALE-3"
area = "DRC"
capability = "drc-rule-language"
requirements = ["Scale factor and distance units"]
tool = "magic"
description = "scalefactor 300 width m1 451, then scalegrid 1 2 and 2 1; and (Q-DRC-1) a second technology with scalefactor 10 area m1 1001 2, then scalegrid 1 2; printrules before and after each rescale."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "w_1.txt"
source = "w_1.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "w_2.txt"
source = "w_2.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "w_3.txt"
source = "w_3.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "a_1.txt"
source = "a_1.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "a_2.txt"
source = "a_2.txt"
comparator = "bytes"
masks = []
