schema = 1
id = "DRC-WS-RL-V"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Wide-spacing trigger (maximal rectangle search)"]
tool = "magic"
description = "widespacing m1 10 20 m1 4 touching_ok (runlength 20); vertical parallel runs 25 and 15 (Q-DRC-7)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
