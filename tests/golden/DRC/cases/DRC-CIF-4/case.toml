#
# DRC-CIF-4 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Mask-layer checks are M5 (design D13); deviations.toml defers this case.

schema = 1
id = "DRC-CIF-4"
area = "DRC"
capability = "drc-cif-rules"
requirements = ["Mask area rule"]
tool = "magic"
description = "cifarea VIA1 10000 50; m1c squares generating small vias."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
