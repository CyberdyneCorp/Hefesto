#
# DRC-SCALE-2 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-SCALE-2"
area = "DRC"
capability = "drc-rule-language"
requirements = ["Scale factor and distance units", "Halo and step size"]
tool = "magic"
description = "DRC-SCALE-1 rules, then scalegrid 1 2; printrules, *halo and *stepsize before and after."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "rules_1.txt"
source = "rules_1.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "rules_2.txt"
source = "rules_2.txt"
comparator = "bytes"
masks = []
