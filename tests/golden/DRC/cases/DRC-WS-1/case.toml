#
# DRC-WS-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-WS-1"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Wide-spacing trigger (maximal rectangle search)"]
tool = "magic"
description = "widespacing m1 10 m1 4 touching_ok; block [0,12]^2 and line [14,30]x[0,2]."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "rules.txt"
source = "rules.txt"
comparator = "bytes"
masks = []
