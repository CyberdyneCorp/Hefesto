schema = 1
id = "DRC-EXC-1"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Exceptions and exemptions at check time"]
tool = "magic"
description = "exemption SRAM spacing rule; MASKHINTS_SRAM over half of the layout; violations inside and outside."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
