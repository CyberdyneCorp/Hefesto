#
# DRC-SUB-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# %%, %x and a trailing % are left out: Magic's output for them is undefined (it copies shifted or uninitialized bytes, Q-DRC-16), so a capture would not be reproducible; unit tests cover Hefesto's literal copy.

schema = 1
id = "DRC-SUB-1"
area = "DRC"
capability = "drc-commands"
requirements = ["Why-text substitution"]
tool = "magic"
description = "Why texts with %d, %c and %a; drc why under units default, lambda, internal, microns."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
