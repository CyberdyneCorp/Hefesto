schema = 1
id = "DRC-EUC-4"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Euclidean corner filter"]
tool = "magic"
description = "spacing m1 m1 3 touching_illegal; a split m1 tile near the corner extension of m1; euclidean on."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
