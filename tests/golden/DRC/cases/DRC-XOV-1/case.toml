#
# DRC-XOV-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Magic 8.3.694 reports the partial overlap and the abutment only once another interaction (a over c) is in the check; the case keeps that layout so the reference shows the errors.

schema = 1
id = "DRC-XOV-1"
area = "DRC"
capability = "drc-engine"
requirements = ["Exact-overlap check"]
tool = "magic"
description = "exact_overlap m1c; sibling cells with m1c [0,4]^2 and [2,6]x[0,4]; the same cells abutting at x=24; an m1c cell over the m1 of a third cell."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "b.mag"
source = "b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "c.mag"
source = "c.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
