# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-EXC-4"
area = "DRC"
capability = "drc-rule-semantics"
requirements = ["Exceptions and exemptions at check time"]
tool = "magic"
description = "exception SRAM width rule; a horizontal 2-high wire with a hint touching or straddling its bottom or top edge (Q-DRC-11), one cell each."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "b.mag"
source = "b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "t.mag"
source = "t.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "bs.mag"
source = "bs.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "ts.mag"
source = "ts.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
