#
# DRC-PR-3 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Hefesto's output was compared byte for byte with Magic's for every style (tasks.md 4.11); the digest keeps the multi-megabyte files out of the tree.

schema = 1
id = "DRC-PR-3"
area = "DRC"
capability = "drc-commands"
requirements = ["drc printrules"]
tool = "magic"
description = "sky130A under `scalegrid 1 2`: drc printrules of every DRC style (compared by digest)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A.tech"
to = "sky130A.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifout.tech"
to = "sky130A-cifout.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifin.tech"
to = "sky130A-cifin.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-drc.tech"
to = "sky130A-drc.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-extract.tech"
to = "sky130A-extract.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "rules.digest"
source = "derived:digest:rules_*.txt"
comparator = "bytes"
masks = []
