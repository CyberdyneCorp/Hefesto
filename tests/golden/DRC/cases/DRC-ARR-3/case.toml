schema = 1
id = "DRC-ARR-3"
area = "DRC"
capability = "drc-engine"
requirements = ["Array checks"]
tool = "magic"
description = "A 2x1 array of an asymmetric cell placed with rotation 90."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "child.mag"
source = "child.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
