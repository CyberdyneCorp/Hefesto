# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-ORDER-1"
area = "DRC"
capability = "drc-rule-language"
requirements = ["Rule table ordering"]
tool = "magic"
description = "width m1 3 \"A\" then edge4way space m1 3 m1 m1 3 \"B\"; printrules order for (space,m1); CAP on a 2-wide m1."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "rules.txt"
source = "rules.txt"
comparator = "bytes"
masks = []
