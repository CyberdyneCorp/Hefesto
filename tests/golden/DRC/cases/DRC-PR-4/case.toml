#
# DRC-PR-4 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Hefesto's output was compared byte for byte with Magic's for every style (tasks.md 4.11); the digest keeps the multi-megabyte files out of the tree.

schema = 1
id = "DRC-PR-4"
area = "DRC"
capability = "drc-commands"
requirements = ["drc printrules"]
tool = "magic"
description = "gf180mcuD under `scalegrid 1 10`: drc printrules of every DRC style (compared by digest)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic/gf180mcuD.tech"
to = "gf180mcuD.tech"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic/gf180mcuD-cifout.tech"
to = "gf180mcuD-cifout.tech"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic/gf180mcuD-cifin.tech"
to = "gf180mcuD-cifin.tech"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic/gf180mcuD-drc.tech"
to = "gf180mcuD-drc.tech"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic/gf180mcuD-extract.tech"
to = "gf180mcuD-extract.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "rules.digest"
source = "derived:digest:rules_*.txt"
comparator = "bytes"
masks = []
