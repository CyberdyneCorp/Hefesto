#
# DRC-CIF-5 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# Mask-layer checks are M5 (design D13); deviations.toml defers this case.

schema = 1
id = "DRC-CIF-5"
area = "DRC"
capability = "drc-cif-rules"
requirements = ["Mask maxwidth rule"]
tool = "magic"
description = "cifmaxwidth MET2 3000 bend_ok, bend_illegal and both (one style each); CAP per style."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
