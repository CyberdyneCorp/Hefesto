#
# DRC-NMG-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.

schema = 1
id = "DRC-NMG-1"
area = "DRC"
capability = "drc-engine"
requirements = ["Flattening for interaction checks"]
tool = "magic"
description = "Two cells with 45-degree m1 whose overlap intersection is off the grid (why 5)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "b.mag"
source = "b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
