#
# DRC-PR-1 (DRC/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# The printrules records themselves are compared by the drctest cases.

schema = 1
id = "DRC-PR-1"
area = "DRC"
capability = "drc-commands"
requirements = ["drc printrules"]
tool = "magic"
description = "sky130A: drc printrules into a file (compared by digest: 26 MB)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A.tech"
to = "sky130A.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifout.tech"
to = "sky130A-cifout.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifin.tech"
to = "sky130A-cifin.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-drc.tech"
to = "sky130A-drc.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-extract.tech"
to = "sky130A-extract.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "drc-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "rules.digest"
source = "derived:digest:rules.txt"
comparator = "bytes"
masks = []
