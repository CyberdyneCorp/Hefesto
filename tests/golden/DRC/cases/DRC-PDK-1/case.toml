schema = 1
id = "DRC-PDK-1"
area = "DRC"
capability = "drc-engine"
requirements = ["Step square processing", "Interaction check over an area"]
tool = "magic"
description = "sky130A: sky130_fd_sc_hd__inv_1 as installed, then the same cell with a deliberate met1 and li1 width violation; CAP of each."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A.tech"
to = "sky130A.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifout.tech"
to = "sky130A-cifout.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifin.tech"
to = "sky130A-cifin.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-drc.tech"
to = "sky130A-drc.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-extract.tech"
to = "sky130A-extract.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.ref/sky130_fd_sc_hd/mag/sky130_fd_sc_hd__inv_1.mag"
to = "sky130_fd_sc_hd__inv_1.mag"

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
