schema = 1
id = "SCHEM-RT-06"
area = "SCHEM"
capability = "schematic-file-format"
requirements = ["Record grammar", "Malformed input", "Layers"]
tool = "xschem"
description = "Hand-written malformed file: unknown record with a two-line brace string, a comment, a truncated wire, an out-of-range layer and an unterminated brace string at the end."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
