schema = 1
id = "SCHEM-SIM-03"
area = "SCHEM"
capability = "schematic-simulation-integration"
requirements = ["Simulator vector names"]
tool = "xschem"
description = "Hierarchical testbench: from inside x1, xschem resolved_net of an internal net and of a port net."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/case.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "tb.spice"
source = "out/tb.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
