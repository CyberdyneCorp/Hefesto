schema = 1
id = "SCHEM-RT-03"
area = "SCHEM"
capability = "schematic-file-format"
requirements = ["File kinds and character handling", "Line, box, arc and polygon records", "Numeric fields"]
tool = "xschem"
description = "Hand-written file with CR-LF line ends, unordered line endpoints and box corners, and re-formatted numbers."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/hefesto.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "crlf.sch"
source = "out/crlf.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "2-crlf.sch"
source = "out/2-crlf.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
