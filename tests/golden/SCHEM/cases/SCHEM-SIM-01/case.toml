# SCHEM-SIM-01 (SCHEM/CASES.md). Inputs only: expected/ is written by capture.py in CI
# (golden-capture.yml). Generated by tools/golden/authoring/schem_cases.py.

schema = 1
id = "SCHEM-SIM-01"
area = "SCHEM"
capability = "schematic-simulation-integration"
requirements = ["Schematic circuit source", "Control block translation"]
tool = "xschem"
description = "IHP dc_lv_nmos.sch: the deck xschem hands to ngspice (the simulation results need the IHP ngspice models, which no data set fetches yet; they are M9)."
provenance = "pdk:ihp-xschem:ihp-sg13g2/libs.tech/xschem/sg13g2_tests/dc_lv_nmos.sch"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true
xschem_sets = ["ihp-xschem"]

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "dc_lv_nmos.spice"
source = "out/dc_lv_nmos.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
