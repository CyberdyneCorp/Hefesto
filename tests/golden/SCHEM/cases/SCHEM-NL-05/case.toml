schema = 1
id = "SCHEM-NL-05"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Subcircuit definitions"]
tool = "xschem"
description = "sky130 sky130_tests/top.sch, hierarchical (order of the expanding symbol blocks)."
provenance = "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/top.sch"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem"]

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "top.spice"
source = "out/top.spice"
comparator = "bytes"
masks = ["schem-paths", "schem-user-conf"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
