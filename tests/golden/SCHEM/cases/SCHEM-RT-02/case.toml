# SCHEM-RT-02 (SCHEM/CASES.md). Inputs only: expected/ is written by capture.py in CI
# (golden-capture.yml). Generated by tools/golden/authoring/schem_cases.py.

schema = 1
id = "SCHEM-RT-02"
area = "SCHEM"
capability = "schematic-file-format"
requirements = ["Round-trip guarantee", "Brace strings", "Numeric fields"]
tool = "xschem"
description = "Every .sch and .sym of the three PDK xschem trees loaded and saved twice; the files whose second save differs are listed."
provenance = ["pdk:sky130-xschem:sky130A/libs.tech/xschem", "pdk:gf180mcu-xschem:gf180mcuD/libs.tech/xschem", "pdk:ihp-xschem:ihp-sg13g2/libs.tech/xschem", "pdk:ihp-xschem:ihp-sg13g2/libs.ref/sg13g2_stdcell/sym/xschem"]

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem", "gf180mcu-xschem", "ihp-xschem"]
timeout_s = 3600

[hefesto]
args = ["--no-log", "{input}/hefesto.tcl"]
requires_commands = ["xschem"]
timeout_s = 3600

[[outputs]]
name = "differs.txt"
source = "out/differs.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "changed.txt"
source = "out/changed.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "first.digest"
source = "derived:digest:out/first/**/*"
comparator = "bytes"
masks = []

[[outputs]]
name = "second.digest"
source = "derived:digest:out/second/**/*"
comparator = "bytes"
masks = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
