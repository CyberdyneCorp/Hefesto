schema = 1
id = "SCHEM-PR-04"
area = "SCHEM"
capability = "schematic-symbols-and-libraries"
requirements = ["Text substitution tokens"]
tool = "xschem"
description = "xschem translate of @name=@value, a\\@b @name, @W/@L, %undef, @symname and @#0:pinnumber on chosen instances (Q-SCHEM-26)."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/hefesto.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
