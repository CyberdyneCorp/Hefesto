schema = 1
id = "SCHEM-PR-05"
area = "SCHEM"
capability = "schematic-symbols-and-libraries"
requirements = ["Symbol references", "Library search path"]
tool = "xschem"
description = "A search path with a missing folder, an alias and '.'; abs_sym_path and rel_sym_path of lib/x.sym, ../x.sym, devices/res.sym and others."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/case.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
