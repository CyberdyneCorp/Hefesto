schema = 1
id = "SCHEM-NL-01"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Netlist file structure", "Subcircuit body", "Element line post-processing"]
tool = "xschem"
description = "Hefesto-authored flat testbench SC_Test.sch with no ports, a source, a resistor, a capacitor and one code_shown.sym instance with a trailing m=1 line (Q-SCHEM-22)."
provenance = "hefesto"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "SC_Test.spice"
source = "out/SC_Test.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
