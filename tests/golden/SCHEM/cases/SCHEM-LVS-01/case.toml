schema = 1
id = "SCHEM-LVS-01"
area = "SCHEM"
capability = "schematic-simulation-integration"
requirements = ["Schematic to layout cross-probing", "Schematic-driven LVS command"]
tool = "xschem"
description = "sky130 inverter: sky130_fd_sc_hd__inv_1 extracted by Magic against the xschem LVS netlist of the Hefesto-drawn inv_1.sch (the same circuit), compared by netgen with the PDK's setup file."
provenance = ["hefesto", "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_fd_pr/nfet_01v8.sym", "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_fd_pr/pfet_01v8_hvt.sym", "pdk:sky130-xschem:sky130A/libs.tech/netgen/sky130A_setup.tcl"]

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem"]

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A.tech"
to = "sky130A.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifout.tech"
to = "sky130A-cifout.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-cifin.tech"
to = "sky130A-cifin.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-drc.tech"
to = "sky130A-drc.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A-extract.tech"
to = "sky130A-extract.tech"

[[external]]
source = "pdk"
path = "sky130A/libs.ref/sky130_fd_sc_hd/mag/sky130_fd_sc_hd__inv_1.mag"
to = "sky130_fd_sc_hd__inv_1.mag"

[[external]]
source = "pdk"
set = "sky130-xschem"
path = "sky130A/libs.tech/netgen/sky130A_setup.tcl"
to = "sky130A_setup.tcl"

[[outputs]]
name = "inv_1.spice"
source = "out/inv_1.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "layout.spice"
source = "out/sky130_fd_sc_hd__inv_1.spice"
comparator = "bytes"
masks = []

[[outputs]]
name = "lvs.out"
source = "out/lvs.out"
comparator = "bytes"
masks = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "regex:(?i)compiled on [^\\n]*", "regex:rlim_cur=\\d+"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
