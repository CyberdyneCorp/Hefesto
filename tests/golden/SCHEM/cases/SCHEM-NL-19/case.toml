schema = 1
id = "SCHEM-NL-19"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Bus taps"]
tool = "xschem"
description = "Hefesto-authored bus schematic with bus_tap instances on a 4-bit and an 8-bit bus: single bits, an all-digit lab, a plain name and a sub-range."
provenance = "hefesto"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "nl19.spice"
source = "out/nl19.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
