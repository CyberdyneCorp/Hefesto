schema = 1
id = "SCHEM-CMD-01"
area = "SCHEM"
capability = "schematic-command"
requirements = ["Subcommand table"]
tool = "xschem"
description = "Hefesto runs the divider script of the Subcommand table scenario; the reference is xschem's netlist of the same circuit drawn as div.sch."
provenance = "hefesto"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "div.spice"
source = "out/div.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
