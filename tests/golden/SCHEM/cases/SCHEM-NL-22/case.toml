schema = 1
id = "SCHEM-NL-22"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Net naming order"]
tool = "xschem"
description = "The SCHEM-NL-11 schematic netlisted, then saved: lab= on the wires (Q-SCHEM-29)."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/case.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "nl11-saved.sch"
source = "out/nl11-saved.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
