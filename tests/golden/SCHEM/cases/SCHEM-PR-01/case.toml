schema = 1
id = "SCHEM-PR-01"
area = "SCHEM"
capability = "schematic-file-format"
requirements = ["Property strings", "Boolean values"]
tool = "xschem"
description = "xschem get_tok and subst_tok on the strings of the Property strings scenarios and more."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
