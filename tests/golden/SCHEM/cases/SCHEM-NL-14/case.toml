schema = 1
id = "SCHEM-NL-14"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Subcircuit definitions", "Schematic resolution"]
tool = "xschem"
description = "A subcircuit symbol with no schematic, one with spice_sym_def, one with spice_stop=true and one with default_schematic=ignore (Q-SCHEM-27)."
provenance = "hefesto"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/hefesto.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "nl14.spice"
source = "out/nl14.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
