# (golden-capture.yml). Generated by tools/golden/authoring/schem_cases.py.

schema = 1
id = "SCHEM-NL-11"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Connection geometry", "Net naming order", "Unnamed nets", "Errors and warnings"]
tool = "xschem"
description = "Hand-written: two labels on one wire, a T junction, crossing wires, a pin on a wire interior, floating resistor pins, a label net1 and unlabeled wires (Q-SCHEM-16)."
provenance = "hefesto"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "nl11.spice"
source = "out/nl11.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
