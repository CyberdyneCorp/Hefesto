schema = 1
id = "SCHEM-RT-01"
area = "SCHEM"
capability = "schematic-file-format"
requirements = ["Round-trip guarantee", "Canonical write order"]
tool = "xschem"
description = "sky130 sky130_tests/not.sch loaded and saved, then the saved file loaded and saved again."
provenance = "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/not.sch"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem"]

[hefesto]
args = ["--no-log", "{input}/case.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "not.sch"
source = "out/not.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "2-not.sch"
source = "out/2-not.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
