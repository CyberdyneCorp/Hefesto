schema = 1
id = "SCHEM-NL-20"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Top-level port order"]
tool = "xschem"
description = "inv.sch (ports Y, A) netlisted as top with top_is_subckt, with and without inv.sym (pins A, Y) beside it."
provenance = "hefesto"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "inv-with-symbol.spice"
source = "out/inv-with-symbol.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "inv-without-symbol.spice"
source = "out/inv-without-symbol.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
