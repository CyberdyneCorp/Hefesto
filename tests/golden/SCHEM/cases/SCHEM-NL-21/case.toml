schema = 1
id = "SCHEM-NL-21"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Flat netlist"]
tool = "xschem"
description = "sky130 sky130_tests/top.sch in flat mode (-f), compared electrically (Q-SCHEM-15); also gain_stage.sch (passgate.sym inside), whose flat netlist has devices."
provenance = ["pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/top.sch", "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/gain_stage.sch"]

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem"]

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "top-flat.spice"
source = "out/top-flat.spice"
comparator = "spice-canonical"
masks = ["schem-paths"]

[[outputs]]
name = "gain_stage-flat.spice"
source = "out/gain_stage-flat.spice"
comparator = "spice-canonical"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
