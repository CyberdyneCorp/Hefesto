schema = 1
id = "SCHEM-NL-03"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Hierarchical parameters", "Subcircuit definitions"]
tool = "xschem"
description = "sky130 sky130_tests/passgate.sch, and gain_stage.sch, a testbench using passgate.sym."
provenance = ["pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/passgate.sch", "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/gain_stage.sch"]

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem"]

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "passgate.spice"
source = "out/passgate.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "gain_stage.spice"
source = "out/gain_stage.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
