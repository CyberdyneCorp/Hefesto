schema = 1
id = "SCHEM-SIM-02"
area = "SCHEM"
capability = "schematic-simulation-integration"
requirements = ["Operating-point annotation", "Simulator vector names"]
tool = "xschem"
description = "sky130 test_inv.sch: xschem translate of @spice_get_voltage texts with no simulation loaded (the annotate_op values need the sky130 models; they are M9)."
provenance = "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/test_inv.sch"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem"]

[hefesto]
args = ["--no-log", "{input}/hefesto.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
