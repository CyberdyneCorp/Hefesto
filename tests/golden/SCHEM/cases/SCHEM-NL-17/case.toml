# SCHEM-NL-17 (SCHEM/CASES.md). Inputs only: expected/ is written by capture.py in CI
# (golden-capture.yml). Generated by tools/golden/authoring/schem_cases.py.

schema = 1
id = "SCHEM-NL-17"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Netlist options", "Bus and vector notation"]
tool = "xschem"
description = "netlist_options.sym with bus_replacement_char=<> and top_is_subckt=true; then with option uppercase_subckt as well."
provenance = "hefesto"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "nl17-options.spice"
source = "out/nl17-options.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "nl17-uppercase.spice"
source = "out/nl17-uppercase.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
