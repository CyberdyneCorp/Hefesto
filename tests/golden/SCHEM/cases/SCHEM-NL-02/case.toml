schema = 1
id = "SCHEM-NL-02"
area = "SCHEM"
capability = "schematic-netlisting"
requirements = ["Format string substitution", "expr evaluation", "Element line post-processing"]
tool = "xschem"
description = "sky130 sky130_tests/test_inv.sch with the sky130A xschemrc (spiceprefix, corner tcleval)."
provenance = "pdk:sky130-xschem:sky130A/libs.tech/xschem/sky130_tests/test_inv.sch"

[reference]
argv = ["sh", "/work/input/run.sh"]
allow_nonzero_exit = true
xschem_sets = ["sky130-xschem"]

[hefesto]
args = ["--no-log", "{input}/replay.hef"]
requires_commands = ["schematic"]

[[outputs]]
name = "test_inv.spice"
source = "out/test_inv.spice"
