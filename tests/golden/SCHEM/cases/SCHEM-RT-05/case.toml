schema = 1
id = "SCHEM-RT-05"
area = "SCHEM"
capability = "schematic-file-format"
requirements = ["Embedded symbols"]
tool = "xschem"
description = "Hefesto-authored schematic with an embedded symbol (lines, boxes, arcs, polygons, texts), a schematic used as a symbol marked embed=true, and a plain instance of each."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/hefesto.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "embed.sch"
source = "out/embed.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "2-embed.sch"
source = "out/2-embed.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
