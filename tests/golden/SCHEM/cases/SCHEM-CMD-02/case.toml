schema = 1
id = "SCHEM-CMD-02"
area = "SCHEM"
capability = "schematic-command"
requirements = ["xschem compatibility command"]
tool = "xschem"
description = "The result of xschem netlist after a run that reports no error (the success value of Q-SCHEM-61), on the divider of SCHEM-CMD-01."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/hefesto.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "div.spice"
source = "out/div.spice"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths", "schem-hefesto-driver"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
