schema = 1
id = "SCHEM-RT-08"
area = "SCHEM"
capability = "schematic-file-format"
requirements = ["Version record and header text"]
tool = "xschem"
description = "Files with no version record: (a) first record K {}, (b) first record an instance (Q-SCHEM-3)."
provenance = "hefesto"

[reference]
argv = ["xschem", "-q", "-x", "-r", "--rcfile", "/work/input/xschemrc", "--script", "/work/input/case.tcl"]
allow_nonzero_exit = true

[hefesto]
args = ["--no-log", "{input}/hefesto.tcl"]
requires_commands = ["xschem"]

[[outputs]]
name = "a.sch"
source = "out/a.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "2-a.sch"
source = "out/2-a.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "b.sch"
source = "out/b.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "2-b.sch"
source = "out/2-b.sch"
comparator = "bytes"
masks = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = ["schem-paths"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
