#
# EX-018 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).

schema = 1
id = "EX-018"
area = "EXTRACT"
capability = "extract-resistance-lumped"
requirements = ["Per-class area and perimeter of a node", "Area and perimeter values in records", "Resistance class header"]
tool = "magic"
description = "two classes, resist poly 5000 and resist metal1 80; one node of poly, an m1c contact and metal1: per-class area/perimeter pairs"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.ext"
source = "input/ex.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
