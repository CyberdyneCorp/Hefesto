#
# EX-039 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).

schema = 1
id = "EX-039"
area = "EXTRACT"
capability = "extract-devices"
requirements = ["Missing terminals and rejected devices"]
tool = "magic"
description = "an nfet with diffusion on its left only: the copied terminal; extract warn fets, then extract warn no fets, with the feedback count after each"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.warnfets.ext"
source = "input/ex.warnfets.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.nowarnfets.ext"
source = "input/ex.nowarnfets.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
