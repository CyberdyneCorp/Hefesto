#
# EX-055 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).
# Collected .ext files: input/ex.ext.

schema = 1
id = "EX-055"
area = "EXTRACT"
capability = "extract-hierarchy"
requirements = ["Interaction halo and step squares", "Interaction area"]
tool = "magic"
description = "step 20, sidehalo 4, sidewall metal1 space space metal1 40, extract no fringehalo; a parent metal1 wire (0,0)-(60,2) beside child c1's wire (0,4)-(60,6): the hierarchical cap records over three squares"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
