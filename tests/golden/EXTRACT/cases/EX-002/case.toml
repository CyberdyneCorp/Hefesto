#
# EX-002 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).

schema = 1
id = "EX-002"
area = "EXTRACT"
capability = "extract-capacitance"
requirements = ["Area capacitance to substrate", "Perimeter capacitance to substrate"]
tool = "magic"
description = "areacap metal1 30, perimc metal1 space 20; metal1 (0,0)-(10,4): C = 1760 with cscale 1, then 1.76 in style exttest1000 (cscale 1000)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.c1.ext"
source = "input/ex.c1.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.c1000.ext"
source = "input/ex.c1000.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
