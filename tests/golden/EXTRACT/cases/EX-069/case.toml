#
# EX-069 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).
# Collected .ext files: input/ex.default.ext, input/ex.halo8.ext, input/ex.style.ext.

schema = 1
id = "EX-069"
area = "EXTRACT"
capability = "extract-commands"
requirements = ["Style, halo and step size"]
tool = "magic"
description = "sidewall metal1 space space metal1 40, sidehalo 4, extract no fringehalo; two wires 6 apart: no cap with the style's halo, the cap after extract halo 8, none again after extract style exttest reloads the style"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
