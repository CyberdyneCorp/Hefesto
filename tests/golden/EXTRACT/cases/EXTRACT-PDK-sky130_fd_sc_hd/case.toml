#
# EXTRACT-PDK-sky130_fd_sc_hd (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# PDK case of m7-extraction design D21 (task 17.4): fresh session, the PDK's rc, --trust-pdk, random seed 1, TZ=UTC, LC_ALL=C.
# Collected: ext/<cell>.ext per cell and ext/pdk_lib.ext (ext-cap); a differing cell is named by its file.

schema = 1
id = "EXTRACT-PDK-sky130_fd_sc_hd"
area = "EXTRACT"
capability = "extract-commands"
requirements = ["Extract all, cell, parents and showparents", "Output path and file location"]
tool = "magic"
description = "sky130A sky130_fd_sc_hd (446 cells, the .mag files of libs.ref/sky130_fd_sc_hd/mag): every cell placed in a wrapper pdk_lib, extract path ext, extract all with the PDK's default style: one .ext per cell"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
timeout_s = 1800

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
requires_commands = []
timeout_s = 1800

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "pdk"
path = "sky130A/libs.ref/sky130_fd_sc_hd/mag"
to = "pdk/sky130A/libs.ref/sky130_fd_sc_hd/mag"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
