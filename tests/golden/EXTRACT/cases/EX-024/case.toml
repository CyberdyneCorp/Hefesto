#
# EX-024 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).
# ex.dounique.mag carries Q-EXTRACT-6 (fix in both modes): Hefesto reverts the temporary _uq labels of the top cell (design D21, task 17.7).

schema = 1
id = "EX-024"
area = "EXTRACT"
capability = "extract-nodes-and-labels"
requirements = ["Unique naming of duplicate labels", "Duplicate label warning"]
tool = "magic"
description = "two unconnected net1 labels and two unconnected vdd! labels: extract do unique (temporary), then extract unique # (vdd! kept, net1 warned), then extract unique; the .ext names and the saved layout labels after each step"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.dounique.ext"
source = "input/ex.dounique.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.uniquehash.ext"
source = "input/ex.uniquehash.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.unique.ext"
source = "input/ex.unique.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.dounique.mag"
source = "ex.dounique.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "ex.uniquehash.mag"
source = "ex.uniquehash.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "ex.unique.mag"
source = "ex.unique.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
