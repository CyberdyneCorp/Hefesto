#
# EX-072 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).
# Collected .ext files: input/ex.ext.

schema = 1
id = "EX-072"
area = "EXTRACT"
capability = "extract-tech-section"
requirements = ["Contact residues and coupling table completion"]
tool = "magic"
description = "overlap metal2 metal1 20, sidewall metal1 space space metal1 40, sidehalo 4, extract no fringehalo; an m1c contact a (0,0)-(4,4) and a metal1 wire c (6,0)-(10,4) under a metal2 plate b (0,0)-(10,10): the contact takes its metal1 residue's overlap and sidewall couplings"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
