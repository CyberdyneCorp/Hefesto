#
# EX-068 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).
# Collected .ext files: input/ex.ext, input/exl.ext, input/rleaf.ext.

schema = 1
id = "EX-068"
area = "EXTRACT"
capability = "extract-commands"
requirements = ["Path length extraction"]
tool = "magic"
description = "extract do length, drivers d d2 nosuch and receivers r c1/r: a straight metal1 wire (ex), then a metal1 ring through a metal2 bridge with a receiver in a subcell (exl): the distance records and the missing drivers' messages"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
