#
# EX-035 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).
# The substrate types come from OTHER (Q-EXTRACT-2, replicate).

schema = 1
id = "EX-035"
area = "EXTRACT"
capability = "extract-devices"
requirements = ["Diode records"]
tool = "magic"
description = "device diode dn ndiff pwell a=area p=pj; an ndiff region of area 20 and perimeter 18 in pwell: a=20 p=18"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.ext"
source = "input/ex.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
