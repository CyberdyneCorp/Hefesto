#
# EX-017 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).

schema = 1
id = "EX-017"
area = "EXTRACT"
capability = "extract-resistance-lumped"
requirements = ["Lumped resistance formula", "Resistance output rounding"]
tool = "magic"
description = "resist metal1 80; metal1 10x2 and 4x4: R = 400 and 80 with rscale 1, 0 in style exttest1000 (rscale 1000)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.r1.ext"
source = "input/ex.r1.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.r1000.ext"
source = "input/ex.r1000.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
