#
# EX-016 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).

schema = 1
id = "EX-016"
area = "EXTRACT"
capability = "extract-capacitance"
requirements = ["Coupling to the substrate node"]
tool = "magic"
description = "substrate *psd,space,pwell well and defaultareacap metal1 metal1 well 30; metal1 over a pwell of the substrate node: no cap record names the substrate, metal1's node C holds the value"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.ext"
source = "input/ex.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
