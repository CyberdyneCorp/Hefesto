#
# EXTRACT-PDK-sg13g2_stdcell (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# PDK case of m7-extraction design D21 (task 17.4): fresh session, the PDK's rc, --trust-pdk, random seed 1, TZ=UTC, LC_ALL=C.
# Collected: ext/<cell>.ext per cell and ext/pdk_lib.ext (ext-cap); a differing cell is named by its file.

schema = 1
id = "EXTRACT-PDK-sg13g2_stdcell"
area = "EXTRACT"
capability = "extract-commands"
requirements = ["Extract all, cell, parents and showparents", "Output path and file location"]
tool = "magic"
description = "ihp-sg13g2 sg13g2_stdcell (84 cells, sg13g2_stdcell.gds of the ihp-gds-sc set (gds read)): every cell placed in a wrapper pdk_lib, extract path ext, extract all with the PDK's default style: one .ext per cell"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
timeout_s = 1800

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "ihp-sg13g2", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
requires_commands = []
timeout_s = 1800

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "ihp-sg13g2"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[external]]
source = "pdk"
set = "ihp-gds-sc"
path = "ihp-sg13g2/libs.ref/sg13g2_stdcell/gds"
to = "lib"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp", "ext-devres-uninit-width"]
