#
# EX-013 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/*.mag; rules appended to style exttest of authoring/exttest.tech (design D21).

schema = 1
id = "EX-013"
area = "EXTRACT"
capability = "extract-capacitance"
requirements = ["Corner fringe capacitance to substrate", "Corner fringe coupling"]
tool = "magic"
description = "a lone metal2 rectangle and an L-shaped metal2 (one concave corner) over a metal1 plate; fringehalo on; without corners, with extract do corners and with extract do corners 0.5"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "ex.nocorners.ext"
source = "input/ex.nocorners.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.corners.ext"
source = "input/ex.corners.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[outputs]]
name = "ex.corners05.ext"
source = "input/ex.corners05.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
