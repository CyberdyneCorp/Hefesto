schema = 1
id = "CMDEDIT-SEL-15"
area = "CMDEDIT"
capability = "cmd-selection"
requirements = ["Array command"]
tool = "magic"
description = "Instance inv 0 0 10 20, box 0 0 12 25; array 3 2; array -list count; array 0 2 3 1 (Q-CMDEDIT-63)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
