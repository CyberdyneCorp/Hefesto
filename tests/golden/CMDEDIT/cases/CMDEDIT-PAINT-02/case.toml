#
# CMDEDIT-PAINT-02 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-02"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Layer list syntax", "Paint command"]
tool = "magic"
description = "paint *,-metal2; paint -poly,metal1; paint metal1,connect; paint foo, labels, subcell."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "p1.mag"
source = "p1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "p2.mag"
source = "p2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "p3.mag"
source = "p3.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
