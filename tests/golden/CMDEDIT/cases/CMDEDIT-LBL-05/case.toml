#
# CMDEDIT-LBL-05 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-LBL-05"
area = "CMDEDIT"
capability = "cmd-labels-properties"
requirements = ["Property command"]
tool = "magic"
description = "property FIXED_BBOX \"0 0 100 200\", property, foo bar, foo \"\", integer n 1 2, compat (Q-CMDEDIT-93)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
