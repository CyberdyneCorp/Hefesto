schema = 1
id = "CMDEDIT-BOX-07"
area = "CMDEDIT"
capability = "cmd-box"
requirements = ["Edit-coordinate switch"]
tool = "magic"
description = "Edit a child placed rotated 90; root box 0 0 10 20; -edit queries and setter."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
