schema = 1
id = "CMDEDIT-PAINT-12"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Polygon command"]
tool = "magic"
description = "A triangle, a pentagon, odd coordinates, too few coordinates and an odd coordinate count (Q-CMDEDIT-19)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "p1.mag"
source = "p1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "p2.mag"
source = "p2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "p3.mag"
source = "p3.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
