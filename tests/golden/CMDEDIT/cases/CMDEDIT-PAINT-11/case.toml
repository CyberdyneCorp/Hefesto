#
# CMDEDIT-PAINT-11 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-11"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Contact command"]
tool = "magic"
description = "metal1 and metal2 overlap; contact m2c; contact erase m2c; contact metal1."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "c1.mag"
source = "c1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "c2.mag"
source = "c2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
