#
# CMDEDIT-HIER-05 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-HIER-05"
area = "CMDEDIT"
capability = "cmd-hierarchy"
requirements = ["Edit command", "Down command"]
tool = "magic"
description = "edit on an instance at translate 100 0; paint metal1; edit x1/x2; down (Q-CMDEDIT-30)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "c1.mag"
source = "c1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "c2.mag"
source = "c2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
