#
# CMDEDIT-PAINT-03 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-03"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Paint or erase by example (cursor and pick)"]
tool = "magic"
description = "metal1+poly at 5 5 6 6; paint pick 5 5; paint pick 50 50."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "p1.mag"
source = "p1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "p2.mag"
source = "p2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
