#
# CMDEDIT-PAINT-14 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-14"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Spliterase command"]
tool = "magic"
description = "metal1 over the box; spliterase sw metal1; spliterase ne."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "s1.mag"
source = "s1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "s2.mag"
source = "s2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
