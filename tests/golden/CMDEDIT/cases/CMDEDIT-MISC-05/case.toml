schema = 1
id = "CMDEDIT-MISC-05"
area = "CMDEDIT"
capability = "cmd-misc-edit"
requirements = ["Random command"]
tool = "magic"
description = "random seed 42; random; random seed 42; random."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
