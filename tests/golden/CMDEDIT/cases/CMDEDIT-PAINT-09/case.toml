#
# CMDEDIT-PAINT-09 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-09"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Paint command", "Erase command"]
tool = "magic"
description = "Stacked contact pm12c: paint it; erase it; erase the user contact pc (Q-CMDEDIT-16)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "s1.mag"
source = "s1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "s2.mag"
source = "s2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "s3.mag"
source = "s3.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
