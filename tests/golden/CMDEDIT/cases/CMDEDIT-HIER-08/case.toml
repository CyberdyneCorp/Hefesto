schema = 1
id = "CMDEDIT-HIER-08"
area = "CMDEDIT"
capability = "cmd-hierarchy"
requirements = ["Cellname and instance commands"]
tool = "magic"
description = "cellname list children/parents/allcells/topcells, exists, instance orientation -def, rename, writeable."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
