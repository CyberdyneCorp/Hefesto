#
# CMDEDIT-BOX-02 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-BOX-02"
area = "CMDEDIT"
capability = "cmd-box"
requirements = ["Box move, grow and shrink"]
tool = "magic"
description = "grow center 2, shrink n 30, move ne 3, move n 0."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
