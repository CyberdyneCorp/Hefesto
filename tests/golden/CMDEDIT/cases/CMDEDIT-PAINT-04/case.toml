[[outputs]]
name = "e1.mag"
source = "e1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "e2.mag"
source = "e2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "e3.mag"
source = "e3.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
