schema = 1
id = "CMDEDIT-PAINT-04"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Erase command"]
tool = "magic"
description = "metal1, poly and label A in the box: erase; erase poly; erase labels; erase space."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
