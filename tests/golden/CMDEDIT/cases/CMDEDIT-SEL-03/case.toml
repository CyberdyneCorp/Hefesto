schema = 1
id = "CMDEDIT-SEL-03"
area = "CMDEDIT"
capability = "cmd-selection"
requirements = ["Point selection and cycling"]
tool = "magic"
description = "metal1-m2c-metal2 net; select at 5 5 repeated (cycling)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]
