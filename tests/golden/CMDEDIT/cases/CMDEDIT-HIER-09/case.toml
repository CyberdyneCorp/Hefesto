#
# CMDEDIT-HIER-09 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-HIER-09"
area = "CMDEDIT"
capability = "cmd-hierarchy"
requirements = ["Save command", "Writeall command", "Flush command"]
tool = "magic"
description = "save adder from (UNNAMED); writeall force; flush a -noprompt."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "adder.mag"
source = "adder.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "b.mag"
source = "b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
