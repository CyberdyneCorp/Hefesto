schema = 1
id = "CMDEDIT-PAINT-06"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Erase command"]
tool = "magic"
description = "Zero-area box on a point label, on a label border and inside a rect label; erase labels (Q-CMDEDIT-20)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
