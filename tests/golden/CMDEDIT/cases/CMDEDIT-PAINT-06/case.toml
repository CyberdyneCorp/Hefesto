[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "l1.mag"
source = "l1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "l2.mag"
source = "l2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "l3.mag"
source = "l3.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
