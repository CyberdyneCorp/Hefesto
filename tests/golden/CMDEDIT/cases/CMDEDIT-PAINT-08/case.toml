schema = 1
id = "CMDEDIT-PAINT-08"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Corner command"]
tool = "magic"
description = "Box 0 0 20 20 with a wire entering from each side; the 8 corner combinations; corner n s; a too-wide wire."

[reference]
