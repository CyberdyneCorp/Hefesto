# CMDEDIT-PAINT-05 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-05"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Erase command"]
tool = "magic"
description = "Three instances, two overlapping the box; erase subcell."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
