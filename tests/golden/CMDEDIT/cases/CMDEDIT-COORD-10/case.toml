#
# CMDEDIT-COORD-10 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-COORD-10"
area = "CMDEDIT"
capability = "cmd-coordinates-and-units"
requirements = ["Scalegrid command"]
tool = "magic"
description = "metal1 -3 0 3 4, box 0 0 3 5; scalegrid 1 2; save; scalegrid 2 1; save."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "a1.mag"
source = "a1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "a2.mag"
source = "a2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
