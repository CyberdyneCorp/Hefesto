#
# CMDEDIT-HIER-11 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-HIER-11"
area = "CMDEDIT"
capability = "cmd-hierarchy"
requirements = ["Archive command"]
tool = "magic"
description = "archive writeall arch.mag; archive read into a fresh cell; archive write (Q-CMDEDIT-34)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "arch.mag"
source = "arch.mag"
comparator = "mag-backup"
masks = ["mag-timestamp", "mag-checkpaint"]
