#
# CMDEDIT-LBL-02 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-LBL-02"
area = "CMDEDIT"
capability = "cmd-labels-properties"
requirements = ["Label command", "Label units and attributes"]
tool = "magic"
description = "label VDD n -metal2; label A 0 2 45 1 1 sw metal1; label \"a b\"; label x/y."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
