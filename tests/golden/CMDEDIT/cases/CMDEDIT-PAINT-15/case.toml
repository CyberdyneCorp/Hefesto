schema = 1
id = "CMDEDIT-PAINT-15"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Drop command"]
tool = "magic"
description = "Top with a child holding dnwell: select area dnwell; drop pwell; then with the child as edit cell (Q-CMDEDIT-17)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
