#
# CMDEDIT-BOX-01 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-BOX-01"
area = "CMDEDIT"
capability = "cmd-box"
requirements = ["Box size and position setters", "Box normalization and bounds"]
tool = "magic"
description = "box values 10 10 20 30; width 5, height -4, position 0 -5, size 7 8 (box values after each)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]
