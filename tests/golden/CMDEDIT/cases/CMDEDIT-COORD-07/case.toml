schema = 1
id = "CMDEDIT-COORD-07"
area = "CMDEDIT"
capability = "cmd-coordinates-and-units"
requirements = ["Units command"]
tool = "magic"
description = "units queries and modes from a fresh session (Q-CMDEDIT-6)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
