# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-10"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Corner command"]
tool = "magic"
description = "corner n e metal1 bevel in the root cell, and in a child edit cell placed at 100 0 (Q-CMDEDIT-15)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "r.mag"
source = "r.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "child.mag"
source = "child.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
