#
# CMDEDIT-SEL-10 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-SEL-10"
area = "CMDEDIT"
capability = "cmd-selection"
requirements = ["Copy and move displacement"]
tool = "magic"
description = "move 5 7, move w, move to 0 0; a selection with child paint."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "m1.mag"
source = "m1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "c.mag"
source = "c.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
