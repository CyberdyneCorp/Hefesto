#
# CMDEDIT-SEL-09 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-SEL-09"
area = "CMDEDIT"
capability = "cmd-selection"
requirements = ["Copy and move displacement"]
tool = "magic"
description = "copy e 20, 5 7, ne 3 4, to 100 100, 10."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
