#
# CMDEDIT-MISC-01 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-MISC-01"
area = "CMDEDIT"
capability = "cmd-misc-edit"
requirements = ["Xor command"]
tool = "magic"
description = "xor of identical cells; overlapping offset metal1; different types; xor -nolabels -novendor (Q-CMDEDIT-94, 95)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "b.mag"
source = "b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "d.mag"
source = "d.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "f.mag"
source = "f.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
