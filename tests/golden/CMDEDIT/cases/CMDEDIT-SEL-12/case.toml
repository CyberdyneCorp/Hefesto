#
# CMDEDIT-SEL-12 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-SEL-12"
area = "CMDEDIT"
capability = "cmd-selection"
requirements = ["Stretch command"]
tool = "magic"
description = "stretch e 10 of a wire end; stretch n 5 with abutting poly."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "s1.mag"
source = "s1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "s2.mag"
source = "s2.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
