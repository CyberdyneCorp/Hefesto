#
# CMDEDIT-PAINT-01 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-PAINT-01"
area = "CMDEDIT"
capability = "cmd-paint-erase"
requirements = ["Paint command", "Common effects of edit-cell paint changes"]
tool = "magic"
description = "Empty cell, box 0 0 10 20; paint poly,metal1; save; undo; save."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-tech-sections"]

[[outputs]]
name = "p1.mag"
source = "p1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "p2.mag"
source = "p2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
