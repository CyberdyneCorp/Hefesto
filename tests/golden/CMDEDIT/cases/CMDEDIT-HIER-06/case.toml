schema = 1
id = "CMDEDIT-HIER-06"
area = "CMDEDIT"
capability = "cmd-hierarchy"
requirements = ["Flatten command"]
tool = "magic"
description = "3-level hierarchy; flatten f1, -nolabels f2, -dotoplabels f3, -dobox f4, f1 again, -doinplace mid_0 (Q-CMDEDIT-31)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "f1.mag"
source = "f1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "f2.mag"
source = "f2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "f3.mag"
source = "f3.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "f4.mag"
source = "f4.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "top.mag"
source = "top.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
