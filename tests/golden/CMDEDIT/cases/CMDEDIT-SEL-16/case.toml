# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-SEL-16"
area = "CMDEDIT"
capability = "cmd-selection"
requirements = ["Array command"]
tool = "magic"
description = "Labels D0 and A[0][0] selected; array 4 1, 1 3, 2 2."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "l1.mag"
source = "l1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "l2.mag"
source = "l2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "l3.mag"
source = "l3.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
