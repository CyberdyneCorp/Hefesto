#
# CMDEDIT-SEL-20 (CMDEDIT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m2_cases.py.

schema = 1
id = "CMDEDIT-SEL-20"
area = "CMDEDIT"
capability = "cmd-selection"
requirements = ["Selection utility options"]
tool = "magic"
description = "Labeled net A-B; select short A B; select bbox; select save sel1."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "sel1.mag"
source = "sel1.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
