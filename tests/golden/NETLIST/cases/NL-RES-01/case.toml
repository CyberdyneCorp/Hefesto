#
# NL-RES-01 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/rescmd_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/wire.mag; input/restest.tech (authoring/rescmd_cases.py; design D21).
# Replays once the extractor (EXTCMD) and RESNET's network land (integration).

schema = 1
id = "NL-RES-01"
area = "NETLIST"
capability = "extresist-command"
requirements = ["Run flow", "Net selection and first cutoff"]
tool = "magic"
description = "an inverter driving a 400x2 metal1 wire to two nfet gates; extresist with the default options: the .res.ext and the statistics"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.res.ext"
comparator = "res-ext"
masks = []

[[collect]]
pattern = "*.res.lump"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[collect]]
pattern = "*.spice"
comparator = "spice-cap"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "sim-cap"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.fh"
comparator = "bytes"
masks = []
