#
# NL-FLAT-20 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Netlists collected by name: top.c05.spice, top.cinf.spice, top.syms.sim, top2.spice.

schema = 1
id = "NL-FLAT-20"
area = "NETLIST"
capability = "ext-flattening-hierarchy"
requirements = ["Common netlister arguments"]
tool = "magic"
description = "ext2spice -c 0.5 and -C (thresholds per run), ext2sim -R with -s L=4 and a -S file holding W=7 and a line without '=', ext2spice -T (unrecognized), then ext2spice -p input:input/sub on top2, whose leaf is only under input/sub (last: Magic keeps the -p path for later runs)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "spice-cap"
masks = []

[[collect]]
pattern = "*.cdl"
comparator = "spice-cap"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "sim-cap"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
