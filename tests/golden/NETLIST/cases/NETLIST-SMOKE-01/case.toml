#
# NETLIST-SMOKE-01 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_smoke_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Smoke case of the capture machinery (authoring/m7_smoke_cases.py), not a NETLIST/CASES.md row.

schema = 1
id = "NETLIST-SMOKE-01"
area = "NETLIST"
capability = "extract-commands"
requirements = ["Output path and file location"]
tool = "magic"
description = "capture smoke (m7-extraction task 2.3): M6's smoke layout through extract all, ext2spice, ext2sim and extresist; every M7 output collected by name pattern"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[collect]]
pattern = "*.res.ext"
comparator = "res-ext"
masks = []

[[collect]]
pattern = "*.res.lump"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]

[[collect]]
pattern = "*.spice"
comparator = "spice-cap"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "sim-cap"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.fh"
comparator = "bytes"
masks = []
