#
# NL-FLAT-06 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Q-NETLIST-31 (magic-compat ON): the short devices share the terminal-0 node dummy.

schema = 1
id = "NL-FLAT-06"
area = "NETLIST"
capability = "ext-flattening-read"
requirements = ["Equivalence, merge and kill records"]
tool = "magic"
description = "ports A and B shorted by equiv; runs with short none, short resistor and short voltage: the netlists and the shorted-ports warning"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.none.spice"
source = "top.none.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.resistor.spice"
source = "top.resistor.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.voltage.spice"
source = "top.voltage.spice"
comparator = "spice-cap"
masks = []
