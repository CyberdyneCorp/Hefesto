#
# NL-SPICE-01 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Netlists collected by name: .

schema = 1
id = "NL-SPICE-01"
area = "NETLIST"
capability = "netlist-spice-options"
requirements = ["Command options"]
tool = "magic"
description = "ext2spice option queries and sets, unique prefixes, a bad format, lvs, default, an ambiguous prefix (r) and run taken as the cell name (Q-NETLIST-13, Q-NETLIST-41, magic-compat ON): the Tcl results"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.cdl"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
