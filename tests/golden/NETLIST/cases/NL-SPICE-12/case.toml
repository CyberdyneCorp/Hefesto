#
# NL-SPICE-12 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# No device has one terminal, so Q-NETLIST-6 (fix in both modes) changes nothing here.

schema = 1
id = "NL-SPICE-12"
area = "NETLIST"
capability = "netlist-spice-devices"
requirements = ["Parallel device merging"]
tool = "magic"
description = "parallel nfets (equal W, swapped S/D, unequal W) and parallel unmodeled caps; merge none, conservative and aggressive: M= values, dropped devices, divided areas"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.none.spice"
source = "top.none.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.conservative.spice"
source = "top.conservative.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.aggressive.spice"
source = "top.aggressive.spice"
comparator = "spice-cap"
masks = []
