#
# NL-SIM-04 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).

schema = 1
id = "NL-SIM-04"
area = "NETLIST"
capability = "netlist-sim"
requirements = ["Name conversion state"]
tool = "magic"
description = "node vdd!: ext2sim in the fresh session, then ext2spice, then ext2sim again (Q-NETLIST-16, magic-compat ON)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.fresh.sim"
source = "top.fresh.sim"
comparator = "sim-cap"
masks = []

[[outputs]]
name = "top.spice"
source = "top.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.afterspice.sim"
source = "top.afterspice.sim"
comparator = "sim-cap"
masks = []
