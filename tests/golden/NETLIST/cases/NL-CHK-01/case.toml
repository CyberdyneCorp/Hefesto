#
# NL-CHK-01 (NETLIST/CASES.md). expected/ is hand-derived (design R7 option (a), decision M7-9):
# written by tools/golden/authoring/m7_cases.py, never by capture.py. External-command case (m7-extraction design D15,
# task 2.3): input/command.toml names the role extcheck (Magic's standalone extcheck on capture,
# hefesto-extcheck on replay); each run writes <run>.stdout, <run>.stderr and <run>.exit in the work dir.

schema = 1
id = "NL-CHK-01"
area = "NETLIST"
capability = "netlist-extcheck"
requirements = ["Counts and report format", "Invocation"]
tool = "magic"
description = "two inverters (x1, x2) each with a vdd! node, not connected, plus a coupling and a resistor; extcheck with default thresholds, with -c 0 -r 0, with -C -r 0, and with no arguments (usage, exit status 1)"
hand_derived = "R7 option (a), approved 2026-11-22 (m7-decision-table M7-9; Q-NETLIST-50): Magic's standalone extcheck does not link at fc5daa9e (golden-capture runs 44961645329, 44964258826: build=unavailable), so expected/ is hand-derived from extcheck/extcheck.c and extflat/EFargs.c by tools/golden/authoring/netlist_cases.py extcheck_expected()"

[reference]
mode = "external-command"

[[outputs]]
name = "default.stdout"
source = "default.stdout"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
name = "default.stderr"
source = "default.stderr"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
name = "default.exit"
source = "default.exit"
comparator = "extcheck-console"
masks = []

[[outputs]]
name = "thresholds.stdout"
source = "thresholds.stdout"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
name = "thresholds.stderr"
source = "thresholds.stderr"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
name = "thresholds.exit"
source = "thresholds.exit"
comparator = "extcheck-console"
masks = []

[[outputs]]
name = "nocaps.stdout"
source = "nocaps.stdout"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
name = "nocaps.stderr"
source = "nocaps.stderr"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
name = "nocaps.exit"
source = "nocaps.exit"
comparator = "extcheck-console"
masks = []

[[outputs]]
name = "usage.stdout"
source = "usage.stdout"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
name = "usage.stderr"
source = "usage.stderr"
comparator = "extcheck-console"
masks = ["prog-name", "extcheck-memory"]

[[outputs]]
