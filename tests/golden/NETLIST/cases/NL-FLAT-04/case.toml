#
# NL-FLAT-04 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# No vsource record: EFread.c leaves the token count `ac` uninitialised for that class (EFread.c:313-340); the V line is exercised by short voltage (NL-FLAT-06, NL-HIER-06).

schema = 1
id = "NL-FLAT-04"
area = "NETLIST"
capability = "ext-flattening-read"
requirements = ["Device records"]
tool = "magic"
description = "one device of each class the reader parses (mosfet, asymmetric, fet, bjt, devres None and modeled, devcap None and modeled, devcaprev, diode, pdiode, ndiode, subckt, rsubckt, msubckt, csubckt, dsubckt, veriloga); ext2spice: the full netlist"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.spice"
source = "top.spice"
comparator = "spice-cap"
masks = []
