#
# NL-FLAT-12 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Netlists collected by name: top.globalon.spice, top.globalsarray.spice, top.globaloff.spice.
# Magic's Tcl build takes global names from the Tcl array globals only (EFname.c:101-112, D-14).

schema = 1
id = "NL-FLAT-12"
area = "NETLIST"
capability = "ext-flattening-hierarchy"
requirements = ["Global name merging"]
tool = "magic"
description = "two instances each with a vdd! node, not connected: global on without and with the Tcl array globals(vdd!), then global off: the node names and the not-fully-connected text"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.cdl"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
