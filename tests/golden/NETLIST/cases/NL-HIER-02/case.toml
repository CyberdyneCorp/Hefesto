#
# NL-HIER-02 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Netlists collected by name: top.cfinite.spice, top.cinfinite.spice.

schema = 1
id = "NL-HIER-02"
area = "NETLIST"
capability = "netlist-spice-hierarchy"
requirements = ["Port promotion"]
tool = "magic"
description = "a child net reached only through a parent merge, and a coupling into the child; cthresh finite, then infinite: the promoted ports"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "spice-cap"
masks = []

[[collect]]
pattern = "*.cdl"
comparator = "spice-cap"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "sim-cap"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
