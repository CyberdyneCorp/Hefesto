#
# NL-RESNET-13 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/resnet_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Layout in input/rn.mag on authoring/exttest.tech with resnet_cases.RULES and contact cuts (design D21); extract all, then extresist in a fresh session (Q-NETLIST-46).

schema = 1
id = "NL-RESNET-13"
area = "NETLIST"
capability = "extresist-network"
requirements = ["Elmore delay and pruning"]
tool = "magic"
description = "a fanout net with three gate loads; mindelay 100 ps (re-authored: a labelled GND! square gives the substrate net a record, Q-NETLIST-63)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.res.ext"
comparator = "res-ext"
masks = []
