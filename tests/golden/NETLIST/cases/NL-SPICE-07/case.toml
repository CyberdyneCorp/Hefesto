#
# NL-SPICE-07 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Netlists collected by name: top.spice3.spice, top.ngspice.spice, top.dashF.spice, top.dashB.spice.

schema = 1
id = "NL-SPICE-07"
area = "NETLIST"
capability = "netlist-spice-options"
requirements = ["Parasitic and node lines"]
tool = "magic"
description = "a floating node with 3 fF, node attributes, in spice3 and ngspice, then -F and -B: the node lines"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.cdl"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
