#
# NL-SPICE-05 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).

schema = 1
id = "NL-SPICE-05"
area = "NETLIST"
capability = "netlist-spice-options"
requirements = ["Flat netlist structure", "Subcircuit header line"]
tool = "magic"
description = "flat inverter with ports under subcircuits top on, auto and off: the .subckt wrapper (Q-NETLIST-37, magic-compat ON)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "inv.topon.spice"
source = "inv.topon.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "inv.topauto.spice"
source = "inv.topauto.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "inv.topoff.spice"
source = "inv.topoff.spice"
comparator = "spice-cap"
masks = []
