#
# NL-SPICE-11 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Q-NETLIST-4 (magic-compat ON): flat mode writes the resistance for an unnamed c parameter.

schema = 1
id = "NL-SPICE-11"
area = "NETLIST"
capability = "netlist-spice-devices"
requirements = ["Resistor lines", "Capacitor, diode, BJT and voltage source lines"]
tool = "magic"
description = "CDL with a modeled R and C, unnamed r= and c= parameters and an s= substrate parameter: value placement and /"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.cdl"
source = "top.cdl"
comparator = "spice-cap"
masks = []
