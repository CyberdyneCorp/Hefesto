#
# NL-SPICE-02 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Netlists collected by name: inv.spice2.spice, inv.spice3.spice, inv.hspice.spice, inv.ngspice.spice, inv.cdl, custom.spice.

schema = 1
id = "NL-SPICE-02"
area = "NETLIST"
capability = "netlist-spice-options"
requirements = ["File header and scale card", "Node names per dialect", "Run arguments and output file"]
tool = "magic"
description = "an inverter in formats spice2, spice3, hspice, ngspice and cdl (inv.cdl), and a run with -o custom.spice"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.cdl"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
