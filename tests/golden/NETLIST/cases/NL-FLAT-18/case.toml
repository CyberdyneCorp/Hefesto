#
# NL-FLAT-18 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Q-NETLIST-30 and Q-NETLIST-16 (magic-compat ON): flags accumulate across the runs of the session.

schema = 1
id = "NL-FLAT-18"
area = "NETLIST"
capability = "ext-flattening-names"
requirements = ["SPICE output name conversion", "Sim output name conversion"]
tool = "magic"
description = "names with , = [ ] . # ! in the leaf and in the instance prefix; formats spice3, hspice and cdl, then ext2sim -t !#,=["

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.spice3.spice"
source = "top.spice3.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.hspice.spice"
source = "top.hspice.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.cdl"
source = "top.cdl"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.sim"
source = "top.sim"
comparator = "sim-cap"
masks = []
