#
# NL-SIM-01 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).

schema = 1
id = "NL-SIM-01"
area = "NETLIST"
capability = "netlist-sim"
requirements = ["File structure and order", "Device lines", "Parasitic and node records"]
tool = "magic"
description = "inverter in MIT, LBL and SU; alias on (inv.al); then labels on with alias still on (inv.nodes)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "inv.mit.sim"
source = "inv.mit.sim"
comparator = "sim-cap"
masks = []

[[outputs]]
name = "inv.lbl.sim"
source = "inv.lbl.sim"
comparator = "sim-cap"
masks = []

[[outputs]]
name = "inv.su.sim"
source = "inv.su.sim"
comparator = "sim-cap"
masks = []

[[outputs]]
name = "inv.alias.sim"
source = "inv.alias.sim"
comparator = "sim-cap"
masks = []

[[outputs]]
name = "inv.alias.al"
source = "inv.alias.al"
comparator = "bytes"
masks = []

[[outputs]]
name = "inv.labels.sim"
source = "inv.labels.sim"
comparator = "sim-cap"
masks = []

[[outputs]]
name = "inv.labels.al"
source = "inv.labels.al"
comparator = "bytes"
masks = []

[[outputs]]
name = "inv.labels.nodes"
source = "inv.labels.nodes"
comparator = "bytes"
masks = []
