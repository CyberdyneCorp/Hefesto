#
# NL-SPICE-13 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).

schema = 1
id = "NL-SPICE-13"
area = "NETLIST"
capability = "netlist-spice-devices"
requirements = ["Device instance names", "Device eligibility and annotations"]
tool = "magic"
description = "inside instance u1: a device named by its gate attribute foo, a device whose source attribute is D (swapped terminals) and a two-terminal MOSFET (SOURCE/DRAIN TIED); flat and hierarchical (Q-NETLIST-34, magic-compat ON)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "top.flat.spice"
source = "top.flat.spice"
comparator = "spice-cap"
masks = []

[[outputs]]
name = "top.hier.spice"
source = "top.hier.spice"
comparator = "spice-cap"
masks = []
