#
# NETLIST-PDK-sg13g2_stdcell (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# PDK case of m7-extraction design D21 (task 17.4): fresh session, the PDK's rc, --trust-pdk, random seed 1, TZ=UTC, LC_ALL=C.
# input/ext is staged from EXTRACT-PDK-sg13g2_stdcell's expected/ (source golden): capture it after that case is committed.

schema = 1
id = "NETLIST-PDK-sg13g2_stdcell"
area = "NETLIST"
capability = "netlist-spice-options"
requirements = ["Run arguments and output file", "Flat netlist structure"]
tool = "magic"
description = "ihp-sg13g2 sg13g2_stdcell: the .ext files captured by EXTRACT-PDK-sg13g2_stdcell; per cell ext2spice lvs with hierarchy off (flat/) and ext2spice hierarchy on format ngspice (hier/); ext2sim of the wrapper pdk_lib (the whole library)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
timeout_s = 1800

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "ihp-sg13g2", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
requires_commands = []
timeout_s = 1800

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "ihp-sg13g2"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[external]]
source = "golden"
path = "EXTRACT/cases/EXTRACT-PDK-sg13g2_stdcell/expected/collected/ext"
to = "ext"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "ext-times", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "spice-cap"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "sim-cap"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
