#
# NL-HIER-06 (NETLIST/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m7_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Hand-written .ext inputs and authoring/nltest.tech (design D21).
# Netlists collected by name: top.spice.

schema = 1
id = "NL-HIER-06"
area = "NETLIST"
capability = "netlist-spice-hierarchy"
requirements = ["Hierarchical device and parasitic differences"]
tool = "magic"
description = "two cells with a tee rsubckt, a modeled resistor in scale mode, negative couplings and shorted ports under short voltage (Q-NETLIST-35, Q-NETLIST-19, Q-NETLIST-20, magic-compat ON)"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.spice"
comparator = "spice-cap:VSUB,c2/VSUB"
masks = []

[[collect]]
pattern = "*.cdl"
comparator = "spice-cap:VSUB,c2/VSUB"
masks = []

[[collect]]
pattern = "*.sim"
comparator = "sim-cap"
masks = []

[[collect]]
pattern = "*.al"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.nodes"
comparator = "bytes"
masks = []
