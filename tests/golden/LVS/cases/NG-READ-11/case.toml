schema = 1
id = "NG-READ-11"
area = "LVS"
capability = "lvs-netlist-input"
requirements = [".sim input"]
tool = "netgen"
description = "A .sim file with | units: 100 and n/p/c/r/e/b records with and without positions; devices and the length, width and value properties."
provenance = "hefesto"

[reference]
script = "input/run.tcl"

[hefesto]
args = ["--no-log", "{input}/run.tcl"]
requires_commands = ["lvs"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ['regex:compiled on [^\n]*']

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = []

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
