schema = 1
id = "NG-SET-03"
area = "LVS"
capability = "lvs-setup-file"
requirements = ["Cell reference syntax"]
tool = "netgen"
description = "Every cell-reference form with property: -circuit1 x, {x 0}, {0 x}, {file x}, {* x}, -current and the bad forms; effects through the property query and the error texts."
