schema = 1
id = "NG-SET-13"
area = "LVS"
capability = "lvs-setup-file"
requirements = ["Query and output commands available to setup files"]
tool = "netgen"
description = "format 30, format 50 30, format 0 and format; the returned widths and the comp.out line widths."
provenance = "hefesto"

[reference]
script = "input/run.tcl"

[hefesto]
args = ["--no-log", "{input}/run.tcl"]
requires_commands = ["lvs"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ['regex:compiled on [^\n]*']

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = []

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []

[[outputs]]
name = "comp.out"
source = "comp.out"
comparator = "lvs-canonical"
masks = []
