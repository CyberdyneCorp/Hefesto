# (golden-capture.yml). Generated by tools/golden/authoring/lvs_cases.py.

schema = 1
id = "NG-REP-05"
area = "LVS"
capability = "lvs-reports"
requirements = ["Log and console routing"]
tool = "netgen"
description = "log file x.log; log start; log put hello; log echo off; log end; and the error cases; the file contents and messages."
provenance = "hefesto"

[reference]
script = "input/run.tcl"

[hefesto]
args = ["--no-log", "{input}/run.tcl"]
requires_commands = ["lvs"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "bytes"
masks = ['regex:compiled on [^\n]*']

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "bytes"
masks = []

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []
