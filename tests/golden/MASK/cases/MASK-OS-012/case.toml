#
# MASK-OS-012 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): a cif see before the write (Q-MASK-412: Magic's net operator needs it).
# cif see before the write: Magic crashes on the net operator in a fresh session (Q-MASK-412).

schema = 1
id = "MASK-OS-012"
area = "MASK"
capability = "mask-output-styles"
requirements = ["Operator statement arguments"]
tool = "magic"
description = "Every operator with a valid and an invalid argument count: tech errors and the ops kept."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "out.gds"
source = "out.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
