#
# MASK-OP-034 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 2 writes in one session, compared side by side: gds write a; gds write b.

schema = 1
id = "MASK-OP-034"
area = "MASK"
capability = "mask-output-operators"
requirements = ["bridge-lim"]
tool = "magic"
description = "2-wide and 2-high wires with solid neighbours: bridge-lim 4 6 L with and without a limiting tile."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "a.gds"
source = "a.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "b.gds"
source = "b.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
