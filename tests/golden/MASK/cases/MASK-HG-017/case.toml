#
# MASK-HG-017 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 4 writes in one session, compared side by side: gds write off; cif write off; gds write prop; cif write prop.

schema = 1
id = "MASK-HG-017"
area = "MASK"
capability = "mask-hierarchical-generation"
requirements = ["Hierarchy and array output switches"]
tool = "magic"
description = "MASK-HG-006 with cif *hier write disable, then a CIFhier property on the parent: GDS and CIF."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "off.gds"
source = "off.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "off.cif"
source = "off.cif"
comparator = "bytes"
masks = ["cif-preamble"]

[[outputs]]
name = "prop.gds"
source = "prop.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "prop.cif"
source = "prop.cif"
comparator = "bytes"
masks = ["cif-preamble"]
