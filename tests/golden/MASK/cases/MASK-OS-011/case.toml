#
# MASK-OS-011 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# scalefactor 10 without nanometers: set-minimum-grid sets lambda to 1/(10/5); with a style that reduces to scale 1 Magic divides by 1/5 = 0 (SIGFPE on x86, Q-MASK-16).

schema = 1
id = "MASK-OS-011"
area = "MASK"
capability = "mask-output-styles"
requirements = ["min-width, render and options statements"]
tool = "magic"
description = "options with each flag and an unknown word; set-minimum-grid with gridlimit: lambda after load."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "out.gds"
source = "out.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
