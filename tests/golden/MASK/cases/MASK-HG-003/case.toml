#
# MASK-HG-003 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 2 writes in one session, compared side by side: gds write out; cif write out.

schema = 1
id = "MASK-HG-003"
area = "MASK"
capability = "mask-hierarchical-generation"
requirements = ["Own-paint generation area"]
tool = "magic"
description = "Cell bbox (0,0)-(10,10) with FIXED_BBOX -20 -20 30 30 and a bbox layer: GDS and CIF."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "out.gds"
source = "out.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "out.cif"
source = "out.cif"
comparator = "bytes"
masks = ["cif-preamble"]
