#
# MASK-GW-003 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): Q-MASK-201: a write in an angstrom style, then one in a nanometer style.
# Q-MASK-201: a fix deviation is expected.

schema = 1
id = "MASK-GW-003"
area = "MASK"
capability = "gds-write"
requirements = ["Library header and trailer"]
tool = "magic"
description = "A write in an angstrom style, then a nanometer style write: UNITS of the second file."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "first.gds"
source = "first.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "second.gds"
source = "second.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
