#
# MASK-GW-036 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): four writes with different compress levels.

schema = 1
id = "MASK-GW-036"
area = "MASK"
capability = "gds-write"
requirements = ["Compressed output", "Write command and output file naming"]
tool = "magic"
description = "gds compress 0, 6, 9 and 12: file names and the decompressed equality."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "c0.gds"
source = "c0.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "c6.gds.gz"
source = "c6.gds.gz"
comparator = "gzip"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "c9.gds.gz"
source = "c9.gds.gz"
comparator = "gzip"
masks = ["gds-mod-dates"]
display = "gds-records"
