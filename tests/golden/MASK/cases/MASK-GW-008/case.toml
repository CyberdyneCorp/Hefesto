#
# MASK-GW-008 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 4 writes in one session, compared side by side: gds write fixed; gds write zero; gds write nostamp; gds write default.
# datestamp yes uses the cell's stamp; TZ=America/New_York is a unit test of the converter (design D12), the capture image runs TZ=UTC.

schema = 1
id = "MASK-GW-008"
area = "MASK"
capability = "gds-write"
requirements = ["Date records"]
tool = "magic"
description = "gds datestamp 1700000000, yes, no and nodatestamp yes, a cell stamped 1600000000; TZ UTC and New York."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "fixed.gds"
source = "fixed.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "zero.gds"
source = "zero.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "nostamp.gds"
source = "nostamp.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "default.gds"
source = "default.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
