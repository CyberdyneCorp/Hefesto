#
# MASK-UO-007 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/use_order_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Use-order probe (m5-mask-gds-cif task 1.5, design D7).

schema = 1
id = "MASK-UO-007"
area = "MASK"
capability = "gds-write"
requirements = ["Structure ordering"]
tool = "magic"
description = "A child's bounding box grows after the index is binned."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "trace.txt"
source = "trace.txt"
comparator = "bytes"
masks = []
