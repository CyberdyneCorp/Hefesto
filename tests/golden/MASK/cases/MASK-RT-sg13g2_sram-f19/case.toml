#
# MASK-RT-sg13g2_sram-f19 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK-RT case (m5-mask-gds-cif design D19): fresh session with the PDK's rc and random seed 1.
# out.gds is compared through its masked SHA-256 and decoded summary (goldenlib/derived.py).
# Label golden-gds-rt: captured by golden-capture.yml capture-gds-rt (scripts/gds_rt_shards.py), replayed by perf.yml gds-roundtrip.

schema = 1
id = "MASK-RT-sg13g2_sram-f19"
area = "MASK"
capability = "gds-write"
requirements = ["Library header and trailer", "Structure ordering", "Mask geometry for each structure", "Write option settings and defaults"]
tool = "magic"
description = "Library round trip of ihp-sg13g2 sg13g2_sram, GDS file 19 of 30 (sorted by name): gds read, a wrapper placing every top structure with its timestamp pinned to 0, gds library yes, gds write."
gds_rt = true

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
timeout_s = 5400

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "ihp-sg13g2", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/ihp-sg13g2/libs.tech/magic/ihp-sg13g2.magicrc", "input/commands.tcl"]
requires_commands = []
timeout_s = 5400

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "ihp-sg13g2"

[[external]]
source = "pdk"
set = "ihp"
path = "ihp-sg13g2/libs.tech/magic"
to = "pdk/ihp-sg13g2/libs.tech/magic"

[[external]]
source = "magic-sys"
path = "graphics/FreeSans.pt3"
to = "FreeSans.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeSerif.pt3"
to = "FreeSerif.pt3"

[[external]]
source = "magic-sys"
path = "graphics/FreeMono.pt3"
to = "FreeMono.pt3"

[[external]]
source = "pdk"
set = "ihp-gds"
path = "ihp-sg13g2/libs.ref/sg13g2_sram/gds"
to = "lib"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-crash-file", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-crash-file", "magic-tech-sections"]

[[outputs]]
name = "out.gds.sha256"
source = "derived:gds-digest:out.gds"
comparator = "bytes"
masks = []

[[outputs]]
name = "out.gds.summary.txt"
source = "derived:gds-summary:out.gds"
comparator = "bytes"
masks = []
