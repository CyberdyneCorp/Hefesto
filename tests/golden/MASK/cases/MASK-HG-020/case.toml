#
# MASK-HG-020 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): Q-MASK-412: two cells written in one session, the first write after startup.
# Q-MASK-412 (CASES.md): the net layer of the second write.

schema = 1
id = "MASK-HG-020"
area = "MASK"
capability = "mask-hierarchical-generation"
requirements = ["Per-cell output composition"]
tool = "magic"
description = "A style with the net operator: two cells written in one session, the first write after startup."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "a.gds"
source = "a.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "b.gds"
source = "b.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
