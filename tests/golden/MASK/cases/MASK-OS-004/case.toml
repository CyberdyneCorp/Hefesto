#
# MASK-OS-004 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 4 writes in one session, compared side by side: gds write out0; gds write out1; gds write out2; gds write out3.
# Four writes, one per style: each write's UNITS and XY show that style's scale.

schema = 1
id = "MASK-OS-004"
area = "MASK"
capability = "mask-output-styles"
requirements = ["scalefactor statement", "Unit normalisation"]
tool = "magic"
description = "scalefactor 1, 4.5, 10 nanometers and 2.5 angstroms: cif scale out and the GDS written."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "out0.gds"
source = "out0.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "out1.gds"
source = "out1.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "out2.gds"
source = "out2.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "out3.gds"
source = "out3.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
