#
# MASK-CF-021 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 2 writes in one session, compared side by side: cif write foo; cif write bar.cif.
# Q-MASK-320: cif write bar.cif writes bar.cif.cif.

schema = 1
id = "MASK-CF-021"
area = "MASK"
capability = "cif-format-io"
requirements = ["cif read, write and flat options"]
tool = "magic"
description = "cif read foo, cif write foo and cif write foo.cif: the files opened."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "foo.cif"
source = "foo.cif"
comparator = "bytes"
masks = ["cif-preamble"]

[[outputs]]
name = "bar.cif.cif"
source = "bar.cif.cif"
comparator = "bytes"
masks = ["cif-preamble"]
