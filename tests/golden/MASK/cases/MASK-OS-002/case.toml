#
# MASK-OS-002 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.

schema = 1
id = "MASK-OS-002"
area = "MASK"
capability = "mask-output-styles"
requirements = ["Style loading and variant-conditional statements"]
tool = "magic"
description = "Variant blocks: layers generated by each variant of style b, through cif see."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "fb_bx_cmf.txt"
source = "fb_bx_cmf.txt"
comparator = "polygon-set"
masks = []

[[outputs]]
name = "fb_bx_cms.txt"
source = "fb_bx_cms.txt"
comparator = "polygon-set"
masks = []

[[outputs]]
name = "fb_by_cmf.txt"
source = "fb_by_cmf.txt"
comparator = "polygon-set"
masks = []

[[outputs]]
name = "fb_by_cms.txt"
source = "fb_by_cms.txt"
comparator = "polygon-set"
masks = []
