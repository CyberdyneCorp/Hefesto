#
# MASK-GW-032 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 3 writes in one session, compared side by side: gds write out; gds write noprefix; gds write out.
# Q-MASK-211, Q-MASK-214; a .mag abstract cell instead of lef read (design D18).

schema = 1
id = "MASK-GW-032"
area = "MASK"
capability = "gds-write"
requirements = ["Full dump of a vendor library"]
tool = "magic"
description = "A .mag abstract cell with GDS_FILE + GDS_START (full dump); with LEFview no_prefix."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "out.gds"
source = "out.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "noprefix.gds"
source = "noprefix.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
