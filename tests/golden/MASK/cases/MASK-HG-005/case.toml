#
# MASK-HG-005 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# Q-MASK-400: the OFF rule is unit-tested; the case runs magic-compat ON.

schema = 1
id = "MASK-HG-005"
area = "MASK"
capability = "mask-hierarchical-generation"
requirements = ["Interaction area discovery"]
tool = "magic"
description = "Parent metal (104,40)-(130,60) beside a child (0,0)-(100,100) near the origin, and moved far away."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "fb_near.txt"
source = "fb_near.txt"
comparator = "polygon-set"
masks = []

[[outputs]]
name = "near.gds"
source = "near.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "fb_far.txt"
source = "fb_far.txt"
comparator = "polygon-set"
masks = []
