#
# MASK-OS-014 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 2 writes in one session, compared side by side: gds write ba; gds write nb.

schema = 1
id = "MASK-OS-014"
area = "MASK"
capability = "mask-output-styles"
requirements = ["Unit normalisation"]
tool = "magic"
description = "bloat-all present or not, scalefactor 10 nanometers: cuts of an odd-sized contact."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "ba.gds"
source = "ba.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "nb.gds"
source = "nb.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
