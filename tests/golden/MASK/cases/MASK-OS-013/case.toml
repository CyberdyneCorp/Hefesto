#
# MASK-OS-013 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 2 writes in one session, compared side by side: cif write sq; cif write gr.
# Two CIF writes, one per style (the reducer differs).

schema = 1
id = "MASK-OS-013"
area = "MASK"
capability = "mask-output-styles"
requirements = ["Unit normalisation", "CIF reducer"]
tool = "magic"
description = "scalefactor 9 with squares 12 44 44, and with only grow 30: the CIF DS scale and coordinates."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "sq.cif"
source = "sq.cif"
comparator = "bytes"
masks = ["cif-preamble"]

[[outputs]]
name = "gr.cif"
source = "gr.cif"
comparator = "bytes"
masks = ["cif-preamble"]
