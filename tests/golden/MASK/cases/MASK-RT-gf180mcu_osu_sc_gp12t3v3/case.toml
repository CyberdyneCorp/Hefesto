#
# MASK-RT-gf180mcu_osu_sc_gp12t3v3 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK-RT case (m5-mask-gds-cif design D19): fresh session with the PDK's rc and random seed 1.
# out.gds is compared through its masked SHA-256 and decoded summary (goldenlib/derived.py).
# Label golden-gds-rt: captured by golden-capture.yml capture-gds-rt (scripts/gds_rt_shards.py), replayed by perf.yml gds-roundtrip.

schema = 1
id = "MASK-RT-gf180mcu_osu_sc_gp12t3v3"
area = "MASK"
capability = "gds-write"
requirements = ["Library header and trailer", "Structure ordering", "Mask geometry for each structure", "Write option settings and defaults"]
tool = "magic"
description = "Library round trip of gf180mcuD gf180mcu_osu_sc_gp12t3v3, its GDS file: gds read, a wrapper placing every top structure with its timestamp pinned to 0, gds library yes, gds write."
gds_rt = true

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "gf180mcuD", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/gf180mcuD/libs.tech/magic/gf180mcuD.magicrc", "input/commands.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "gf180mcuD"

[[external]]
source = "pdk"
set = "gf180mcu"
path = "gf180mcuD/libs.tech/magic"
to = "pdk/gf180mcuD/libs.tech/magic"

[[external]]
source = "pdk"
set = "gf180mcu-gds"
path = "gf180mcuD/libs.ref/gf180mcu_osu_sc_gp12t3v3/gds"
to = "lib"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-crash-file", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-crash-file", "magic-tech-sections"]

[[outputs]]
name = "out.gds.sha256"
source = "derived:gds-digest:out.gds"
comparator = "bytes"
masks = []

[[outputs]]
name = "out.gds.summary.txt"
source = "derived:gds-summary:out.gds"
comparator = "bytes"
masks = []
