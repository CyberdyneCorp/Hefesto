#
# MASK-OP-033 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 3 writes in one session, compared side by side: gds write e; gds write l1; gds write l2.

schema = 1
id = "MASK-OP-033"
area = "MASK"
capability = "mask-output-operators"
requirements = ["bridge-lim"]
tool = "magic"
description = "Catecorner squares, bridge-lim 5 4 L with L empty, L = [13,30]x[0,8], and L plus [6,14]x[15,30]."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "e.gds"
source = "e.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "l1.gds"
source = "l1.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"

[[outputs]]
name = "l2.gds"
source = "l2.gds"
comparator = "bytes"
masks = ["gds-mod-dates"]
display = "gds-records"
