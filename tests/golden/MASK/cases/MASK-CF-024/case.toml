#
# MASK-CF-024 (MASK/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m5_cases.py.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# MASK case (m5-mask-gds-cif design D18): fresh session, drc off, gds datestamp 0.
# History case (design D18): 2 writes in one session, compared side by side: cif write pre; cif write nopre.

schema = 1
id = "MASK-CF-024"
area = "MASK"
capability = "cif-format-io"
requirements = ["cif output-format toggles"]
tool = "magic"
description = "cif prefix /lib then a write; cif prefix cleared."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "completed-percent", "magic-tech-sections"]

[[outputs]]
name = "pre.cif"
source = "pre.cif"
comparator = "bytes"
masks = ["cif-preamble"]

[[outputs]]
name = "nopre.cif"
source = "nopre.cif"
comparator = "bytes"
masks = ["cif-preamble"]
