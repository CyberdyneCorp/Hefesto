#
# OASIS-037 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic reads <stem>.gds, the GDS equivalent of <stem>.oas (authoring/oasequiv.py); Hefesto reads <stem>.oas (input/hefesto.tcl). Saved cells and report.txt are compared; the console is not (two different commands, informative wording).
# Magic's GDS lookup has no .oasis step: its input in each directory is chip.gds (chip.gds.gz in d2), which Hefesto's OASIS lookup never tries, so the cell each lookup opens is compared.

schema = 1
id = "OASIS-037"
area = "OASIS"
capability = "oasis-read"
requirements = ["Read command and file lookup"]
tool = "magic"
description = "oasis read chip with chip.oas, chip.oas.gz, chip.oasis, an extensionless chip, and chip.oas beside chip.oasis: the file opened (its cell)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
