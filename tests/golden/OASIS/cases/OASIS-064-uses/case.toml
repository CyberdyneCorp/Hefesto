#
# OASIS-064-uses (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check of the round trip: the cells read back from Hefesto's OASIS file against those Magic reads back from its GDS file (cells already in memory follow the same gds-read rule in both).

schema = 1
id = "OASIS-064-uses"
area = "OASIS"
capability = "oasis-write"
requirements = ["GDS-consistent content"]
tool = "magic"
description = "Round trip of layout uses: oasis write then oasis read (Magic: gds write, gds read); the cells read back."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
