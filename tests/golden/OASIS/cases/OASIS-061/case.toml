#
# OASIS-061 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic writes out.oas with gds write (GDS bytes), Hefesto with oasis write (input/hefesto.tcl); compared with stream-geometry and stream-hierarchy. KLayout and gdstk check Hefesto's file in golden-capture.yml mode oasis-validate.
# Approved deviation (Q-OASIS-2, amended 2026-11-18; design D19): no commercial OASIS writer's or reader's files are available, so this case checks parity with gdstk- and KLayout-written files and readers only. Not a deviations.toml entry: the case passes.

schema = 1
id = "OASIS-061"
area = "OASIS"
capability = "oasis-write"
requirements = ["Strict and non-strict modes", "Reference numbers and name tables"]
tool = "magic"
description = "Strict-mode output (the default) of arrays and oriented uses with ids, read by KLayout with expect_strict_mode 1 and by gdstk (oasis-validate), and compared with Magic's GDS."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "out.oas"
source = "out.oas"
comparator = "stream-geometry"
masks = []

[[outputs]]
name = "out.oas.hierarchy.txt"
source = "out.oas"
comparator = "stream-hierarchy"
masks = []
