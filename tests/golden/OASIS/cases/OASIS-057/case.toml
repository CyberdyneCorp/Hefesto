#
# OASIS-057 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# hefesto-cli runs input/commands.tcl; the reference run copies input/spec/ (authoring/tclcase.py).
# Hefesto self-golden (design D19), tool oasis-spec: the expected bytes are the spec listing, assembled by authoring/oasgen.py into input/spec/ and checked by tests/test_oasis_cases.py.
# History case: two writes. KLayout reads them with expect_strict_mode 1 and 0 (oasis-validate).

schema = 1
id = "OASIS-057"
area = "OASIS"
capability = "oasis-write"
requirements = ["Strict and non-strict modes"]
tool = "oasis-spec"
description = "The reference cell written with strict yes and strict no: name tables and table offsets against inline names and START's zero offsets."

[reference]
script = "input/commands.tcl"
argv = ["cp", "-R", "input/spec/.", "."]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "strict.oas"
source = "strict.oas"
comparator = "bytes"
masks = []
display = "oasis-records"

[[outputs]]
name = "nonstrict.oas"
source = "nonstrict.oas"
comparator = "bytes"
masks = []
display = "oasis-records"
