#
# OASIS-030 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic reads <stem>.gds, the GDS equivalent of <stem>.oas (authoring/oasequiv.py); Hefesto reads <stem>.oas (input/hefesto.tcl). Saved cells and report.txt are compared; the console is not (two different commands, informative wording).
# KLayout's strm2gds of trap.oas is XORed with trap.gds (the equivalent Magic reads) and gdstk reads trap.oas, in oasis-validate.
# Approved deviation (Q-OASIS-2, amended 2026-11-18; design D19): no commercial OASIS writer's file is available, so the vertex tables are checked against the spec's (oasgen) file and the KLayout and gdstk readers only. Not a deviations.toml entry: the case passes.

schema = 1
id = "OASIS-030"
area = "OASIS"
capability = "oasis-format"
requirements = ["CTRAPEZOID record", "TRAPEZOID records"]
tool = "magic"
description = "One CTRAPEZOID of each type 0-25 (w = 40, h = 20 where used) and TRAPEZOIDs 23, 24 and 25, horizontal and vertical, with positive and negative deltas (Q-OASIS-4)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
