#
# OASIS-012 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic reads <stem>.gds, the GDS equivalent of <stem>.oas (authoring/oasequiv.py); Hefesto reads <stem>.oas (input/hefesto.tcl). Saved cells and report.txt are compared; the console is not (two different commands, informative wording).
# Approved deviation (Q-OASIS-2, amended 2026-11-18; design D19): no commercial OASIS writer's files are available, so the case reads gdstk-written files only. Not a deviations.toml entry: the case passes.
# Inputs captured by oasis-validate (tests/golden/OASIS/captured/OASIS-012/captured.json).

schema = 1
id = "OASIS-012"
area = "OASIS"
capability = "oasis-format"
requirements = ["Validation signature"]
tool = "magic"
description = "gdstk-written files with CRC32 and CHECKSUM32 signatures, and copies with one END padding byte changed: every file's cells are read (a bad signature is a warning only)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
