#
# OASIS-056 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic writes out.oas with gds write (GDS bytes), Hefesto with oasis write (input/hefesto.tcl); compared with stream-geometry and stream-hierarchy. KLayout and gdstk check Hefesto's file in golden-capture.yml mode oasis-validate.
# History case: two writes in two settings.

schema = 1
id = "OASIS-056"
area = "OASIS"
capability = "oasis-write"
requirements = ["CBLOCK compression", "Determinism"]
tool = "magic"
description = "The same layout written with compress 0 and compress 9: both give Magic's geometry; the CBLOCK bytes are compared across platforms by the replay (Q-OASIS-64)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "c0.oas"
source = "c0.oas"
comparator = "stream-geometry"
masks = []

[[outputs]]
name = "c0.oas.hierarchy.txt"
source = "c0.oas"
comparator = "stream-hierarchy"
masks = []

[[outputs]]
name = "c9.oas"
source = "c9.oas"
comparator = "stream-geometry"
masks = []

[[outputs]]
name = "c9.oas.hierarchy.txt"
source = "c9.oas"
comparator = "stream-hierarchy"
masks = []
