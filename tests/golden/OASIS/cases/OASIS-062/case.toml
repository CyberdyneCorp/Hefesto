#
# OASIS-062 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# hefesto-cli runs input/commands.tcl; the reference run copies input/spec/ (authoring/tclcase.py).
# Hefesto self-golden (design D19), tool oasis-spec: the expected bytes are the spec listing, assembled by authoring/oasgen.py into input/spec/ and checked by tests/test_oasis_cases.py.
# The expected file is the vendor file; stream-geometry and stream-hierarchy compare the re-encoded cells with it (KLayout's XOR against the source runs in oasis-validate).

schema = 1
id = "OASIS-062"
area = "OASIS"
capability = "oasis-write"
requirements = ["Read-only OASIS vendor cells"]
tool = "oasis-spec"
description = "A hierarchy using a read-only OASIS cell with a repeated CIRCLE, a CTRAPEZOID, a PATH, an XGEOMETRY, a RECTANGLE array and a PLACEMENT repetition, written with library yes: the re-encoded cells have the vendor file's geometry (Q-OASIS-40)."

[reference]
script = "input/commands.tcl"
argv = ["cp", "-R", "input/spec/.", "."]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "out.oas"
source = "out.oas"
comparator = "stream-geometry"
masks = []
display = "oasis-records"

[[outputs]]
name = "out.oas.hierarchy.txt"
source = "out.oas"
comparator = "stream-hierarchy"
masks = []
