#
# OASIS-059 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# hefesto-cli runs input/commands.tcl; the reference run copies input/spec/ (authoring/tclcase.py).
# Hefesto self-golden (design D19), tool oasis-spec: the expected bytes are the spec listing, assembled by authoring/oasgen.py into input/spec/ and checked by tests/test_oasis_cases.py.
# History case: three writes in three settings.

schema = 1
id = "OASIS-059"
area = "OASIS"
capability = "oasis-write"
requirements = ["Units", "Layer names"]
tool = "oasis-spec"
description = "The reference cell under a units-angstroms style (unit 10000), with layernames no, and in a style whose metal2 layer has no calma statement (skipped)."

[reference]
script = "input/commands.tcl"
argv = ["cp", "-R", "input/spec/.", "."]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "ang.oas"
source = "ang.oas"
comparator = "bytes"
masks = []
display = "oasis-records"

[[outputs]]
name = "nolayers.oas"
source = "nolayers.oas"
comparator = "bytes"
masks = []
display = "oasis-records"

[[outputs]]
name = "nocalma.oas"
source = "nocalma.oas"
comparator = "bytes"
masks = []
display = "oasis-records"
