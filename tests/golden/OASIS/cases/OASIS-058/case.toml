#
# OASIS-058 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# hefesto-cli runs input/commands.tcl; the reference run copies input/spec/ (authoring/tclcase.py).
# Hefesto self-golden (design D19), tool oasis-spec: the expected bytes are the spec listing, assembled by authoring/oasgen.py into input/spec/ and checked by tests/test_oasis_cases.py.
# History case: three writes. gdstk oas_validate checks each signature (oasis-validate).

schema = 1
id = "OASIS-058"
area = "OASIS"
capability = "oasis-write"
requirements = ["END record and validation"]
tool = "oasis-spec"
description = "The reference cell with validation none, crc32 and checksum: END bytes and signatures."

[reference]
script = "input/commands.tcl"
argv = ["cp", "-R", "input/spec/.", "."]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "none.oas"
source = "none.oas"
comparator = "bytes"
masks = []
display = "oasis-records"

[[outputs]]
name = "crc32.oas"
source = "crc32.oas"
comparator = "bytes"
masks = []
display = "oasis-records"

[[outputs]]
name = "checksum.oas"
source = "checksum.oas"
comparator = "bytes"
masks = []
display = "oasis-records"
