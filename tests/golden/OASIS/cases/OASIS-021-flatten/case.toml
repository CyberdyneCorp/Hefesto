#
# OASIS-021-flatten (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check on the sky130 standard-cell library: Magic reads KLayout's strm2gds of the OASIS file Hefesto reads (both captured by oasis-validate, task 15.2; KLayout is the independent converter, Q-OASIS-56). The saved cells are compared through their SHA-256 (the integer datestamp 1700000000 makes them stable). Approved deviation: Q-OASIS-56 (approved 2026-11-21): Magic reads KLayout's strm2gds of the strm2oas file, which writes the two coincident copies of a zero-displacement shape repetition once, while oasis-read reads one element per displacement (oasis-read 'Shape repetitions'); in 45 cells Hefesto saves a zero-area label beside the port label Magic saves, so cells.sha256 differs; report.txt matches.

schema = 1
id = "OASIS-021-flatten"
area = "OASIS"
capability = "oasis-read"
requirements = ["Post-order reading and flattening options", "Read option set"]
tool = "magic"
description = "The sky130 standard-cell library read with flatten (OASIS-020's inputs)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/commands.tcl"]
timeout_s = 1800

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--trust-pdk", "sky130A", "--magic", "-dnull", "-noconsole", "-rcfile", "input/pdk/sky130A/libs.tech/magic/sky130A.magicrc", "input/hefesto.tcl"]
requires_commands = []
timeout_s = 1800

[env]
PDK_ROOT = "{work}/input/pdk"
PDK = "sky130A"

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic"
to = "pdk/sky130A/libs.tech/magic"

[[external]]
source = "golden"
path = "OASIS/captured/OASIS-020/sky130_fd_sc_hd.oas"
to = "sky130_fd_sc_hd.oas"

[[external]]
source = "golden"
path = "OASIS/captured/OASIS-020/sky130_fd_sc_hd.gds.gz"
to = "sky130_fd_sc_hd.gds.gz"

[[outputs]]
name = "cells.sha256"
source = "derived:digest:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
