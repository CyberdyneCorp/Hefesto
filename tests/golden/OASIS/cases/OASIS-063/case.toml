#
# OASIS-063 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic's failed write leaves an incomplete GDS file and returns no Tcl error, so only the file's existence is compared; that Hefesto's file of the failed write is decodable with its END record is OASW's unit test (oasis-write "Write result and error propagation").

schema = 1
id = "OASIS-063"
area = "OASIS"
capability = "oasis-write"
requirements = ["Write result and error propagation"]
tool = "magic"
description = "A disallowed abstract cell (the write fails, a file is left) and an undefined subcell with undefined allow (the write succeeds and references it): the second file's cells and references."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []

[[outputs]]
name = "out2.oas"
source = "out2.oas"
comparator = "stream-hierarchy"
masks = []
