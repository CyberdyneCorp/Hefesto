#
# OASIS-032 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic reads <stem>.gds, the GDS equivalent of <stem>.oas (authoring/oasequiv.py); Hefesto reads <stem>.oas (input/hefesto.tcl). Saved cells and report.txt are compared; the console is not (two different commands, informative wording).
# The GDS_* and OASIS_* property lines are masked in the saved cells; report.txt holds the OASIS values the spec fixes.
# PDK_ROOT is set as a Tcl global from the environment: Magic and Hefesto substitute the Tcl variable only (Q-OASIS-48).

schema = 1
id = "OASIS-032"
area = "OASIS"
capability = "oasis-read"
requirements = ["Read-only OASIS vendor views"]
tool = "magic"
description = "oasis readonly yes on a library under PDK_ROOT (OASIS_FILE with $PDK_ROOT, OASIS_CELL, read-only, unmapped layer quiet); a unit-100 file refused in read-only mode."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[env]
PDK_ROOT = "{work}/input/pdk"

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp", 'regex:(?m)(?:^string (?:GDS_FILE|GDS_START|GDS_END|OASIS_FILE|OASIS_CELL) [^\n]*\n)+']

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = ['regex:(?m)(?:^string (?:GDS_FILE|GDS_START|GDS_END|OASIS_FILE|OASIS_CELL) [^\n]*\n)+']
