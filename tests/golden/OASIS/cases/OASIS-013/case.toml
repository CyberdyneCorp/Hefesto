#
# OASIS-013 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic reads <stem>.gds, the GDS equivalent of <stem>.oas (authoring/oasequiv.py); Hefesto reads <stem>.oas (input/hefesto.tcl). Saved cells and report.txt are compared; the console is not (two different commands, informative wording).
# The KLayout and gdstk checks of the file run in golden-capture.yml mode oasis-validate (design D20); their run ID and versions go in tasks.md and here.
# Confirmed (task 17.6): oasis-validate run 44987468409 (m6-round6, 46d90d0d), KLayout 0.30.0 and gdstk 1.0.2: KLayout reads reference_419.oas with no warning, strmcmp of ref419.oas against its KLayout-made GDS reports identical=True, gdstk reads it and accepts its signature (4001250259); 229 checks, 0 failures.

schema = 1
id = "OASIS-013"
area = "OASIS"
capability = "oasis-format"
requirements = ["Complete annotated example"]
tool = "magic"
description = "The 419-byte reference file of oasis-format: the decoded cell top. KLayout reads it without a warning and LayoutDiff finds no difference from its GDS equivalent (oasis-validate)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
