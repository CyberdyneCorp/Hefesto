#
# OASIS-034 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic reads <stem>.gds, the GDS equivalent of <stem>.oas (authoring/oasequiv.py); Hefesto reads <stem>.oas (input/hefesto.tcl). Saved cells and report.txt are compared; the console is not (two different commands, informative wording).
# Magic loads the GDS library-name cell into the window, so each GDS equivalent is named after the cell oasis-read selects (none for two unplaced cells).

schema = 1
id = "OASIS-034"
area = "OASIS"
capability = "oasis-read"
requirements = ["Top cell selection"]
tool = "magic"
description = "A file with S_TOP_CELL chip, one with a single unplaced cell, one with two: the cell loaded into the layout window (GUI run under Xvfb)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-d", "X11", "-noconsole", "-norc", "input/commands.tcl"]
display = "xvfb"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-d", "X11", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
