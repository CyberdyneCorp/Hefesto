#
# OASIS-054 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# hefesto-cli runs input/commands.tcl; the reference run copies input/spec/ (authoring/tclcase.py).
# Hefesto self-golden (design D19), tool oasis-spec: the expected bytes are the spec listing, assembled by authoring/oasgen.py into input/spec/ and checked by tests/test_oasis_cases.py.
# Placements are left out: their order follows Magic's use enumeration (Q-MASK-204); OASIS-051/052 compare them through stream-hierarchy.

schema = 1
id = "OASIS-054"
area = "OASIS"
capability = "oasis-write"
requirements = ["Modal field omission", "Shape repetition detection"]
tool = "oasis-spec"
description = "Equal 2x2 squares on metal1 (two rows) and metal2 (one column): repetition grouping and the fields modal omission leaves out (layer, datatype, width, height, x, y, repetition)."

[reference]
script = "input/commands.tcl"
argv = ["cp", "-R", "input/spec/.", "."]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "out.oas"
source = "out.oas"
comparator = "bytes"
masks = []
display = "oasis-records"
