#
# OASIS-090 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# The shared-syntax options are compared with Magic's gds command; the OASIS-only values are the spec's (spec lines of report.txt).

schema = 1
id = "OASIS-090"
area = "OASIS"
capability = "oasis-command"
requirements = ["Command name and forms", "Option syntax", "OASIS-only options"]
tool = "magic"
description = "oasis nodup t, oasis flatten 5 and their queries (as gds), oasis compress 12 and circlepoints 4 (refused, values kept), oasis write a b (nothing written) and a bare oasis (top.oas)."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
