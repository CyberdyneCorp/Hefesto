#
# OASIS-029 (OASIS/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m6_cases.py.
# Magic runs input/commands.tcl, hefesto-cli input/hefesto.tcl (authoring/tclcase.py).
# Magic GDS cross-check (design D19): Magic reads <stem>.gds, the GDS equivalent of <stem>.oas (authoring/oasequiv.py); Hefesto reads <stem>.oas (input/hefesto.tcl). Saved cells and report.txt are compared; the console is not (two different commands, informative wording).

schema = 1
id = "OASIS-029"
area = "OASIS"
capability = "oasis-read"
requirements = ["POLYGON, TRAPEZOID and CTRAPEZOID elements"]
tool = "magic"
description = "POLYGONs: an L-shape (type 1), an octagon (type 3), an arbitrary-angle triangle (type 4), a self-overlapping outline and a degenerate two-vertex polygon."

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/hefesto.tcl"]
requires_commands = []

[[outputs]]
name = "cells.txt"
source = "derived:files:*.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "report.txt"
source = "report.txt"
comparator = "bytes"
masks = []
