#
# TECH-G25 (TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.
# Table dump through paint/erase/save: authoring/paint_dump.py.

schema = 1
id = "TECH-G25"
area = "TECH"
capability = "tech-compose-and-connect"
requirements = ["Contact compose and decompose rules", "Finalization step 4, saved contact rules"]
tool = "magic"
description = "tiny.tech plus pdc and 'compose pdc pdiff m1': P/E dump of pdc, pdiff, metal1."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "paint_dump.mag"
source = "paint_dump.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "erase_dump.mag"
source = "erase_dump.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
