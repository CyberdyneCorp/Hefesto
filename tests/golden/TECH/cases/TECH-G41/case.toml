#
# TECH-G41 (tests/golden/TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml).

schema = 1
id = "TECH-G41"
area = "TECH"
capability = "tech-command"
requirements = ["Option parsing", "tech help"]
tool = "magic"
description = "tech, tech help, tech la, tech foo, tech name extra."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = ["tech"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
