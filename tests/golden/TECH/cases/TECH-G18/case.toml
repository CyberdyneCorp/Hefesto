schema = 1
id = "TECH-G18"
area = "TECH"
capability = "tech-contacts-and-stacking"
requirements = ["stackable statement", "Stacking eligibility", "Stacked type properties"]
tool = "magic"
description = "stackable with no arguments: stacked types saved in a .mag; pm12c lookup."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
