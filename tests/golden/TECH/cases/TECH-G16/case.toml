#
# TECH-G16 (tests/golden/TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml).

schema = 1
id = "TECH-G16"
area = "TECH"
capability = "tech-layers-and-planes"
requirements = ["Type aliases"]
tool = "magic"
description = "Aliases diff, poly (shadowing), allm1 twice and a types-section alias with '*'."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = ["tech"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
