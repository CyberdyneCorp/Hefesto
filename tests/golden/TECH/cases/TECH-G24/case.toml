#
# TECH-G24 (TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.
# Table dump through paint/erase/save: authoring/paint_dump.py.

schema = 1
id = "TECH-G24"
area = "TECH"
capability = "tech-compose-and-connect"
requirements = ["Finalization step 3a", "Finalization step 3c", "Default paint and erase rules"]
tool = "magic"
description = "sky130A.tech: P/E dump of intersecting-plane pairs (connect table not authored)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[external]]
source = "pdk"
path = "sky130A/libs.tech/magic/sky130A.tech"
to = "sky130A.tech"

[[outputs]]
name = "paint_dump.mag"
source = "paint_dump.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "erase_dump.mag"
source = "erase_dump.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
