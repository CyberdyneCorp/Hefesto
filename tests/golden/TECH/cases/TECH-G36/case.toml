#
# TECH-G36 (TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "TECH-G36"
area = "TECH"
capability = "tech-loading-and-scaling"
requirements = ["scalegrid command"]
tool = "magic"
description = "box 0 0 3 5 and a tile edge at x=-3; scalegrid 1 2; scalegrid 2 1; scalegrid 2/4, 1:3, 0 2."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a1.mag"
source = "a1.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]

[[outputs]]
name = "a2.mag"
source = "a2.mag"
comparator = "bytes"
masks = ["mag-timestamp", "mag-checkpaint"]
