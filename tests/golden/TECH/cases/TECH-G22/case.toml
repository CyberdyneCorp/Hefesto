#
# TECH-G22 (TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m1_cases.py.

schema = 1
id = "TECH-G22"
area = "TECH"
capability = "tech-compose-and-connect"
requirements = ["Finalization step 3a, painting over a contact", "Finalization step 3c, stacked types as applied types"]
tool = "magic"
description = "m2c over pc (a); pc,m2c on empty space (b); erase pc,m2c (c)."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "a.mag"
source = "a.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "b.mag"
source = "b.mag"
comparator = "bytes"
masks = ["mag-timestamp"]

[[outputs]]
name = "c.mag"
source = "c.mag"
comparator = "bytes"
masks = ["mag-timestamp"]
