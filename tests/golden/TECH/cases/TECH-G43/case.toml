#
# TECH-G43 (tests/golden/TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml).

schema = 1
id = "TECH-G43"
area = "TECH"
capability = "tech-command"
requirements = ["tech locked, unlocked and revert"]
tool = "magic"
description = "Lock listing, lock/unlock/revert."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = ["tech"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = []

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = []
