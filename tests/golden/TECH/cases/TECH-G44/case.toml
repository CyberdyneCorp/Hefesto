#
# TECH-G44 (TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/m3_cases.py.
# The scmos.tech line number in TechError's prefix depends on the preprocessor that
# generated the file, so it is masked (regex mask).

schema = 1
id = "TECH-G44"
area = "TECH"
capability = "tech-command"
requirements = ["tech drc"]
tool = "magic"
description = "scmos.tech; tech drc width/spacing/surround/directional queries, a bad type and no option."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[external]]
source = "scmos"
to = "scmos.tech"

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", 'regex:scmos.tech: line [0-9]+:', "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", 'regex:scmos.tech: line [0-9]+:', "magic-tech-sections"]
