#
# TECH-G32 (tests/golden/TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml).

schema = 1
id = "TECH-G32"
area = "TECH"
capability = "tech-loading-and-scaling"
requirements = ["Readability pre-check"]
tool = "magic"
description = "A tech file beginning with version."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = ["tech"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]
