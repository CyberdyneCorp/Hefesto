#
# TECH-G05 (tests/golden/TECH/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml).

schema = 1
id = "TECH-G05"
area = "TECH"
capability = "tech-file-format"
requirements = ["Section structure", "Section registry and prerequisites"]
tool = "magic"
description = "A stray `end` before planes."

[reference]
script = "input/commands.tcl"

[hefesto]
args = ["--no-log", "--diagnostics=magic", "{input}/commands.hef"]
requires_commands = ["tech"]

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = []

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = []
