#
# Parameter sweep of the native IHP sg13g2 generators (m4-scripting design
# D10, D-29), run by scripts/pcell_equivalence.py natively and through the
# PDK's Tcl generators. Every device is generated with its defaults, with each
# `values` entry (one parameter changed: the PDK bounds, out-of-bounds values
# that `_check` corrects, and interior values) and with each `combos` entry.
# Values stay numbers: other text runs the Tcl generator by design. The sg13g2
# fixed devices have no native generator yet (SCRIPT-PDK-14, Q-SCRIPT-45).

set = "ihp"
library = "sg13g2"
rcfile = "libs.tech/magic/ihp-sg13g2.magicrc"
trust = "ihp-sg13g2"

[[group]]
name = "mosfet"
devices = [
  "sg13_lv_nmos", "sg13_lv_pmos", "sg13_hv_nmos", "sg13_hv_pmos",
  "sg13_lv_rfnmos", "sg13_lv_rfpmos", "sg13_hv_rfnmos", "sg13_hv_rfpmos",
]
values.w = ["0.1", "0.15", "0.3", "0.58", "1.0", "2.5", "7.0"]
values.l = ["0.1", "0.13", "0.3", "0.42", "0.45", "1.0", "4.0"]
values.ng = ["0", "2", "3", "6"]
values.m = ["0", "2", "4"]
values.ccols = ["2", "3"]
values.diffcov = ["10", "20", "55", "100", "150"]
values.polycov = ["10", "20", "60", "150"]
values.guard = ["0", "1"]
values.gate_ring = ["0", "1"]
values.conn_gates = ["0", "1"]
values.glc = ["0"]
values.grc = ["0"]
values.gtc = ["0"]
values.gbc = ["0"]
values.tbcov = ["0", "40"]
values.rlcov = ["0", "60"]
values.topc = ["0"]
values.botc = ["0"]
values.poverlap = ["1"]
values.doverlap = ["0"]
values.full_metal = ["0"]
values.viasrc = ["0", "50", "+50", "-50", "150"]
values.viadrn = ["0", "+40", "-40"]
values.viagate = ["0", "+70", "-70", "30"]
values.viagb = ["50", "+50", "-50", "100"]
values.viagt = ["100", "+30"]
values.viagr = ["60", "-60"]
values.viagl = ["100", "+80"]
values.doports = ["0"]
values.gshield = ["1"]
combos = [
  "ng 2 m 2", "ng 3 m 3", "ng 4 m 2 poverlap 1", "ng 2 m 3 doverlap 0", "ng 3 conn_gates 1",
  "ng 2 m 2 topc 0", "ng 2 m 2 botc 0", "w 0.15 ng 2", "w 0.15 topc 0", "w 0.15 l 0.13 ng 3 m 2",
  "ng 2 m 2 doports 0", "ng 3 m 2 poverlap 1 doverlap 0", "ng 2 m 2 guard 1", "w 2.0 l 0.5 ng 5 m 4",
  "ng 2 diffcov 50 polycov 50", "ng 2 m 2 viasrc 0 viadrn 0 viagate 0", "m 3 poverlap 1 topc 0",
  "ng 4 conn_gates 1 viagate 50", "ng 1.5", "m 2.5", "w 15 l 0.5", "w 0.5 l 9 ng 4",
  "ng 2 gate_ring 1 guard 1 ccols 2 w 2.0", "ng 3 gate_ring 1 conn_gates 0", "w 0.6 l 0.3 viagate 100 ng 2",
  "w 0.1 l 0.3 ng 2 gate_ring 1",
]
