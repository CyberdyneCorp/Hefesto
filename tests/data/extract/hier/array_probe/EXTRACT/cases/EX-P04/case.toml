#
# EX-P04 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/extract_cases.py --array-probe.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Capture-only (outside tests/golden, so replay.py never runs it); the Hefesto side is tests/unit/extract/hier/captured_test.cpp.
# Capture: gh workflow run golden-capture.yml -f mode=capture -f cases=tests/data/extract/hier/array_probe/EXTRACT/cases/EX-P04

schema = 1
id = "EX-P04"
area = "EXTRACT"
capability = "extract-hierarchy"
requirements = ["Array interactions"]
tool = "magic"
description = "EX-053's arrays and EX-047's array x with parent-coordinate and child-coordinate use boxes (task 8.5 follow-up probe): the array merges"

[reference]
script = "input/commands.tcl"
argv = ["magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
