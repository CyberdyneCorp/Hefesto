#
# EX-P03 (EXTRACT/CASES.md). Inputs only: expected/ is written by
# capture.py in CI (golden-capture.yml). Generated by tools/golden/authoring/extract_cases.py --probe.
# Magic and hefesto-cli both run input/commands.tcl (authoring/tclcase.py).
# Capture-only (outside tests/golden, so replay.py never runs it); the Hefesto side is tests/unit/extract/device/abut_probe_test.cpp.
# Capture: gh workflow run golden-capture.yml -f mode=capture -f cases=tests/data/extract/device/abut_probe/EXTRACT/cases/EX-P03

schema = 1
id = "EX-P03"
area = "EXTRACT"
capability = "extract-devices"
requirements = ["Device record selection", "Device regions"]
tool = "magic"
description = "an nfet and a pfet touching in one device region (Round-3 follow-up probe): records, terminals and whether the ID-layer walk ends"

[reference]
script = "input/commands.tcl"
argv = ["timeout", "-s", "KILL", "120", "magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
allow_nonzero_exit = true
timeout_s = 300

[hefesto]
args = ["--no-log", "--diagnostics=magic", "--magic", "-dnull", "-noconsole", "-norc", "input/commands.tcl"]
requires_commands = []
timeout_s = 300

[[outputs]]
name = "stdout.txt"
source = "stdout"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "stderr.txt"
source = "stderr"
comparator = "magic-console"
masks = ["magic-stamp-note", "magic-tech-sections"]

[[outputs]]
name = "exitcode.txt"
source = "exitcode"
comparator = "bytes"
masks = []

[[collect]]
pattern = "*.ext"
comparator = "ext-cap"
masks = ["ext-timestamp"]
