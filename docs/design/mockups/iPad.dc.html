<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hefesto on iPad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A3D}a:hover{color:#FFA866}
</style>
</helmet>
<div style="width: 1366px; height: 1024px; box-sizing: border-box; padding: 18px; background: #0A0B0D; font-family: Inter, system-ui, sans-serif; color: #E8EAED">
<div style="width: 100%; height: 100%; border-radius: 22px; overflow: hidden; display: flex; background: #121418; border: 1px solid #2A2F37">

  <aside aria-label="Sidebar" style="width: 300px; flex-shrink: 0; background: #181B20; border-right: 1px solid #2F343D; display: flex; flex-direction: column">
    <div style="padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 22px; font-weight: 700">inverter_demo</span>
      <span style="font-size: 13px; color: #A4ABB6">sky130A · synced with iCloud</span>
    </div>
    <div role="tablist" aria-label="Sidebar section" style="margin: 0 18px 12px; display: flex; padding: 3px; border-radius: 10px; background: #0F1114; border: 1px solid #2F343D">
      <button type="button" role="tab" aria-selected="true" style="flex-grow: 1; height: 38px; border-radius: 8px; border: none; background: #2A2F37; color: #E8EAED; font: 600 14px Inter, sans-serif">Layers</button>
      <button type="button" role="tab" aria-selected="false" style="flex-grow: 1; height: 38px; border-radius: 8px; border: none; background: transparent; color: #A4ABB6; font: 500 14px Inter, sans-serif">Cells</button>
      <button type="button" role="tab" aria-selected="false" style="flex-grow: 1; height: 38px; border-radius: 8px; border: none; background: transparent; color: #A4ABB6; font: 500 14px Inter, sans-serif">Checks</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0 10px; display: flex; flex-direction: column; gap: 2px; font-size: 15px">
      <li style="height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-radius: 10px"><span style="width: 24px; height: 18px; border-radius: 4px; background: rgba(59,178,115,0.55); border: 1px solid #3BB273"></span><span style="flex-grow: 1">diff</span></li>
      <li style="height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-radius: 10px"><span style="width: 24px; height: 18px; border-radius: 4px; background: rgba(224,82,79,0.55); border: 1px solid #E0524F"></span><span style="flex-grow: 1">poly</span></li>
      <li style="height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-radius: 10px; background: #2A2F37; outline: 1.5px solid rgba(255,138,61,0.6)"><span style="width: 24px; height: 18px; border-radius: 4px; background: rgba(155,107,214,0.5); border: 1px solid #9B6BD6"></span><span style="flex-grow: 1; font-weight: 600">locali</span><span style="font-size: 12px; color: #FFB27A">paint</span></li>
      <li style="height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-radius: 10px"><span style="width: 24px; height: 18px; border-radius: 4px; background: rgba(79,141,232,0.45); border: 1px solid #4F8DE8"></span><span style="flex-grow: 1">metal1</span></li>
      <li style="height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-radius: 10px"><span style="width: 24px; height: 18px; border-radius: 4px; background: rgba(208,95,182,0.45); border: 1px solid #D05FB6"></span><span style="flex-grow: 1">metal2</span></li>
    </ul>
    <div style="margin: auto 18px 18px; padding: 14px; border-radius: 12px; background: #20242B; border: 1px solid #2F343D; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
      <span style="display: flex; justify-content: space-between"><span>DRC</span><span style="color: #5FD3A0">● clean</span></span>
      <span style="display: flex; justify-content: space-between"><span>LVS</span><span style="color: #5FD3A0">● match</span></span>
      <span style="display: flex; justify-content: space-between"><span>Sign-off</span><span style="color: #5FD3A0">● ready (sky130)</span></span>
    </div>
  </aside>

  <main aria-label="Layout canvas" style="flex-grow: 1; min-width: 0; position: relative; background: #0B0C0E">
    <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px">
      <button type="button" aria-label="Toggle sidebar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3D434E; background: rgba(32,36,43,0.92); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8EAED" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
      <div role="tablist" aria-label="Editor view" style="display: flex; padding: 3px; border-radius: 12px; background: rgba(32,36,43,0.92); border: 1px solid #3D434E">
        <button type="button" role="tab" aria-selected="true" style="height: 38px; padding: 0 16px; border-radius: 9px; border: none; background: #3D434E; color: #E8EAED; font: 600 14px Inter, sans-serif">Layout</button>
        <button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 16px; border-radius: 9px; border: none; background: transparent; color: #A4ABB6; font: 500 14px Inter, sans-serif">Schematic</button>
        <button type="button" role="tab" aria-selected="false" style="height: 38px; padding: 0 16px; border-radius: 9px; border: none; background: transparent; color: #A4ABB6; font: 500 14px Inter, sans-serif">3D</button>
      </div>
      <div style="flex-grow: 1"></div>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #3D434E; background: rgba(32,36,43,0.92); color: #E8EAED; font: 500 15px Inter, sans-serif">Simulate</button>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #FF8A3D; color: #1A0F06; font: 600 15px Inter, sans-serif">Ask agent</button>
    </div>

    <svg width="1028" height="986" viewBox="0 0 1028 986" role="img" aria-label="Inverter layout on iPad with a finger dragging the box and a long-press menu open">
      <defs>
        <pattern id="gi" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#262A31"></circle></pattern>
      </defs>
      <rect width="1028" height="986" fill="url(#gi)"></rect>
      <rect x="300" y="170" width="420" height="380" fill="rgba(46,125,87,0.10)" stroke="#2E7D57" stroke-dasharray="7 5"></rect>
      <rect x="350" y="300" width="300" height="190" fill="rgba(59,178,115,0.32)" stroke="#3BB273"></rect>
      <rect x="350" y="600" width="300" height="150" fill="rgba(59,178,115,0.32)" stroke="#3BB273"></rect>
      <rect x="484" y="260" width="34" height="520" fill="rgba(224,82,79,0.45)" stroke="#E0524F"></rect>
      <rect x="320" y="190" width="380" height="54" fill="rgba(79,141,232,0.40)" stroke="#4F8DE8"></rect>
      <rect x="320" y="800" width="380" height="54" fill="rgba(79,141,232,0.40)" stroke="#4F8DE8"></rect>
      <rect x="374" y="240" width="48" height="200" fill="rgba(155,107,214,0.45)" stroke="#9B6BD6"></rect>
      <rect x="574" y="320" width="48" height="400" fill="rgba(155,107,214,0.45)" stroke="#9B6BD6"></rect>
      <rect x="560" y="300" width="160" height="120" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"></rect>
      <circle cx="720" cy="420" r="26" fill="rgba(255,255,255,0.12)" stroke="#FFFFFF" stroke-width="1.5"></circle>
      <circle cx="720" cy="420" r="6" fill="#FFFFFF"></circle>
      <g font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#FFFFFF">
        <text x="330" y="223">VPWR</text><text x="330" y="833">VGND</text><text x="634" y="560">Y</text>
      </g>
      <rect x="744" y="404" width="206" height="74" rx="12" fill="#20242B" stroke="#3D434E"></rect>
      <text x="760" y="434" font-family="JetBrains Mono, monospace" font-size="13" fill="#E8EAED">box 1.60 × 1.20 um</text>
      <text x="760" y="458" font-family="Inter, sans-serif" font-size="12" fill="#A4ABB6">Drag to resize · lift to place</text>
    </svg>

    <div role="menu" aria-label="Box actions" style="position: absolute; left: 640px; top: 520px; width: 230px; border-radius: 14px; background: #20242B; border: 1px solid #3D434E; box-shadow: 0 12px 32px rgba(0,0,0,0.55); padding: 6px; display: flex; flex-direction: column">
      <button type="button" role="menuitem" style="height: 44px; text-align: left; padding: 0 14px; border-radius: 10px; border: none; background: #2A2F37; color: #E8EAED; font: 500 15px Inter, sans-serif">Paint locali</button>
      <button type="button" role="menuitem" style="height: 44px; text-align: left; padding: 0 14px; border-radius: 10px; border: none; background: transparent; color: #E8EAED; font: 400 15px Inter, sans-serif">Erase</button>
      <button type="button" role="menuitem" style="height: 44px; text-align: left; padding: 0 14px; border-radius: 10px; border: none; background: transparent; color: #E8EAED; font: 400 15px Inter, sans-serif">Select chunk</button>
      <button type="button" role="menuitem" style="height: 44px; text-align: left; padding: 0 14px; border-radius: 10px; border: none; background: transparent; color: #E8EAED; font: 400 15px Inter, sans-serif">Place device…</button>
    </div>

    <div role="toolbar" aria-label="Tools" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; border-radius: 18px; background: rgba(32,36,43,0.95); border: 1px solid #3D434E; box-shadow: 0 12px 32px rgba(0,0,0,0.5)">
      <button type="button" aria-label="Box tool" aria-pressed="true" style="width: 52px; height: 52px; border-radius: 12px; border: 1px solid rgba(255,138,61,0.6); background: rgba(255,138,61,0.16); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB27A" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"></rect></svg></button>
      <button type="button" aria-label="Select" style="width: 52px; height: 52px; border-radius: 12px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EAED" stroke-width="1.6" aria-hidden="true"><path d="M5 5l6 14 2-6 6-2z"></path></svg></button>
      <button type="button" aria-label="Paint" style="width: 52px; height: 52px; border-radius: 12px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EAED" stroke-width="1.6" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></button>
      <button type="button" aria-label="Wire" style="width: 52px; height: 52px; border-radius: 12px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EAED" stroke-width="1.6" aria-hidden="true"><path d="M4 18h6v-6h6V6"></path><circle cx="16" cy="6" r="2"></circle></svg></button>
      <span style="width: 1px; margin: 8px 4px; background: #3D434E"></span>
      <button type="button" aria-label="Undo" style="width: 52px; height: 52px; border-radius: 12px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EAED" stroke-width="1.6" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg></button>
      <button type="button" aria-label="Command bar" style="width: 52px; height: 52px; border-radius: 12px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; font: 600 18px 'JetBrains Mono', monospace; color: #E8EAED">%</button>
    </div>

    <button type="button" aria-label="Modifier: next touch acts as middle button" style="position: absolute; right: 24px; bottom: 120px; width: 64px; height: 64px; border-radius: 32px; border: 1px solid #3D434E; background: rgba(32,36,43,0.95); color: #E8EAED; font: 600 13px Inter, sans-serif; box-shadow: 0 12px 32px rgba(0,0,0,0.5)">Mid</button>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":1024}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
