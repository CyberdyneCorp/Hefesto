schema: spec-driven

context: |
  Hefesto is a VLSI layout editor written in C++20 targeting Linux, macOS and
  iPadOS. It is data-compatible with Magic VLSI (reference: RTimothyEdwards/magic
  @ fc5daa9e, v8.3.694): it reads/writes Magic technology files and .mag cells and
  reproduces Magic's DRC, mask generation, extraction and netlist outputs, so that
  existing open PDKs (sky130, gf180mcu, IHP sg13g2) work unchanged.
  Specs follow docs/spec-conventions.md: every requirement declares a
  compatibility class (exact | behavioral | informative), is implementation
  independent, and ends with a (Magic ref: file:line) trace. Suspected Magic bugs
  and platform decisions are logged in docs/decisions/open-questions/.

