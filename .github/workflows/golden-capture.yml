# Copyright 2026 The Hefesto Authors
#
# Builds the pinned reference-tool image (tools/golden/container/Containerfile)
# and runs the golden cases through Magic and the other reference tools.
# Capability hefesto-testing-strategy, requirement "Golden compatibility suite";
# design.md D8 (m0-foundations) and D8 (m1-core-viewer).
#
# Two steps, each on its own set of cases:
#   verify   cases WITH expected/provenance.json: a fresh capture must match the
#            committed expected/ (compare-only, writes nothing in the checkout).
#   capture  cases WITHOUT expected/: the reference outputs are captured and
#            uploaded as the artifact "golden-expected" (tests/golden/... paths),
#            to be reviewed and committed. Nothing is pushed by this workflow.
#
# When each step runs:
#   pull_request    both: verify the captured cases, capture the new ones (a PR that
#                   adds or edits a case.toml or its input/ gets its outputs as an artifact).
#   schedule        verify only.
#   workflow_dispatch  input `mode`: verify, capture or both (default both); input
#                   `cases` limits either step to the given case directories. Mode
#                   d19-timing runs only the d19-magic-timing job below.
#
# The MASK-RT-* library round trips (openspec/changes/m5-mask-gds-cif design D19) need the
# large library GDS data sets and Magic's time on big libraries, so they never run in the
# 120-minute `capture` job: `plan` splits the cases, and `capture-gds-rt` verifies and
# captures them in shards (scripts/gds_rt_shards.py: one per PDK, the I/O and SRAM
# libraries in shards of their own, each with its own timeout). On pull_request a MASK-RT case runs only
# when the PR changes its own directory or a file every shard depends on (SHARED_INPUTS in
# scripts/gds_rt_shards.py); the schedule and dispatches verify the whole corpus.

name: Golden capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify (captured cases), capture (cases without expected/), both, or d19-timing (m5 task 1.1 Magic timing only)"
        type: choice
        options: [both, verify, capture, d19-timing]
        default: both
      cases:
        description: "Space-separated case directories (e.g. tests/golden/TECH/cases/TECH-G01); empty = all"
        type: string
        default: ""
  pull_request:
    paths:
      - tools/golden/container/**
      - tools/golden/harness/**
      - tools/golden/pins.toml
      - tools/golden/capture.py
      - tools/golden/goldenlib/**
      - tests/golden/**/case.toml
      - tests/golden/**/input/**
      - scripts/fetch_pdk.py  # a PDK pin change alters the [[external]] pdk inputs
      - scripts/gds_rt_shards.py
      - .github/workflows/golden-capture.yml
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && 'verify' || 'both') }}
  CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || '' }}

jobs:
  # Splits the selected cases: the MASK-RT-* round trips go to capture-gds-rt (a matrix of the shards
  # that have cases), every other case to capture.
  plan:
    name: plan the capture jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      regular: ${{ steps.plan.outputs.regular }}
      rt_any: ${{ steps.plan.outputs.rt_any }}
      rt_matrix: ${{ steps.plan.outputs.rt_matrix }}
      rt_cases: ${{ steps.plan.outputs.rt_cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # on pull_request HEAD is the merge commit and HEAD^1 the base tip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split the cases
        id: plan
        shell: bash
        run: |
          if [ "$MODE" = "d19-timing" ]; then
            { echo "regular=0"; echo "rt_any=false"; echo 'rt_matrix={"include":[]}'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CASES" ]; then
            read -ra cases <<< "$CASES"
          else
            mapfile -t cases < <(find tests/golden -path '*/cases/*/case.toml' -exec dirname {} \; | sort)
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # The MASK-RT corpus costs about 110 minutes of Magic: a PR verifies a MASK-RT case only when
            # it changes that case or a shared input (SHARED_INPUTS in scripts/gds_rt_shards.py).
            git diff --name-only HEAD^1 HEAD > changed.txt
            mapfile -t cases < <(python3 scripts/gds_rt_shards.py --pr-changed changed.txt "${cases[@]}")
          fi
          if [ "${#cases[@]}" -eq 0 ]; then  # gds_rt_shards.py would read an empty list as "every case"
            { echo "regular=0"; echo "rt_any=false"; echo 'rt_matrix={"include":[]}'; echo "rt_cases="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          regular=0
          for case_dir in "${cases[@]}"; do
            case "$(basename "$case_dir")" in MASK-RT-*) ;; *) regular=$((regular + 1)) ;; esac
          done
          matrix="$(python3 scripts/gds_rt_shards.py --matrix "${cases[@]}")"
          rt_cases="$(python3 scripts/gds_rt_shards.py --is-rt "${cases[@]}" | tr '\n' ' ')"
          rt_any=false
          [ "$(jq '.include | length' <<< "$matrix")" -gt 0 ] && rt_any=true
          {
            echo "regular=$regular"; echo "rt_any=$rt_any"; echo "rt_matrix=$matrix"; echo "rt_cases=$rt_cases"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$regular case(s) for capture; MASK-RT shards: $(jq -c '[.include[].shard]' <<< "$matrix")"

  capture:
    name: build reference image, verify and capture
    needs: plan
    if: needs.plan.outputs.regular != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List cases
        shell: bash
        run: |
          if [ -n "$CASES" ]; then
            read -ra requested <<< "$CASES"
            printf '%s\n' "${requested[@]}" > all-cases.txt
          else
            find tests/golden -path '*/cases/*/case.toml' -exec dirname {} \; | sort > all-cases.txt
          fi
          # The MASK-RT-* round trips run in capture-gds-rt (m5-mask-gds-cif design D19).
          grep -v -E '(^|/)MASK-RT-[^/]*/?$' all-cases.txt > cases.txt || true
          mapfile -t cases < cases.txt
          echo "${#cases[@]} case(s); mode $MODE"
          python3 tools/golden/capture.py --check "${cases[@]}"

      # External inputs of the cases ([[external]] in case.toml, tools/golden/goldenlib/external.py):
      # the pinned PDK data sets (.cache/pdks) and Magic's sources (build/ref/magic, for the generated
      # scmos.tech). Same cache entries as ci.yml (one per data set, keys from
      # `scripts/fetch_pdk.py --cache-info`), so the sets saved by CI are reused here.
      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        id: sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Restore gf180mcu
        id: gf180mcu
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - name: Restore ihp
        id: ihp
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.ihp_path }}
          key: ${{ steps.keys.outputs.ihp_key }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      # scripts/fetch_pdk.py installs a PDK set with hefesto-cli's own `pdk install`; a restored set only
      # has its tree digest verified and needs no hefesto-cli.
      - name: Build hefesto-cli for the PDK install (cache miss only)
        if: >-
          steps.sky130.outputs.cache-hit != 'true' || steps.gf180mcu.outputs.cache-hit != 'true' ||
          steps.ihp.outputs.cache-hit != 'true'
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev  # libcurl's TLS
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch the pinned PDK data sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 gf180mcu ihp --cli build/linux-release/src/cli/hefesto-cli

      - name: Save sky130
        if: steps.sky130.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Save gf180mcu
        if: steps.gf180mcu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - name: Save ihp
        if: steps.ihp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.ihp_path }}
          key: ${{ steps.keys.outputs.ihp_key }}

      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Verify captured cases against a fresh capture
        if: env.MODE == 'both' || env.MODE == 'verify'
        shell: bash
        run: |
          # capture.py --only-captured keeps the cases with expected/provenance.json.
          mapfile -t cases < cases.txt
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --verify --only-captured "${cases[@]}"

      - name: Capture cases without expected/
        if: env.MODE == 'both' || env.MODE == 'capture'
        shell: bash
        run: |
          # Reproducible provenance: the capture time is the commit time.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mapfile -t cases < cases.txt
          # A case that fails (e.g. the reference tool crashes) must not drop the others' outputs:
          # collect and upload what was captured, then fail the step.
          status=0
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --only-missing "${cases[@]}" 2>&1 | tee capture.log || status=$?
          # Collect the new expected/ directories, keeping their tests/golden/... paths.
          mkdir -p golden-expected
          git ls-files --others --exclude-standard -- 'tests/golden/*/cases/*/expected/*' > new-files.txt
          if [ -s new-files.txt ]; then
            tar -cf - -T new-files.txt | tar -xf - -C golden-expected
            echo "::notice::captured $(grep -c 'captured' capture.log) case(s); download the golden-expected artifact and commit it"
          else
            echo "::notice::no case without expected/"
          fi
          grep ': error: ' capture.log | sed 's/^/::error::/' || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always() && (env.MODE == 'both' || env.MODE == 'capture')
        with:
          name: golden-expected
          path: golden-expected/
          if-no-files-found: ignore
          retention-days: 30

  # The MASK-RT-* library round trips (m5-mask-gds-cif design D19, task 1.6), one shard per PDK and the large
  # libraries in shards of their own (scripts/gds_rt_shards.py, which also sets each shard's timeout from
  # task 1.1's Magic read+write times). Each shard restores its PDK's tech set (the rc) and library GDS set,
  # fetches whatever the restore missed and saves it, then verifies and captures like `capture`.
  capture-gds-rt:
    name: MASK-RT round trips (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.rt_any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rt_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List the shard's cases
        shell: bash
        env:
          RT_CASES: ${{ needs.plan.outputs.rt_cases }}
        run: |
          # RT_CASES is plan's selection of MASK-RT cases (never empty when this job runs); MODE comes
          # from the workflow env.
          read -ra requested <<< "$RT_CASES"
          python3 scripts/gds_rt_shards.py --cases "${{ matrix.shard }}" "${requested[@]}" > cases.txt
          mapfile -t shard_cases < cases.txt
          echo "${#shard_cases[@]} case(s) in shard ${{ matrix.shard }}; mode $MODE"
          python3 tools/golden/capture.py --check "${shard_cases[@]}"

      # A sky130 GDS fetch peaks at about 4.7 GB (the largest library's tar plus the kept set, task 1.1).
      - name: Free disk space
        if: matrix.tech == 'sky130'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore the tech set
        id: tech
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Restore the library GDS set
        id: gds
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.gds_out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.gds_out)] }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli for the PDK install (cache miss only)
        if: steps.tech.outputs.cache-hit != 'true' || steps.gds.outputs.cache-hit != 'true'
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev  # libcurl's TLS
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch or verify the data sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_pdk.py ${{ matrix.tech }} ${{ matrix.gds }} \
            --cli build/linux-release/src/cli/hefesto-cli
          df -h /

      - name: Save the tech set
        if: steps.tech.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Save the library GDS set
        if: steps.gds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.gds_out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.gds_out)] }}

      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Verify captured cases against a fresh capture
        if: env.MODE == 'both' || env.MODE == 'verify'
        shell: bash
        run: |
          mapfile -t cases < cases.txt
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --verify --only-captured "${cases[@]}"

      - name: Capture cases without expected/
        if: env.MODE == 'both' || env.MODE == 'capture'
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mapfile -t cases < cases.txt
          status=0
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --only-missing "${cases[@]}" 2>&1 | tee capture.log || status=$?
          mkdir -p golden-expected
          git ls-files --others --exclude-standard -- 'tests/golden/*/cases/*/expected/*' > new-files.txt
          if [ -s new-files.txt ]; then
            tar -cf - -T new-files.txt | tar -xf - -C golden-expected
            echo "::notice::captured $(grep -c 'captured' capture.log) case(s); download golden-expected-gds-rt-${{ matrix.shard }}"
          else
            echo "::notice::no case without expected/"
          fi
          grep ': error: ' capture.log | sed 's/^/::error::/' || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always() && (env.MODE == 'both' || env.MODE == 'capture')
        with:
          name: golden-expected-gds-rt-${{ matrix.shard }}
          path: golden-expected/
          if-no-files-found: ignore
          retention-days: 30

  # Task 1.1 of m5-mask-gds-cif (design D19): Magic 8.3.694 reads and writes every library GDS file with
  # the PDK's rc, timed per file (scripts/d19/). Dispatch with mode d19-timing. The job summary has one
  # table per set and d19-<set>.json is uploaded; the wall times size capture-gds-rt's shard timeouts.
  d19-magic-timing:
    name: D19 Magic round-trip timing (${{ matrix.set }})
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'd19-timing'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { set: sky130-gds, tech: sky130, out: sky130_gds }
          - { set: gf180mcu-gds, tech: gf180mcu, out: gf180mcu_gds }
          - { set: ihp-gds, tech: ihp, out: ihp_gds }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk space for the sky130 GDS (peak is the largest library's tar plus the kept set)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Cache keys of the data sets
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore the tech set
        id: tech
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Restore the GDS set
        id: gds
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.out)] }}
      - name: Build hefesto-cli for the PDK install
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli
      - name: Fetch or verify the sets (records download time and peak disk)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          df -h /
          /usr/bin/time -v python3 scripts/fetch_pdk.py ${{ matrix.tech }} ${{ matrix.set }} \
            --cli build/linux-release/src/cli/hefesto-cli
          df -h /
          du -sh .cache/pdks/gds
      - name: Save the tech set
        if: steps.tech.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Save the GDS set
        if: steps.gds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.out)] }}
      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden
      - name: Time Magic's read and write of every library GDS
        shell: bash
        run: |
          mkdir -p d19
          status=0
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" -e HOME=/tmp -e TZ=UTC -e LC_ALL=C \
            -e GITHUB_STEP_SUMMARY=/work/d19/summary.md hefesto-golden:ci \
            python3 /work/scripts/d19/d19_time_magic.py --set ${{ matrix.set }} \
            --out /work/d19/${{ matrix.set }}.json || status=$?
          cat d19/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d19-${{ matrix.set }}
          path: d19/
