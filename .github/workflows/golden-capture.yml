# Copyright 2026 The Hefesto Authors
#
# Builds the pinned reference-tool image (tools/golden/container/Containerfile)
# and runs the golden cases through Magic and the other reference tools.
# Capability hefesto-testing-strategy, requirement "Golden compatibility suite";
# design.md D8 (m0-foundations) and D8 (m1-core-viewer).
#
# Two steps, each on its own set of cases:
#   verify   cases WITH expected/provenance.json: a fresh capture must match the
#            committed expected/ (compare-only, writes nothing in the checkout).
#   capture  cases WITHOUT expected/: the reference outputs are captured and
#            uploaded as the artifact "golden-expected" (tests/golden/... paths),
#            to be reviewed and committed. Nothing is pushed by this workflow.
#
# When each step runs:
#   pull_request    both: verify the captured cases, capture the new ones (a PR that
#                   adds or edits a case.toml or its input/ gets its outputs as an artifact).
#   schedule        verify only.
#   workflow_dispatch  input `mode`: verify, capture or both (default both); input
#                   `cases` limits either step to the given case directories. Mode
#                   d19-timing runs only the d19-magic-timing job below; modes ext-inputs
#                   and oasis-validate run only their own jobs (m6-lef-def-oasis, below).
#
# The MASK-RT-* library round trips (openspec/changes/m5-mask-gds-cif design D19) need the
# large library GDS data sets and Magic's time on big libraries, so they never run in the
# 120-minute `capture` job: `plan` splits the cases, and `capture-gds-rt` verifies and
# captures them in shards (scripts/gds_rt_shards.py: one per PDK, the I/O and SRAM
# libraries in shards of their own, each with its own timeout). `rt-data` fetches and saves each PDK's
# tech and library GDS sets once before the shards, which only restore them.
#
# Dispatch input `keep-raw` (off by default; capture-gds-rt only) keeps the raw outputs to bisect a
# MASK-RT difference: Magic's run (capture.py --keep-raw: streams, out.gds) and Hefesto's run of the same
# cases (replay.py --keep-raw, hefesto-cli built in the job) go to the artifact
# golden-raw-gds-rt-<shard> as magic/<case-id>/ and hefesto/<case-id>/. With `feedback-probe` both runs
# also save their feedback list (out.feedback.tcl: the CIF "parent and child disagree" entries with cell,
# layer and area). `probe-tcl` (Tcl text) runs in both before the final quit, e.g. a `save` of the
# cells under suspicion to compare the two reads as .mag files. tools/golden/raw_diff.py compares the
# two directories of a case. The probes run only in the verify step (a capture writes expected/, which
# their output must not reach). goldenlib/rawkeep.py gzips the kept GDS files and keeps at most 256 MiB
# per file and 2 GiB per side; with keep-raw a shard's timeout is its `timeout_raw` (scripts/gds_rt_shards.py),
# which adds Hefesto's replay of the shard.

name: Golden capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify (captured cases), capture (cases without expected/), both, d19-timing (m5 task 1.1), ext-inputs or oasis-validate (m6 tasks 1.6, 1.7)"
        type: choice
        options: [both, verify, capture, d19-timing, ext-inputs, oasis-validate]
        default: both
      cases:
        description: "Space-separated case directories (e.g. tests/golden/TECH/cases/TECH-G01); empty = all"
        type: string
        default: ""
      keep-raw:
        description: "MASK-RT shards: upload Magic's and Hefesto's raw outputs (out.gds, logs) per case"
        type: boolean
        default: false
      feedback-probe:
        description: "With keep-raw: both runs also save their feedback list (out.feedback.tcl)"
        type: boolean
        default: false
      probe-tcl:
        description: "With keep-raw: Tcl both runs execute before their final quit (wrap commands in catch)"
        type: string
        default: ""
  pull_request:
    paths:
      - tools/golden/container/**
      - tools/golden/harness/**
      - tools/golden/pins.toml
      - tools/golden/capture.py
      - tools/golden/goldenlib/**
      - tests/golden/**/case.toml
      - tests/golden/**/input/**
      - scripts/fetch_pdk.py  # a PDK pin change alters the [[external]] pdk inputs
      - scripts/gds_rt_shards.py
      - .github/workflows/golden-capture.yml
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && 'verify' || 'both') }}
  CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || '' }}
  KEEP_RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.keep-raw && 'true' || 'false' }}
  FEEDBACK_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.feedback-probe && 'true' || 'false' }}
  PROBE_TCL: ${{ github.event_name == 'workflow_dispatch' && inputs.probe-tcl || '' }}
  # The LEF data sets (sky130-lef, gf180mcu-lef, ihp-lef; openspec/changes/m6-lef-def-oasis design D2, task
  # 1.4). "true" makes `capture` restore them, fetch the missing ones and save them. Off until a case reads
  # them (the LEFDEF-RT-<lib> cases and LEFDEF-240 of task 15.5, as `[[external]] set` inputs).
  FETCH_LEF_SETS: "false"

jobs:
  # Splits the selected cases: the MASK-RT-* round trips go to capture-gds-rt (a matrix of the shards
  # that have cases), every other case to capture.
  plan:
    name: plan the capture jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      regular: ${{ steps.plan.outputs.regular }}
      rt_any: ${{ steps.plan.outputs.rt_any }}
      rt_matrix: ${{ steps.plan.outputs.rt_matrix }}
      rt_sets: ${{ steps.plan.outputs.rt_sets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split the cases
        id: plan
        shell: bash
        run: |
          if [ "$MODE" = "d19-timing" ] || [ "$MODE" = "ext-inputs" ] || [ "$MODE" = "oasis-validate" ]; then
            { echo "regular=0"; echo "rt_any=false"; echo 'rt_matrix={"include":[]}'; echo 'rt_sets={"include":[]}'; } \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CASES" ]; then
            read -ra cases <<< "$CASES"
          else
            mapfile -t cases < <(find tests/golden -path '*/cases/*/case.toml' -exec dirname {} \; | sort)
          fi
          regular=0
          for case_dir in "${cases[@]}"; do
            case "$(basename "$case_dir")" in MASK-RT-*) ;; *) regular=$((regular + 1)) ;; esac
          done
          matrix="$(python3 scripts/gds_rt_shards.py --matrix "${cases[@]}")"
          rt_any=false
          [ "$(jq '.include | length' <<< "$matrix")" -gt 0 ] && rt_any=true
          # One entry per PDK whose data sets the shards need: rt-data fetches each set once.
          sets="$(jq -c '{include: ([.include[] | {tech, gds, gds_out}] | unique)}' <<< "$matrix")"
          { echo "regular=$regular"; echo "rt_any=$rt_any"; echo "rt_matrix=$matrix"; echo "rt_sets=$sets"; } \
            >> "$GITHUB_OUTPUT"
          echo "::notice::$regular case(s) for capture; MASK-RT shards: $(jq -c '[.include[].shard]' <<< "$matrix")"

  capture:
    name: build reference image, verify and capture
    needs: plan
    if: needs.plan.outputs.regular != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List cases
        shell: bash
        run: |
          if [ -n "$CASES" ]; then
            read -ra requested <<< "$CASES"
            printf '%s\n' "${requested[@]}" > all-cases.txt
          else
            find tests/golden -path '*/cases/*/case.toml' -exec dirname {} \; | sort > all-cases.txt
          fi
          # The MASK-RT-* round trips run in capture-gds-rt (m5-mask-gds-cif design D19).
          grep -v -E '(^|/)MASK-RT-[^/]*/?$' all-cases.txt > cases.txt || true
          mapfile -t cases < cases.txt
          echo "${#cases[@]} case(s); mode $MODE"
          python3 tools/golden/capture.py --check "${cases[@]}"

      # External inputs of the cases ([[external]] in case.toml, tools/golden/goldenlib/external.py):
      # the pinned PDK data sets (.cache/pdks) and Magic's sources (build/ref/magic, for the generated
      # scmos.tech). Same cache entries as ci.yml (one per data set, keys from
      # `scripts/fetch_pdk.py --cache-info`), so the sets saved by CI are reused here.
      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        id: sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Restore gf180mcu
        id: gf180mcu
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - name: Restore ihp
        id: ihp
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.ihp_path }}
          key: ${{ steps.keys.outputs.ihp_key }}
      # The LEF sets (m6-lef-def-oasis task 1.4), only with FETCH_LEF_SETS.
      - name: Restore sky130-lef
        id: sky130_lef
        if: env.FETCH_LEF_SETS == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_lef_path }}
          key: ${{ steps.keys.outputs.sky130_lef_key }}
      - name: Restore gf180mcu-lef
        id: gf180mcu_lef
        if: env.FETCH_LEF_SETS == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_lef_path }}
          key: ${{ steps.keys.outputs.gf180mcu_lef_key }}
      - name: Restore ihp-lef
        id: ihp_lef
        if: env.FETCH_LEF_SETS == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.ihp_lef_path }}
          key: ${{ steps.keys.outputs.ihp_lef_key }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      # scripts/fetch_pdk.py installs a PDK set with hefesto-cli's own `pdk install`; a restored set only
      # has its tree digest verified and needs no hefesto-cli.
      - name: Build hefesto-cli for the PDK install (cache miss only)
        if: >-
          steps.sky130.outputs.cache-hit != 'true' || steps.gf180mcu.outputs.cache-hit != 'true' ||
          steps.ihp.outputs.cache-hit != 'true' ||
          (env.FETCH_LEF_SETS == 'true' && (steps.sky130_lef.outputs.cache-hit != 'true' ||
          steps.gf180mcu_lef.outputs.cache-hit != 'true' || steps.ihp_lef.outputs.cache-hit != 'true'))
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev  # libcurl's TLS
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch the pinned PDK data sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          lef_sets=()
          [ "$FETCH_LEF_SETS" != "true" ] || lef_sets=(sky130-lef gf180mcu-lef ihp-lef)
          python3 scripts/fetch_pdk.py sky130 gf180mcu ihp "${lef_sets[@]}" \
            --cli build/linux-release/src/cli/hefesto-cli

      - name: Save sky130
        if: steps.sky130.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Save gf180mcu
        if: steps.gf180mcu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - name: Save ihp
        if: steps.ihp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.ihp_path }}
          key: ${{ steps.keys.outputs.ihp_key }}
      - name: Save sky130-lef
        if: env.FETCH_LEF_SETS == 'true' && steps.sky130_lef.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.sky130_lef_path }}
          key: ${{ steps.keys.outputs.sky130_lef_key }}
      - name: Save gf180mcu-lef
        if: env.FETCH_LEF_SETS == 'true' && steps.gf180mcu_lef.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_lef_path }}
          key: ${{ steps.keys.outputs.gf180mcu_lef_key }}
      - name: Save ihp-lef
        if: env.FETCH_LEF_SETS == 'true' && steps.ihp_lef.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.ihp_lef_path }}
          key: ${{ steps.keys.outputs.ihp_lef_key }}

      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Verify captured cases against a fresh capture
        if: env.MODE == 'both' || env.MODE == 'verify'
        shell: bash
        run: |
          # capture.py --only-captured keeps the cases with expected/provenance.json.
          mapfile -t cases < cases.txt
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --verify --only-captured "${cases[@]}"

      - name: Capture cases without expected/
        if: env.MODE == 'both' || env.MODE == 'capture'
        shell: bash
        run: |
          # Reproducible provenance: the capture time is the commit time.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mapfile -t cases < cases.txt
          # A case that fails (e.g. the reference tool crashes) must not drop the others' outputs:
          # collect and upload what was captured, then fail the step.
          status=0
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --only-missing "${cases[@]}" 2>&1 | tee capture.log || status=$?
          # Collect the new expected/ directories, keeping their tests/golden/... paths.
          mkdir -p golden-expected
          git ls-files --others --exclude-standard -- 'tests/golden/*/cases/*/expected/*' > new-files.txt
          if [ -s new-files.txt ]; then
            tar -cf - -T new-files.txt | tar -xf - -C golden-expected
            echo "::notice::captured $(grep -c 'captured' capture.log) case(s); download the golden-expected artifact and commit it"
          else
            echo "::notice::no case without expected/"
          fi
          grep ': error: ' capture.log | sed 's/^/::error::/' || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always() && (env.MODE == 'both' || env.MODE == 'capture')
        with:
          name: golden-expected
          path: golden-expected/
          if-no-files-found: ignore
          retention-days: 30

  # The data sets of the MASK-RT shards (m5-mask-gds-cif task 1.3), one job per PDK: it looks up the PDK's
  # tech set (the rc) and library GDS set, fetches the ones not cached and saves them under their own keys
  # (`scripts/fetch_pdk.py --cache-info`). The shards of one PDK (sky130, sky130-io and sky130-sram share
  # sky130-gds) then only restore, so a cold run fetches each set once and a warm run fetches nothing.
  rt-data:
    name: MASK-RT data sets (${{ matrix.tech }})
    needs: plan
    if: needs.plan.outputs.rt_any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rt_sets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Look up the tech set
        id: tech
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
          lookup-only: true
      - name: Look up the library GDS set
        id: gds
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.gds_out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.gds_out)] }}
          lookup-only: true

      - name: List the sets to fetch
        id: missing
        env:
          TECH_HIT: ${{ steps.tech.outputs.cache-hit }}
          GDS_HIT: ${{ steps.gds.outputs.cache-hit }}
        run: |
          sets=""
          [ "$TECH_HIT" = "true" ] || sets="$sets ${{ matrix.tech }}"
          [ "$GDS_HIT" = "true" ] || sets="$sets ${{ matrix.gds }}"
          echo "sets=${sets# }" >> "$GITHUB_OUTPUT"
          echo "::notice::${{ matrix.tech }} data sets to fetch: ${sets:- none}"

      # A sky130 GDS fetch peaks at about 4.7 GB (the largest library's tar plus the kept set, task 1.1).
      - name: Free disk space
        if: steps.missing.outputs.sets != '' && matrix.tech == 'sky130'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build hefesto-cli for the PDK install
        if: steps.missing.outputs.sets != ''
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev  # libcurl's TLS
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch the missing data sets
        if: steps.missing.outputs.sets != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISSING_SETS: ${{ steps.missing.outputs.sets }}
        run: |
          read -ra missing <<< "$MISSING_SETS"
          python3 scripts/fetch_pdk.py "${missing[@]}" --cli build/linux-release/src/cli/hefesto-cli
          df -h /

      - name: Save the tech set
        if: steps.tech.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Save the library GDS set
        if: steps.gds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.gds_out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.gds_out)] }}

  # The MASK-RT-* library round trips (m5-mask-gds-cif design D19, task 1.6), one shard per PDK and the large
  # libraries in shards of their own (scripts/gds_rt_shards.py, which also sets each shard's timeout from
  # task 1.1's Magic read+write times). Each shard restores its PDK's tech set (the rc) and library GDS set
  # saved by rt-data, verifies them (fetching only what an eviction lost, without saving it), then verifies
  # and captures like `capture`.
  capture-gds-rt:
    name: MASK-RT round trips (${{ matrix.shard }})
    needs: [plan, rt-data]
    # A failed data-set job must not skip every shard: each shard falls back
    # to its own fetch.
    if: ${{ !cancelled() && needs.plan.outputs.rt_any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.keep-raw && matrix.timeout_raw || matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rt_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List the shard's cases
        shell: bash
        run: |
          # CASES and MODE come from the workflow env.
          if [ -n "${CASES:-}" ]; then read -ra requested <<< "$CASES"; else requested=(); fi
          python3 scripts/gds_rt_shards.py --cases "${{ matrix.shard }}" "${requested[@]}" > cases.txt
          mapfile -t shard_cases < cases.txt
          echo "${#shard_cases[@]} case(s) in shard ${{ matrix.shard }}; mode $MODE"
          python3 tools/golden/capture.py --check "${shard_cases[@]}"

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore the tech set
        id: tech
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Restore the library GDS set
        id: gds
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.gds_out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.gds_out)] }}

      # A sky130 GDS fetch (only when the cache lost the set saved by rt-data) peaks at about 4.7 GB.
      - name: Free disk space
        if: matrix.tech == 'sky130' && steps.gds.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      # keep-raw also runs Hefesto on the shard's cases, so it always builds hefesto-cli.
      - name: Build hefesto-cli for the PDK install (cache miss or keep-raw)
        if: steps.tech.outputs.cache-hit != 'true' || steps.gds.outputs.cache-hit != 'true' || env.KEEP_RAW == 'true'
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev  # libcurl's TLS
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch or verify the data sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_pdk.py ${{ matrix.tech }} ${{ matrix.gds }} \
            --cli build/linux-release/src/cli/hefesto-cli
          df -h /

      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Verify captured cases against a fresh capture
        if: env.MODE == 'both' || env.MODE == 'verify'
        shell: bash
        run: |
          mapfile -t cases < cases.txt
          raw=()
          if [ "$KEEP_RAW" = "true" ]; then raw=(--keep-raw raw/magic); fi
          if [ "$KEEP_RAW" = "true" ] && [ "$FEEDBACK_PROBE" = "true" ]; then raw+=(--feedback-probe); fi
          if [ "$KEEP_RAW" = "true" ] && [ -n "$PROBE_TCL" ]; then
            printf '%s\n' "$PROBE_TCL" > raw-probe.tcl
            raw+=(--probe-tcl raw-probe.tcl)
          fi
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --verify --only-captured "${raw[@]}" "${cases[@]}"

      - name: Capture cases without expected/
        if: env.MODE == 'both' || env.MODE == 'capture'
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mapfile -t cases < cases.txt
          # keep-raw without the probes: capture.py rejects them here, since their output would reach
          # the expected/ files this step uploads.
          raw=()
          if [ "$KEEP_RAW" = "true" ]; then raw=(--keep-raw raw/magic); fi
          status=0
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --only-missing "${raw[@]}" "${cases[@]}" 2>&1 | tee capture.log || status=$?
          mkdir -p golden-expected
          git ls-files --others --exclude-standard -- 'tests/golden/*/cases/*/expected/*' > new-files.txt
          if [ -s new-files.txt ]; then
            tar -cf - -T new-files.txt | tar -xf - -C golden-expected
            echo "::notice::captured $(grep -c 'captured' capture.log) case(s); download golden-expected-gds-rt-${{ matrix.shard }}"
          else
            echo "::notice::no case without expected/"
          fi
          grep ': error: ' capture.log | sed 's/^/::error::/' || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always() && (env.MODE == 'both' || env.MODE == 'capture')
        with:
          name: golden-expected-gds-rt-${{ matrix.shard }}
          path: golden-expected/
          if-no-files-found: ignore
          retention-days: 30

      # keep-raw: Hefesto's run of the same cases (information; a differing case does not fail the job).
      - name: Hefesto's raw outputs of the shard's cases
        if: ${{ !cancelled() && env.KEEP_RAW == 'true' }}
        shell: bash
        run: |
          mapfile -t cases < cases.txt
          mkdir -p raw
          probe=()
          if [ "$FEEDBACK_PROBE" = "true" ]; then probe=(--feedback-probe); fi
          if [ -n "$PROBE_TCL" ]; then
            printf '%s\n' "$PROBE_TCL" > raw-probe.tcl
            probe+=(--probe-tcl raw-probe.tcl)
          fi
          python3 tools/golden/replay.py --hefesto-cli build/linux-release/src/cli/hefesto-cli --include-gds-rt \
            --keep-raw raw/hefesto "${probe[@]}" "${cases[@]}" | tee raw/hefesto-replay.txt || true
          for dir in raw/magic/*/; do
            id="$(basename "$dir")"
            [ -d "raw/hefesto/$id" ] || continue
            python3 tools/golden/raw_diff.py "raw/magic/$id" "raw/hefesto/$id" > "raw/$id.diff.txt" || true
          done
          du -sh raw

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.KEEP_RAW == 'true' }}
        with:
          name: golden-raw-gds-rt-${{ matrix.shard }}
          path: raw/
          if-no-files-found: ignore
          retention-days: 14

  # Task 1.1 of m5-mask-gds-cif (design D19): Magic 8.3.694 reads and writes every library GDS file with
  # the PDK's rc, timed per file (scripts/d19/). Dispatch with mode d19-timing. The job summary has one
  # table per set and d19-<set>.json is uploaded; the wall times size capture-gds-rt's shard timeouts.
  d19-magic-timing:
    name: D19 Magic round-trip timing (${{ matrix.set }})
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'd19-timing'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { set: sky130-gds, tech: sky130, out: sky130_gds }
          - { set: gf180mcu-gds, tech: gf180mcu, out: gf180mcu_gds }
          - { set: ihp-gds, tech: ihp, out: ihp_gds }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk space for the sky130 GDS (peak is the largest library's tar plus the kept set)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Cache keys of the data sets
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore the tech set
        id: tech
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Restore the GDS set
        id: gds
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.out)] }}
      - name: Build hefesto-cli for the PDK install
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli
      - name: Fetch or verify the sets (records download time and peak disk)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          df -h /
          /usr/bin/time -v python3 scripts/fetch_pdk.py ${{ matrix.tech }} ${{ matrix.set }} \
            --cli build/linux-release/src/cli/hefesto-cli
          df -h /
          du -sh .cache/pdks/gds
      - name: Save the tech set
        if: steps.tech.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Save the GDS set
        if: steps.gds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.out)] }}
      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden
      - name: Time Magic's read and write of every library GDS
        shell: bash
        run: |
          mkdir -p d19
          status=0
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" -e HOME=/tmp -e TZ=UTC -e LC_ALL=C \
            -e GITHUB_STEP_SUMMARY=/work/d19/summary.md hefesto-golden:ci \
            python3 /work/scripts/d19/d19_time_magic.py --set ${{ matrix.set }} \
            --out /work/d19/${{ matrix.set }}.json || status=$?
          cat d19/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d19-${{ matrix.set }}
          path: d19/

  # Task 1.6 of m6-lef-def-oasis (Open Question 1 (a), design D19): Magic writes the .ext files the DEF-write net
  # cases read (Hefesto cannot extract before M7). tools/golden/authoring/lefdef_cases.py --ext-plan lists the
  # targets: every authored DEF-write net case (LEFDEF-317..328, 330..334; `cases` limits them) and the smoke
  # layout tests/data/extflat/smoke/. tools/golden/ext_inputs.py runs harness/ext_probe/ext_probe.tcl
  # (`extract all`) on each in the pinned image and checks every .ext file (complete records, no error line).
  # The artifact ext-inputs is synced with `lefdef_cases.py --sync-ext <dir>` and committed.
  ext-inputs:
    name: .ext probe (Magic extract all)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'ext-inputs'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan the probe runs
        shell: bash
        run: |
          read -ra cases <<< "$CASES"
          python3 tools/golden/authoring/lefdef_cases.py --ext-plan ext-plan.json "${cases[@]}"
      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden
      - name: Run the probe
        shell: bash
        run: |
          status=0
          python3 tools/golden/ext_inputs.py --plan ext-plan.json --out ext-inputs --image hefesto-golden:ci \
            || status=$?
          cat ext-inputs/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ext-inputs
          path: ext-inputs/
          if-no-files-found: ignore
          retention-days: 30

  # Task 1.7 of m6-lef-def-oasis (design D18, D20): KLayout and gdstk check Hefesto's OASIS files. `produce`
  # runs hefesto-cli on the OASIS-05x/061 cases (the writes, the strict-mode files, the 419-byte file) and
  # skips, with the reason, every case or command that does not exist yet; `check` runs in the image: the
  # reference-tool smoke files, then KLayout (read with expect_strict_mode, strm2gds, strmxor, strmcmp) and
  # gdstk (read_oas, oas_validate) on every file. Verdicts: the job summary and the artifact oasis-validate.
  oasis-validate:
    name: OASIS validation (KLayout, gdstk)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'oasis-validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build hefesto-cli
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev  # libcurl's TLS
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli
      # A failed case fails the job, but the tools still run and report (the steps below).
      - name: Write Hefesto's OASIS files
        shell: bash
        run: |
          read -ra cases <<< "$CASES"
          python3 tools/golden/oasis_validate.py produce --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --out oasis-validate "${cases[@]}"
      # The image size is recorded in m6-lef-def-oasis design D18 (task 1.3).
      - name: Build reference-tool image
        if: ${{ !cancelled() }}
        run: |
          docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden
          echo "::notice::hefesto-golden:ci is $(docker image inspect --format '{{.Size}}' hefesto-golden:ci) bytes"
      - name: Check with KLayout and gdstk
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          docker run --rm --network=none -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TZ=UTC -e LC_ALL=C hefesto-golden:ci \
            python3 tools/golden/oasis_validate.py check --dir oasis-validate || status=$?
          cat oasis-validate/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oasis-validate
          path: oasis-validate/
          if-no-files-found: ignore
          retention-days: 30
