#
# Builds the pinned reference-tool image (tools/golden/container/Containerfile)
# and runs the golden cases through Magic and the other reference tools.
# Capability hefesto-testing-strategy, requirement "Golden compatibility suite";
# design.md D8 (m0-foundations) and D8 (m1-core-viewer).
#
# Two steps, each on its own set of cases:
#   verify   cases WITH expected/provenance.json: a fresh capture must match the
#            committed expected/ (compare-only, writes nothing in the checkout).
#   capture  cases WITHOUT expected/: the reference outputs are captured and
#            uploaded as the artifact "golden-expected" (tests/golden/... paths),
#            to be reviewed and committed. Nothing is pushed by this workflow.
#
# When each step runs:
#   pull_request    both: verify the captured cases, capture the new ones (a PR that
#                   adds or edits a case.toml or its input/ gets its outputs as an artifact).
#   schedule        verify only.
#   workflow_dispatch  input `mode`: verify, capture or both (default both); input
#                   `cases` limits either step to the given case directories.

name: Golden capture

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify (captured cases), capture (cases without expected/) or both"
        type: choice
        options: [both, verify, capture]
        default: both
      cases:
        description: "Space-separated case directories (e.g. tests/golden/TECH/cases/TECH-G01); empty = all"
        type: string
        default: ""
  pull_request:
    paths:
      - tools/golden/container/**
      - tools/golden/harness/**
      - tools/golden/pins.toml
      - tools/golden/capture.py
      - tools/golden/goldenlib/**
      - tests/golden/**/case.toml
      - tests/golden/**/input/**
      - scripts/fetch_pdk.py  # a PDK pin change alters the [[external]] pdk inputs
      - .github/workflows/golden-capture.yml
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  capture:
    name: build reference image, verify and capture
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && 'verify' || 'both') }}
      CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List cases
        shell: bash
        run: |
          if [ -n "$CASES" ]; then
            read -ra requested <<< "$CASES"
            printf '%s\n' "${requested[@]}" > cases.txt
          else
            find tests/golden -path '*/cases/*/case.toml' -exec dirname {} \; | sort > cases.txt
          fi
          mapfile -t cases < cases.txt
          echo "${#cases[@]} case(s); mode $MODE"
          python3 tools/golden/capture.py --check "${cases[@]}"

      # External inputs of the cases ([[external]] in case.toml, tools/golden/goldenlib/external.py):
      # the pinned PDK data sets (.cache/pdks) and Magic's sources (build/ref/magic, for the generated
      # scmos.tech). Same cache entries as ci.yml (one per data set, keys from
      # `scripts/fetch_pdk.py --cache-info`), so the sets saved by CI are reused here.
      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        id: sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Restore gf180mcu
        id: gf180mcu
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - name: Restore ihp
        id: ihp
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.ihp_path }}
          key: ${{ steps.keys.outputs.ihp_key }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      # scripts/fetch_pdk.py installs a PDK set with hefesto-cli's own `pdk install`; a restored set only
      # has its tree digest verified and needs no hefesto-cli.
      - name: Build hefesto-cli for the PDK install (cache miss only)
        if: >-
          steps.sky130.outputs.cache-hit != 'true' || steps.gf180mcu.outputs.cache-hit != 'true' ||
          steps.ihp.outputs.cache-hit != 'true'
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev  # libcurl's TLS
          python3 -m pip install "cmake==3.31.6" "ninja==1.11.1.4"
          cmake --preset linux-release -DHEFESTO_BUILD_TESTS=OFF -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch the pinned PDK data sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 gf180mcu ihp --cli build/linux-release/src/cli/hefesto-cli

      - name: Save sky130
        if: steps.sky130.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Save gf180mcu
        if: steps.gf180mcu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - name: Save ihp
        if: steps.ihp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.keys.outputs.ihp_path }}
          key: ${{ steps.keys.outputs.ihp_key }}

      - name: Build reference-tool image
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Verify captured cases against a fresh capture
        if: env.MODE == 'both' || env.MODE == 'verify'
        shell: bash
        run: |
          # capture.py --only-captured keeps the cases with expected/provenance.json.
          mapfile -t cases < cases.txt
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --verify --only-captured "${cases[@]}"

      - name: Capture cases without expected/
        if: env.MODE == 'both' || env.MODE == 'capture'
        shell: bash
        run: |
          # Reproducible provenance: the capture time is the commit time.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mapfile -t cases < cases.txt
          # A case that fails (e.g. the reference tool crashes) must not drop the others' outputs:
          # collect and upload what was captured, then fail the step.
          status=0
          python3 tools/golden/capture.py --runner container --image hefesto-golden:ci \
            --only-missing "${cases[@]}" 2>&1 | tee capture.log || status=$?
          # Collect the new expected/ directories, keeping their tests/golden/... paths.
          mkdir -p golden-expected
          git ls-files --others --exclude-standard -- 'tests/golden/*/cases/*/expected/*' > new-files.txt
          if [ -s new-files.txt ]; then
            tar -cf - -T new-files.txt | tar -xf - -C golden-expected
            echo "::notice::captured $(grep -c 'captured' capture.log) case(s); download the golden-expected artifact and commit it"
          else
            echo "::notice::no case without expected/"
          fi
          grep ': error: ' capture.log | sed 's/^/::error::/' || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always() && (env.MODE == 'both' || env.MODE == 'capture')
        with:
          name: golden-expected
          path: golden-expected/
          if-no-files-found: ignore
          retention-days: 30
