# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 The Hefesto Authors
#
# Build, test, fuzz and policy checks for every pull request and for main.
# Implements the CI matrix of openspec/changes/m0-foundations/design.md (D12):
#   hefesto-build-and-distribution  "Continuous integration matrix", "Dependency policy"
#   hefesto-platform-targets        "Supported toolchains" (oldest and newest of each compiler)
#   hefesto-testing-strategy        "Requirement-traceable tests", "Parser fuzzing",
#                                   "Cross-platform determinism checks"
#   hefesto-licensing               SPDX headers on first-party code
# `openspec validate --all --strict` runs in openspec-validate.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned host tools, installed from PyPI so every leg (x86_64, aarch64, macOS) gets the same versions.
  CMAKE_VERSION: "3.31.6"
  NINJA_VERSION: "1.11.1.4"
  PYTHON_VERSION: "3.12"
  # CMake reads these from the environment, so the presets need no ccache entries.
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CTEST_PARALLEL_LEVEL: "4"
  # Leg whose golden outputs are the reference for the cross-platform determinism check.
  GOLDEN_REFERENCE_LEG: linux-x64-gcc-latest
  # The PDK install test over the network (ctest label `network`, tests/unit/pdk/network_e2e.cpp) skips
  # itself everywhere except the one leg that runs it on purpose (matrix `network`, step "PDK network test").
  HEFESTO_SKIP_NETWORK_TESTS: "1"

jobs:
  lint:
    name: lint (SPDX, notices, core includes, traceability, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Unit tests of the check scripts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: SPDX Apache-2.0 headers on first-party files
        run: python3 scripts/check_license_headers.py
      - name: Every pinned dependency is in THIRD_PARTY_NOTICES.md
        run: python3 scripts/check_third_party_notices.py
      - name: Core has no UI, GPU, Raven or process includes
        run: python3 scripts/check_core_includes.py
      - name: Requirement coverage report (report-only)
        run: |
          mkdir -p coverage-report
          python3 scripts/check_requirement_coverage.py --milestone M0 --output coverage-report/m0.md
          python3 scripts/check_requirement_coverage.py --milestone M0 --classes exact,behavioral,native \
            --output coverage-report/m0-all-classes.md
          python3 scripts/check_requirement_coverage.py --format json --output coverage-report/all.json
          python3 scripts/check_requirement_coverage.py --output coverage-report/all.md
          {
            cat coverage-report/m0.md
            echo
            echo "## All milestones"
            echo
            python3 - <<'EOF'
          import json
          d = json.load(open("coverage-report/all.json"))
          print(f"Covered {d['covered']} of {d['total']} exact/behavioral requirements ({d['percent']} %). "
                "Full list in the requirement-coverage artifact.")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: requirement-coverage
          path: coverage-report/
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported GCC and Clang (hefesto-platform-targets "Supported toolchains").
          - { name: linux-x64-gcc-11, os: ubuntu-22.04, cc: gcc-11, cxx: g++-11, preset: ci-linux }
          - { name: linux-x64-clang-14, os: ubuntu-22.04, cc: clang-14, cxx: clang++-14, preset: ci-linux, network: true }
          # Newest GCC and Clang shipped on the runner image. Bump together with the image.
          # Both build the desktop shell and renderer, so Raven and the Vulkan code compile with GCC and Clang.
          - name: linux-x64-gcc-latest
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            preset: ci-linux-desktop
            desktop: true
          - name: linux-x64-clang-latest
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            preset: ci-linux-desktop
            desktop: true
          # Linux aarch64 with GCC and Clang (roadmap M0; unsigned `char` matters for the signed-byte hash rule).
          - { name: linux-arm64-gcc, os: ubuntu-24.04-arm, cc: gcc, cxx: g++, preset: ci-linux }
          - { name: linux-arm64-clang, os: ubuntu-24.04-arm, cc: clang-18, cxx: clang++-18, preset: ci-linux }
          # Oldest Apple Clang available on hosted runners and the newest runner image. GitHub retired the
          # macos-14 image, and macos-15 has no Xcode 15, so the oldest leg selects the oldest Xcode installed
          # on macos-15 (deviation from hefesto-platform-targets "Supported toolchains", design D12). The newest also builds the
          # desktop shell against MoltenVK (the macOS platform of the Raven go/no-go).
          - { name: macos-arm64-xcode-oldest, os: macos-15, cc: clang, cxx: clang++, preset: ci-macos, xcode: oldest, ipados: true }
          - name: macos-arm64-latest
            os: macos-latest
            cc: clang
            cxx: clang++
            preset: ci-macos-desktop
            ipados: true
            moltenvk: true
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Select the oldest installed Xcode
        if: matrix.xcode == 'oldest'
        run: |
          app="$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | head -n 1)"
          sudo xcode-select -s "$app"
          echo "::notice::Selected $app"
          clang++ --version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake and Ninja
        run: python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"

      # The pinned libcurl (src/platform_net, hefesto-licensing D-13) links the system OpenSSL 3.
      - name: Install the OpenSSL headers for libcurl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install Vulkan, X11 and Wayland development packages
        if: matrix.desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers glslang-tools glslc spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libdecor-0-dev \
            xvfb xauth weston

      - name: Install MoltenVK and the Vulkan loader and headers
        if: matrix.moltenvk
        run: brew install molten-vk vulkan-loader vulkan-headers

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 500M

      # FetchContent sources (design D4: FETCHCONTENT_BASE_DIR=.cache/deps/<preset>).
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-${{ matrix.name }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-${{ matrix.name }}-

      # Pinned reference data of the PDK and Magic-reference tests (design D8; docs/building.md,
      # "Reference data for tests"): the sky130A test subset of open_pdks in .cache/pdks and a sparse
      # Magic checkout (scmos/, graphics/) in build/ref/magic. The pins live in scripts/fetch_pdk.py, so the
      # cache key follows them; on a hit both fetch steps only verify (the PDK subset by its tree digest).
      - uses: actions/cache@v4
        with:
          path: |
            .cache/pdks
            build/ref/magic
          key: reference-data-${{ runner.os }}-${{ hashFiles('scripts/fetch_pdk.py') }}

      # Before Configure: tests/unit/tech generates scmos.tech from build/ref/magic at configure time.
      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Uses the hefesto-cli just built (its own `pdk install`); a no-op when the cached subset verifies.
      - name: Fetch the pinned sky130A test subset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py pdk --cli "build/${{ matrix.preset }}/src/cli/hefesto-cli"

      - name: Test
        if: ${{ !matrix.desktop }}
        run: ctest --preset ${{ matrix.preset }}

      # hefesto-pdk-manager (task 7.3): the real Fetchers (in-process HTTPS: libcurl here; and the curl-process
      # fallback) install the pinned sky130A common asset and one small library (about 6.4 MB each, a few
      # seconds) into a temporary root. One leg only, with the job token for
      # the GitHub API listing; the other legs skip the test (HEFESTO_SKIP_NETWORK_TESTS above).
      - name: PDK network test
        if: matrix.network
        env:
          HEFESTO_SKIP_NETWORK_TESTS: "0"
          GITHUB_TOKEN: ${{ github.token }}
        run: ctest --preset ${{ matrix.preset }} -L network --output-on-failure

      # hefesto-build-and-distribution "Dependency policy": desktop shell tests run under X11 and Wayland.
      # Vulkan uses Mesa's software rasterizer (lavapipe); the runners have no GPU. Raven needs only libx11-dev
      # to build and opens the Wayland libraries at run time; the rest of the list is for the shell and tests.
      # The window smoke tests (labels desktop-window-x11 / -wayland, preset option HEFESTO_TEST_DESKTOP_WINDOW)
      # start the real `hefesto` app through Raven and fail if Raven picks the other window system.
      - name: Test under X11 (Xvfb)
        if: matrix.desktop
        env:
          RAVEN_WINDOW_SYSTEM: x11  # Raven's documented override of its window-system choice
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ctest --preset ${{ matrix.preset }} -LE desktop-window
          xvfb-run -a -s "-screen 0 1920x1080x24" ctest --preset ${{ matrix.preset }} -L desktop-window-x11

      - name: Test under Wayland (headless Weston)
        if: matrix.desktop
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-hefesto --idle-time=0 &
          weston_pid=$!
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-hefesto" ] && break
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/wayland-hefesto" || { echo "::error::weston did not start"; exit 1; }
          status=0
          env -u DISPLAY WAYLAND_DISPLAY=wayland-hefesto XDG_SESSION_TYPE=wayland RAVEN_WINDOW_SYSTEM=wayland \
            ctest --preset ${{ matrix.preset }} -L 'unit|desktop-window-wayland' || status=$?
          kill "$weston_pid"
          exit "$status"

      # hefesto-architecture "Platform-independent core": the core builds for iPadOS without UI (design D5).
      - name: Configure iPadOS (core only)
        if: matrix.ipados
        # The Xcode generator picks Xcode's own clang; drop the Ninja-leg compiler and launcher settings.
        run: env -u CC -u CXX -u CMAKE_C_COMPILER_LAUNCHER -u CMAKE_CXX_COMPILER_LAUNCHER cmake --preset ipados

      # The link probe app links hefesto_core into an iOS executable (a static library alone never links).
      - name: Build and link core for iPadOS
        if: matrix.ipados
        run: cmake --build build/ipados --target hefesto_ios_link_probe --config Debug -- CODE_SIGNING_ALLOWED=NO

      # Golden outputs of this leg, compared against the reference leg in the determinism job.
      - name: Replay golden cases into golden-out/
        shell: bash
        run: |
          # Writes golden-out/<AREA>/<case-id>/<output>; exits non-zero when a case fails.
          # The summary stays outside golden-out/: it holds host paths, which differ per leg.
          python3 tools/golden/replay.py --hefesto-cli "build/${{ matrix.preset }}/src/cli/hefesto-cli" \
            --json golden-summary.json --output-dir golden-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ matrix.name }}
          path: golden-out/
          if-no-files-found: ignore

  # hefesto-rendering, task 5.5 of openspec/changes/m1-core-viewer: the GPU readback tests
  # (tests/unit/render/headless_gpu_test.cpp: layer colors, stipples, diagonals, dash patterns, triangles and
  # layer order) on Mesa's software Vulkan driver, lavapipe. They render offscreen, so no X11 or Wayland
  # server runs. Elsewhere they skip without a Vulkan device; HEFESTO_REQUIRE_VULKAN_DEVICE makes a skip a
  # failure here and checks that the device is lavapipe (its device name is "llvmpipe (...)").
  # Only the render test executable is built: the preset enables the desktop build, so Raven is
  # configured (it needs libx11-dev), but the shell, the app and the other tests are not compiled.
  gpu-readback-lavapipe:
    name: linux-x64 GPU readback (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
      PRESET: ci-linux-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install CMake and Ninja
        run: python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
      - name: Install the Vulkan loader, headers and Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools libx11-dev libssl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-lavapipe
          max-size: 300M
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-linux-lavapipe-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-linux-lavapipe-
      - name: Configure
        run: cmake --preset "$PRESET"
      - name: Build the render tests
        run: cmake --build --preset "$PRESET" --target hefesto_render_tests
      - name: GPU readback tests on lavapipe
        env:
          HEFESTO_REQUIRE_VULKAN_DEVICE: llvmpipe
        run: |
          # Only the lavapipe driver is loaded (VK_DRIVER_FILES, Vulkan loader 1.3.234+), whatever else the image
          # ships. Mesa names its manifest lvp_icd.json or lvp_icd.<arch>.json depending on the release.
          ls /usr/share/vulkan/icd.d/
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$icd" || { echo "::error::no lavapipe ICD manifest in /usr/share/vulkan/icd.d"; exit 1; }
          export VK_DRIVER_FILES="$icd"
          vulkaninfo --summary
          "build/$PRESET/tests/unit/render/hefesto_render_tests" --reporter console --durations yes

  determinism:
    name: cross-platform determinism
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        # No leg uploads anything until golden cases exist.
        continue-on-error: true
        with:
          pattern: golden-*
          path: golden
      - name: Compare every leg with ${{ env.GOLDEN_REFERENCE_LEG }}
        run: |
          reference="golden/golden-${GOLDEN_REFERENCE_LEG}"
          if [ ! -d "$reference" ]; then
            echo "::notice::no golden outputs from ${GOLDEN_REFERENCE_LEG}; nothing to compare yet"
            exit 0
          fi
          legs=()
          for dir in golden/golden-*; do
            [ "$dir" = "$reference" ] || legs+=("$dir")
          done
          if [ "${#legs[@]}" -eq 0 ]; then
            echo "::error::only the reference leg produced golden outputs"
            exit 1
          fi
          # replay.py --output-dir already applied each case's documented masks (case.toml [[outputs]] masks,
          # e.g. gds-dates, mag-timestamp), so the trees are compared byte for byte.
          python3 scripts/compare_golden_outputs.py "$reference" "${legs[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  asan:
    name: linux-asan (Clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install CMake and Ninja
        run: python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
      - name: Install the OpenSSL headers for libcurl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-asan
          max-size: 500M
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-linux-asan-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-linux-asan-
      - run: cmake --preset linux-asan
      - run: cmake --build --preset linux-asan
      - run: ctest --preset linux-asan

  # hefesto-testing-strategy "Parser fuzzing": every target runs for a bounded time on pull requests
  # (design D11: 60 s per target) and on every push to main.
  fuzz:
    name: fuzz (libFuzzer, 60 s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install CMake and Ninja
        run: python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
      - name: Install the OpenSSL headers for libcurl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-fuzz
          max-size: 500M
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-linux-fuzz-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-linux-fuzz-
      # The linux-fuzz preset uses the unversioned clang/clang++ (Clang 18 on ubuntu-24.04).
      - run: cmake --preset linux-fuzz
      - run: cmake --build --preset linux-fuzz
      - name: Run each fuzz target
        run: |
          mkdir -p fuzz-artifacts
          mapfile -t targets < <(find build/linux-fuzz/tests/fuzz -maxdepth 1 -type f -perm -u+x -name 'fuzz_*' | sort)
          # Every seed corpus belongs to a target (tests/fuzz/CMakeLists.txt refuses a target without
          # one), so a corpus without its executable means the libFuzzer probe or a build failed:
          # fail, never pass silently.
          for corpus_dir in tests/fuzz/corpus/fuzz_*/; do
            expected="$(basename "$corpus_dir")"
            if [ ! -x "build/linux-fuzz/tests/fuzz/$expected" ]; then
              echo "::error::$expected was not built (libFuzzer probe failed?); found: ${targets[*]:-none}"
              exit 1
            fi
          done
          status=0
          for target in "${targets[@]}"; do
            name="$(basename "$target")"
            corpus="$(mktemp -d)"
            # Seed corpora live in tests/fuzz/corpus/<target>/ (docs/contributing/README.md).
            if [ -d "tests/fuzz/corpus/$name" ]; then
              cp -R "tests/fuzz/corpus/$name/." "$corpus/"
            else
              echo "::warning::no seed corpus in tests/fuzz/corpus/$name"
            fi
            echo "::group::$name"
            "$target" "$corpus" -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix="fuzz-artifacts/$name-" -print_final_stats=1 || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-artifacts/
          if-no-files-found: ignore
