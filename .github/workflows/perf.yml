# Copyright 2026 The Hefesto Authors
#
# DRC performance (openspec/changes/m3-drc design D16, task 11.3; capability
# hefesto-performance "Edit latency" and "Batch throughput relative to Magic").
#
#   drc-bench    One runner, one job: hefesto-cli (Release) and Magic 8.3.694 from the
#                pinned reference image (tools/golden/container/Containerfile) run the same
#                `drc check; drc catchup` scripts, single-threaded, over the 100 x 100
#                sky130_fd_sc_hd__dfxtp_1 array and the all-cells block (bench/drc/drc_bench.py).
#                Fails when the error counts differ; the timed ratio to Magic is reported for
#                information (the throughput gate is drc-profile's instruction count, user
#                decision of 2026-11-12). The background start latency benchmark (hidden test
#                "[benchmark]" of hefesto_drc_engine_tests, target <= 100 ms) runs in the same
#                job. Results: the job summary and the artifact "drc-bench"; they are recorded
#                in docs/design/m3-ui-conformance.md "Performance".
#   drc-profile  The DRC throughput gate (user decision of 2026-11-12): a GCC 14 Release build
#                with debug info and frame pointers runs one and two passes of the block workload
#                (bench/drc/drc_bench.py --emit) under callgrind; bench/drc/callgrind_pass_diff.py
#                gives the instructions of one pass per function, and bench/drc/instruction_gate.py
#                fails above the M3 baseline (12.14 billion) + 2 %. Instruction counts are stable
#                across runner types, where wall time moves by about 0.1 x. On pull requests
#                that touch the DRC paths only the gate runs (about 15 minutes); on main, the
#                weekly schedule and workflow_dispatch the job also profiles: `perf record` of
#                four passes, Magic's count under callgrind (inside the reference image, for
#                information) and drc_bench.py with GCC 14 and Clang builds against Magic, to
#                separate compiler from algorithm. Reports: the job summary and the artifact
#                "drc-profile".
#   golden-slow  The standard-cell corpus cases (CTest label golden-slow, design D14) in a
#                Release build, timed. They also replay on every CI leg (ci.yml, golden replay).
#   gds-bench    The GDS throughput gate (openspec/changes/m5-mask-gds-cif design D20, Open
#                Question 2 decided (a)): a GCC 14 Release build of hefesto-cli and Magic 8.3.694
#                (reference image) run the base and op scripts of bench/gds/gds_bench.py (read
#                sky130_fd_sc_hd.gds; write the all-cells block with `gds merge no` and `yes`)
#                under callgrind on the same runner; bench/gds/gds_gate.py fails when Hefesto's
#                instructions of a workload (op minus base) exceed Magic's, or, once a baseline is
#                recorded in bench/gds/baseline.json, that baseline + 2 %. gds_bench.py then times
#                both tools (information) and fails when their cell counts differ or a write is
#                empty. Results: the job summary and the artifact "gds-bench"; recorded in
#                docs/design/m5-ui-conformance.md "Performance".
#   gds-roundtrip  Every MASK-RT-* library round-trip case (design D19), one job per shard of
#                scripts/gds_rt_shards.py (the shard table golden-capture.yml's capture-gds-rt
#                uses): replay.py --include-gds-rt with every case's input required, then
#                Hefesto's non-gating, order-insensitive equivalence report of a second read and
#                write (bench/gds/gds_equivalence.py) in the job summary.
#   lefdef-bench The LEF/DEF instruction gate (openspec/changes/m6-lef-def-oasis design D22, Open
#                Question 4 decided (a), task 16.2): a GCC 14 Release build of hefesto-cli and Magic
#                8.3.694 (reference image) run the base and op scripts of bench/lefdef/lefdef_bench.py
#                (`lef read` of sky130_fd_sc_hd.lef, `def read` of the generated 5000-cell placed-and-
#                routed block, `lef writeall -notop` of the library) under callgrind;
#                bench/lefdef/baseline_gate.py fails when Hefesto's instructions of a workload (op minus
#                base) exceed its baseline in bench/lefdef/baseline.json + 2 %. Magic's count and the
#                wall time are information; the timing step fails when the two tools' cell counts
#                differ or a write is empty. Results: the job summary and the artifact "lefdef-bench".
#   oasis-bench  The OASIS instruction gate (design D22, task 16.2): the same build runs the oasis and
#                gds scripts of bench/oasis/oasis_bench.py (the gds-bench workloads: read the library,
#                write the all-cells block with merging off and on) under callgrind; baseline_gate.py
#                gates each oasis workload at bench/oasis/baseline.json + 2 % and reports the GDS path's
#                count for information. Results: the job summary and the artifact "oasis-bench".
#                Until a baseline is recorded, a workload is reported as "no baseline" and passes;
#                docs/design/m6-ui-conformance.md "Performance" has the recording procedure.
#
# `plan` picks the jobs: on pull requests the DRC jobs (drc-bench, drc-profile, golden-slow) run
# only when a DRC path changed, the GDS jobs only when a GDS, mask, CIF or use-index path
# changed, lefdef-bench only when a LEF, DEF, cell, db, tech or GDS stream path changed and
# oasis-bench only when an OASIS or GDS read/write/stream path changed (the workflow-level path
# lists carry cell/** and tech/** so such a pull request starts the workflow at all); on main, the schedule and workflow_dispatch every job runs.

name: Performance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/core/include/hefesto/drc/**
      - src/core/src/drc/**
      - src/core/src/db/**
      - src/core/include/hefesto/db/**
      - bench/drc/**
      - tests/unit/drc/engine/latency_bench_test.cpp
      - tests/golden/DRC/cases/DRC-STD-*/**
      - tools/golden/container/**
      - src/core/include/hefesto/gds/**
      - src/core/src/gds/**
      - src/core/include/hefesto/mask/**
      - src/core/src/mask/**
      - src/core/include/hefesto/cif/**
      - src/core/src/cif/**
      - tests/golden/MASK/**
      - bench/gds/**
      - scripts/fetch_pdk.py
      - scripts/gds_rt_shards.py
      - tools/golden/replay.py
      - tools/golden/compare/**
      - tools/golden/goldenlib/**
      - src/core/include/hefesto/lef/**
      - src/core/src/lef/**
      - src/core/include/hefesto/def/**
      - src/core/src/def/**
      - src/core/include/hefesto/oasis/**
      - src/core/src/oasis/**
      - src/core/include/hefesto/cell/**
      - src/core/src/cell/**
      - src/core/include/hefesto/tech/**
      - src/core/src/tech/**
      - bench/lefdef/**
      - bench/oasis/**
      - .github/workflows/perf.yml
  pull_request:
    paths:
      - src/core/include/hefesto/drc/**
      - src/core/src/drc/**
      - src/core/src/db/**
      - src/core/include/hefesto/db/**
      - bench/drc/**
      - tests/unit/drc/engine/latency_bench_test.cpp
      - tests/golden/DRC/cases/DRC-STD-*/**
      - tools/golden/container/**
      - src/core/include/hefesto/gds/**
      - src/core/src/gds/**
      - src/core/include/hefesto/mask/**
      - src/core/src/mask/**
      - src/core/include/hefesto/cif/**
      - src/core/src/cif/**
      - tests/golden/MASK/**
      - bench/gds/**
      - scripts/fetch_pdk.py
      - scripts/gds_rt_shards.py
      - tools/golden/replay.py
      - tools/golden/compare/**
      - tools/golden/goldenlib/**
      - src/core/include/hefesto/lef/**
      - src/core/src/lef/**
      - src/core/include/hefesto/def/**
      - src/core/src/def/**
      - src/core/include/hefesto/oasis/**
      - src/core/src/oasis/**
      - src/core/include/hefesto/cell/**
      - src/core/src/cell/**
      - src/core/include/hefesto/tech/**
      - src/core/src/tech/**
      - bench/lefdef/**
      - bench/oasis/**
      - .github/workflows/perf.yml
  schedule:
    - cron: "41 3 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_VERSION: "3.31.6"
  NINJA_VERSION: "1.11.1.4"
  PYTHON_VERSION: "3.12"
  CC: gcc-14
  CXX: g++-14

jobs:
  plan:
    name: plan the performance jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      drc: ${{ steps.select.outputs.drc }}
      gds: ${{ steps.select.outputs.gds }}
      lefdef: ${{ steps.select.outputs.lefdef }}
      oasis: ${{ steps.select.outputs.oasis }}
      rt_any: ${{ steps.rt.outputs.rt_any }}
      rt_matrix: ${{ steps.rt.outputs.rt_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Select the jobs from the changed paths
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            { echo "drc=true"; echo "gds=true"; echo "lefdef=true"; echo "oasis=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          drc=false
          gds=false
          lefdef=false
          oasis=false
          while IFS= read -r path; do
            case "$path" in
              src/core/include/hefesto/drc/*|src/core/src/drc/*|src/core/src/db/*|src/core/include/hefesto/db/*|\
              bench/drc/*|tests/unit/drc/engine/latency_bench_test.cpp|tests/golden/DRC/cases/DRC-STD-*)
                drc=true ;;
            esac
            case "$path" in
              src/core/include/hefesto/gds/*|src/core/src/gds/*|src/core/include/hefesto/mask/*|src/core/src/mask/*|\
              src/core/include/hefesto/cif/*|src/core/src/cif/*|src/core/include/hefesto/db/use_index*|\
              src/core/src/db/use_index*|tests/golden/MASK/*|bench/gds/*|scripts/fetch_pdk.py|scripts/gds_rt_shards.py|\
              tools/golden/replay.py|tools/golden/compare/*|tools/golden/goldenlib/*)
                gds=true ;;
            esac
            # m6-lef-def-oasis task 16.2; the benches also load bench/drc/drc_bench.py (and the OASIS one
            # bench/gds/gds_bench.py and the shared gate in bench/lefdef/). Also the code the benchmarked commands
            # run through: cell/ (the window load after def read, Q-LEFDEF-141), db/, tech/ and gds/stream/
            # (file opening, gzip); OASIS read and write go through gds/{read,write,stream}/ (design D12).
            case "$path" in
              src/core/include/hefesto/lef/*|src/core/src/lef/*|src/core/include/hefesto/def/*|src/core/src/def/*|\
              src/core/include/hefesto/cell/*|src/core/src/cell/*|src/core/include/hefesto/db/*|src/core/src/db/*|\
              src/core/include/hefesto/tech/*|src/core/src/tech/*|src/core/include/hefesto/gds/stream/*|\
              src/core/src/gds/stream/*|bench/lefdef/*|bench/drc/drc_bench.py|scripts/fetch_pdk.py)
                lefdef=true ;;
            esac
            case "$path" in
              src/core/include/hefesto/oasis/*|src/core/src/oasis/*|src/core/include/hefesto/gds/read/*|\
              src/core/src/gds/read/*|src/core/include/hefesto/gds/write/*|src/core/src/gds/write/*|\
              src/core/include/hefesto/gds/stream/*|src/core/src/gds/stream/*|bench/oasis/*|\
              bench/lefdef/baseline_gate.py|bench/gds/gds_bench.py|bench/drc/drc_bench.py|scripts/fetch_pdk.py)
                oasis=true ;;
            esac
            case "$path" in
              tools/golden/container/*|.github/workflows/perf.yml) drc=true; gds=true; lefdef=true; oasis=true ;;
            esac
          done < changed.txt
          { echo "drc=$drc"; echo "gds=$gds"; echo "lefdef=$lefdef"; echo "oasis=$oasis"; } >> "$GITHUB_OUTPUT"
          echo "::notice::DRC jobs: $drc; GDS jobs: $gds; lefdef-bench: $lefdef; oasis-bench: $oasis"
      - name: Shards of the MASK-RT cases
        id: rt
        shell: bash
        run: |
          # The shard table of golden-capture.yml's capture-gds-rt (scripts/gds_rt_shards.py). Replaying and the
          # equivalence report make three Hefesto round trips per file; the gf180mcu shard ran out of twice
          # its capture timeout (100 min, Performance run 43766374927).
          # Each shard gets four times its capture timeout, at most GitHub's 360 minutes.
          matrix="$(python3 scripts/gds_rt_shards.py --matrix \
            | jq -c '{include: (.include | map(.timeout = ([.timeout * 4, 360] | min)))}')"
          rt_any=false
          [ "$(jq '.include | length' <<< "$matrix")" -gt 0 ] && rt_any=true
          { echo "rt_any=$rt_any"; echo "rt_matrix=$matrix"; } >> "$GITHUB_OUTPUT"
          echo "::notice::MASK-RT shards: $(jq -c '[.include[].shard]' <<< "$matrix")"

  drc-bench:
    name: DRC throughput vs Magic and background start latency
    needs: plan
    if: needs.plan.outputs.drc == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja and the OpenSSL headers for libcurl
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli and the engine benchmark (Release)
        run: |
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli hefesto_drc_engine_tests

      - name: Fetch or verify sky130
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the reference-tool image (Magic)
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Runner
        run: |
          {
            echo "## DRC performance"
            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Background start latency (100 x 100 dfxtp_1 array)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          build/linux-release/tests/unit/drc/engine/hefesto_drc_engine_tests \
            "Background start latency after a paint on the 100 x 100 dfxtp_1 array" 2>&1 | tee latency.txt
          {
            echo
            echo '```'
            grep -A2 'background start latency' latency.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: drc check; drc catchup against Magic (same runner)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          status=0
          # No --max-ratio: the timed ratio is information, the error counts must agree.
          python3 bench/drc/drc_bench.py --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --magic-image hefesto-golden:ci --repeat 3 --json drc-bench.json | tee drc-bench.txt || status=$?
          {
            echo
            echo '```'
            cat drc-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drc-bench
          path: |
            drc-bench.json
            latency.txt
          if-no-files-found: ignore
          retention-days: 90

  drc-profile:
    name: DRC instruction gate and profile (callgrind, perf, GCC vs Clang)
    needs: plan
    if: needs.plan.outputs.drc == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Pull requests run only the gate; main, the schedule and dispatch also profile.
      PROFILE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja, the OpenSSL headers, perf and valgrind
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev valgrind linux-tools-common \
            "linux-tools-$(uname -r)" || sudo apt-get install -y --no-install-recommends linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli, GCC 14 (Release, debug info, frame pointers)
        run: |
          flags="-g -fno-omit-frame-pointer"
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF -DHEFESTO_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_C_FLAGS="$flags"
          cmake --build --preset linux-release --target hefesto-cli

      - name: Build hefesto-cli, Clang (Release, debug info, frame pointers)
        if: env.PROFILE == 'true'
        run: |
          flags="-g -fno-omit-frame-pointer"
          CC=clang CXX=clang++ cmake --preset linux-release -B build/linux-release-clang -DHEFESTO_BUILD_DESKTOP=OFF \
            -DHEFESTO_BUILD_TESTS=OFF -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_C_FLAGS="$flags"
          cmake --build build/linux-release-clang --target hefesto-cli

      - name: Fetch or verify sky130
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the reference-tool image (Magic)
        if: env.PROFILE == 'true'
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Scripts of the block workload
        run: |
          python3 bench/drc/drc_bench.py --emit profile --workload block --checks 4
          python3 bench/drc/drc_bench.py --emit profile --workload block --checks 2
          mkdir -p drc-profile

      - name: perf record (GCC build, 4 passes of the block)
        if: env.PROFILE == 'true'
        shell: bash
        continue-on-error: true
        run: |
          cd profile
          perf record -F 2999 -g -o ../perf.data ../build/linux-release/src/cli/hefesto-cli \
            --no-log --magic -dnull -noconsole block-hefesto-4.tcl > /dev/null 2>&1
          cd ..
          perf report -i perf.data --no-children --percent-limit 0.3 --stdio -g none \
            --sort symbol > drc-profile/perf-self.txt
          perf report -i perf.data --children --percent-limit 1 --stdio -g none \
            --sort symbol > drc-profile/perf-children.txt
          perf report -i perf.data --no-children --percent-limit 2 --stdio -g caller,0.5,callee \
            --sort symbol > drc-profile/perf-callers.txt
          grep -v '^#' drc-profile/perf-self.txt | sed '/^$/d' | head -40 | tee drc-profile/perf-top.txt
          {
            echo "## perf, block, GCC 14 (self)"
            echo '```'
            cat drc-profile/perf-top.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: callgrind, instructions per pass of the block (Hefesto GCC build)
        shell: bash
        run: |
          cd profile
          for passes in 1 2; do
            valgrind --tool=callgrind --callgrind-out-file="../drc-profile/callgrind.hefesto.$passes" \
              ../build/linux-release/src/cli/hefesto-cli --no-log --magic -dnull -noconsole \
              "block-hefesto-$passes.tcl" > /dev/null 2>&1 &
          done
          wait
          cd ../drc-profile
          python3 ../bench/drc/callgrind_pass_diff.py callgrind.hefesto.1 callgrind.hefesto.2 > callgrind-hefesto-pass.txt
          cat callgrind-hefesto-pass.txt

      - name: callgrind, instructions per pass of the block (Magic, for information)
        if: env.PROFILE == 'true'
        shell: bash
        continue-on-error: true
        run: |
          cd profile
          # magic is a wrapper script: trace into the Tcl interpreter it starts, keep the largest profile.
          docker run --rm -v "$PWD:/work" -v "$PWD/../drc-profile:/out" -v "$PWD/../bench/drc:/bench:ro" -w /work \
            hefesto-golden:ci bash -c '
              status=0
              { apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-install-recommends valgrind; } \
                > /dev/null 2>&1 || status=1
              for passes in 1 2; do
                mkdir -p "/tmp/cg$passes"
                valgrind --tool=callgrind --trace-children=yes --callgrind-out-file="/tmp/cg$passes/out.%p" \
                  magic -dnull -noconsole "block-magic-$passes.tcl" > /dev/null 2>&1 || status=1
                cp "$(ls -S /tmp/cg$passes/out.* | head -1)" "/out/callgrind.magic.$passes" || status=1
              done
              python3 /bench/callgrind_pass_diff.py /out/callgrind.magic.1 /out/callgrind.magic.2 \
                > /out/callgrind-magic-pass.txt || status=1
              chmod -R a+rwX /out
              exit $status'
          cat ../drc-profile/callgrind-magic-pass.txt

      - name: Instruction gate (M3 baseline + 2 %)
        shell: bash
        run: |
          cd drc-profile
          magic=()
          [ -s callgrind-magic-pass.txt ] && magic=(--magic callgrind-magic-pass.txt)
          status=0
          python3 ../bench/drc/instruction_gate.py callgrind-hefesto-pass.txt "${magic[@]}" | tee gate.txt || status=$?
          {
            echo "## DRC instruction gate, one pass of the block"
            echo '```'
            cat gate.txt
            echo '```'
            echo "## callgrind, instructions per pass of the block"
            for f in callgrind-hefesto-pass.txt callgrind-magic-pass.txt; do
              [ -s "$f" ] || continue
              echo "### $f"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: GCC 14 and Clang against Magic (same runner)
        if: env.PROFILE == 'true'
        shell: bash
        run: |
          for build in linux-release linux-release-clang; do
            echo "$build:" | tee "drc-profile/bench-$build.txt"
            python3 bench/drc/drc_bench.py --hefesto-cli "build/$build/src/cli/hefesto-cli" \
              --magic-image hefesto-golden:ci --repeat 3 --json "drc-profile/bench-$build.json" \
              | tee -a "drc-profile/bench-$build.txt" || true
          done
          {
            echo "## drc_bench, GCC 14 then Clang"
            echo '```'
            cat drc-profile/bench-*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drc-profile
          path: |
            drc-profile
          if-no-files-found: ignore
          retention-days: 30

  golden-slow:
    name: golden-slow corpus (Release)
    needs: plan
    if: needs.plan.outputs.drc == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja and the OpenSSL headers for libcurl
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Restore gf180mcu
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli (Release)
        run: |
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch or verify sky130 and gf180mcu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 gf180mcu --cli build/linux-release/src/cli/hefesto-cli

      - name: Run the golden-slow cases
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          start=$(date +%s)
          ctest --test-dir build/linux-release -L golden-slow --output-on-failure --no-tests=error
          echo "golden-slow: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

  # m5-mask-gds-cif design D20, tasks 14.1 and 14.2. The gate is the callgrind instruction count of each
  # workload (Open Question 2 decided (a)): Magic's count until bench/gds/baseline.json records Hefesto's,
  # then that baseline + 2 %. Wall time on the same runner is information.
  gds-bench:
    name: GDS instruction gate and timing vs Magic (callgrind)
    needs: plan
    if: needs.plan.outputs.gds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja, the OpenSSL headers and valgrind
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev valgrind

      - name: Unit tests of the bench scripts
        run: python3 -m unittest discover -s bench/gds/tests -v

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Restore sky130-gds-sc
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_gds_sc_path }}
          key: ${{ steps.keys.outputs.sky130_gds_sc_key }}
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli, GCC 14 (Release, debug info, frame pointers)
        run: |
          flags="-g -fno-omit-frame-pointer"
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF -DHEFESTO_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_C_FLAGS="$flags"
          cmake --build --preset linux-release --target hefesto-cli

      # ci.yml's reference-data job saves both sets; a miss here fetches without saving.
      - name: Fetch or verify sky130 and sky130-gds-sc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 sky130-gds-sc --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the reference-tool image (Magic)
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Scripts of the three workloads
        run: |
          python3 bench/gds/gds_bench.py --emit profile
          mkdir -p gds-bench
          {
            echo "## GDS performance"
            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: callgrind, base and op scripts (Hefesto GCC build)
        shell: bash
        run: |
          cd profile
          # Magic's outline fonts, staged by gds_bench.py --emit (Magic in the image has its own).
          export CAD_ROOT="$PWD/cadroot"
          pids=()
          for workload in read write write-merge; do
            for kind in base op; do
              valgrind --tool=callgrind --callgrind-out-file="../gds-bench/callgrind.hefesto.$workload.$kind" \
                ../build/linux-release/src/cli/hefesto-cli --no-log --magic -dnull -noconsole \
                "$workload-hefesto-$kind.tcl" > "../gds-bench/hefesto.$workload.$kind.log" 2>&1 &
              pids+=("$!")
            done
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"

      - name: callgrind, base and op scripts (Magic)
        shell: bash
        run: |
          cd profile
          # magic is a wrapper script: trace into the Tcl interpreter it starts, keep the largest profile.
          docker run --rm -v "$PWD:/work" -v "$PWD/../gds-bench:/out" -w /work hefesto-golden:ci bash -c '
              status=0
              { apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-install-recommends valgrind; } \
                > /dev/null 2>&1 || status=1
              for workload in read write write-merge; do
                for kind in base op; do
                  dir="/tmp/cg.$workload.$kind"
                  mkdir -p "$dir"
                  valgrind --tool=callgrind --trace-children=yes --callgrind-out-file="$dir/out.%p" \
                    magic -dnull -noconsole "$workload-magic-$kind.tcl" > "/out/magic.$workload.$kind.log" 2>&1 || status=1
                  cp "$(ls -S "$dir"/out.* | head -1)" "/out/callgrind.magic.$workload.$kind" || status=1
                done
              done
              chmod -R a+rwX /out
              exit $status'

      - name: Instructions by function (information)
        shell: bash
        continue-on-error: true
        run: |
          cd gds-bench
          for workload in read write write-merge; do
            python3 ../bench/drc/callgrind_pass_diff.py "callgrind.hefesto.$workload.base" \
              "callgrind.hefesto.$workload.op" --top 30 > "functions-hefesto-$workload.txt"
          done
          docker run --rm -v "$PWD:/out" -v "$PWD/../bench/drc:/bench:ro" -w /out hefesto-golden:ci bash -c '
              { apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-install-recommends valgrind; } \
                > /dev/null 2>&1
              for workload in read write write-merge; do
                python3 /bench/callgrind_pass_diff.py "callgrind.magic.$workload.base" "callgrind.magic.$workload.op" \
                  --top 30 > "functions-magic-$workload.txt"
              done
              chmod a+rw functions-magic-*.txt'

      - name: Instruction gate (Magic's count, then the baseline + 2 %)
        shell: bash
        run: |
          status=0
          python3 bench/gds/gds_gate.py gds-bench | tee gds-bench/gate.txt || status=$?
          {
            echo "## GDS instruction gate (op minus base, callgrind)"
            echo
            cat gds-bench/gate.txt
            for f in gds-bench/functions-*.txt; do
              [ -s "$f" ] || continue
              echo
              echo "<details><summary>$(basename "$f" .txt)</summary>"
              echo
              echo '```'
              head -32 "$f"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Wall time against Magic (same runner, information)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          status=0
          python3 bench/gds/gds_bench.py --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --magic-image hefesto-golden:ci --repeat 3 --json gds-bench/gds-bench.json \
            --outputs gds-bench/outputs | tee gds-bench/timing.txt || status=$?
          {
            echo
            echo "## GDS wall time, op minus base (information)"
            echo '```'
            cat gds-bench/timing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gds-bench
          path: gds-bench
          if-no-files-found: ignore
          retention-days: 90

  # m5-mask-gds-cif design D19, task 14.3: every MASK-RT-* case, sharded as golden-capture.yml's capture-gds-rt
  # (scripts/gds_rt_shards.py, GOLDEN's case list), then the non-gating equivalence report.
  gds-roundtrip:
    name: MASK-RT round trips (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.gds == 'true' && needs.plan.outputs.rt_any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rt_matrix) }}
    steps:
      # The non-gating equivalence report stops 10 minutes before the job's timeout, so its run time can
      # never cancel the job after the gating replay passed.
      - name: Record the job's deadline
        run: echo "JOB_DEADLINE=$(( $(date +%s) + ${{ matrix.timeout }} * 60 - 600 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja and the OpenSSL headers for libcurl
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: List the shard's cases
        run: python3 scripts/gds_rt_shards.py --cases "${{ matrix.shard }}" > cases.txt

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      # The sets golden-capture.yml's rt-data saves under the same keys; a miss fetches and saves them here.
      - name: Restore the tech set
        id: tech
        uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.tech)] }}
      - name: Restore the library GDS set
        id: gds
        uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs[format('{0}_path', matrix.gds_out)] }}
          key: ${{ steps.keys.outputs[format('{0}_key', matrix.gds_out)] }}
      # A sky130 GDS fetch peaks at about 4.7 GB (the largest library's tar plus the kept set, task 1.1).
      - name: Free disk space
        if: matrix.tech == 'sky130' && steps.gds.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli (Release)
        run: |
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF -DHEFESTO_BUILD_TESTS=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch or verify the data sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_pdk.py ${{ matrix.tech }} ${{ matrix.gds }} \
            --cli build/linux-release/src/cli/hefesto-cli
          df -h /

      - name: Replay the MASK-RT cases (every input required)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          mapfile -t cases < cases.txt
          ids="$(xargs -n1 basename < cases.txt | paste -sd, -)"
          mkdir -p gds-roundtrip
          start=$(date +%s)
          status=0
          python3 tools/golden/replay.py --hefesto-cli build/linux-release/src/cli/hefesto-cli --include-gds-rt \
            --require-inputs "$ids" --json gds-roundtrip/replay.json "${cases[@]}" | tee gds-roundtrip/replay.txt \
            || status=$?
          {
            echo "## MASK-RT replay: ${{ matrix.shard }} (${#cases[@]} case(s), $(( $(date +%s) - start )) s)"
            echo '```'
            cat gds-roundtrip/replay.txt
            echo '```'
            echo "Data: $(du -sh "${{ steps.keys.outputs[format('{0}_path', matrix.gds_out)] }}" | cut -f1) library GDS" \
              "(${{ matrix.gds }}), $(du -sh "${{ steps.keys.outputs[format('{0}_path', matrix.tech)] }}" | cut -f1)" \
              "tech set (${{ matrix.tech }}); disk: $(df -h / | awk 'NR==2 {print $3 " used, " $4 " free"}')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Equivalence report of a second read and write (information)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t cases < cases.txt
          left=$(( JOB_DEADLINE - $(date +%s) ))
          if [ "$left" -lt 300 ]; then
            echo "## Equivalence report: ${{ matrix.shard }}: skipped, ${left} s left before the job's timeout" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          timeout --signal=INT --kill-after=60 "${left}s" \
            python3 bench/gds/gds_equivalence.py --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --shard "${{ matrix.shard }}" --json gds-roundtrip/equivalence.json --summary "$GITHUB_STEP_SUMMARY" \
            "${cases[@]}" || status=$?
          if [ "$status" -eq 124 ]; then
            echo "## Equivalence report: ${{ matrix.shard }}: stopped at the job's deadline (information only)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gds-roundtrip-${{ matrix.shard }}
          path: gds-roundtrip
          if-no-files-found: ignore
          retention-days: 30

  # m6-lef-def-oasis design D22, tasks 16.1 and 16.2 (Open Question 4 decided (a)): each LEF/DEF workload is gated
  # at its own callgrind baseline (bench/lefdef/baseline.json) + 2 %; Magic's count and the wall time are information.
  lefdef-bench:
    name: LEF/DEF instruction gate and timing vs Magic (callgrind)
    needs: plan
    if: needs.plan.outputs.lefdef == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
