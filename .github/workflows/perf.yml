#
# DRC performance (openspec/changes/m3-drc design D16, task 11.3; capability
# hefesto-performance "Edit latency" and "Batch throughput relative to Magic").
#
#   drc-bench    One runner, one job: hefesto-cli (Release) and Magic 8.3.694 from the
#                pinned reference image (tools/golden/container/Containerfile) run the same
#                `drc check; drc catchup` scripts, single-threaded, over the 100 x 100
#                sky130_fd_sc_hd__dfxtp_1 array and the all-cells block (bench/drc/drc_bench.py).
#                Fails when the error counts differ; the timed ratio to Magic is reported for
#                information (the throughput gate is drc-profile's instruction count, user
#                decision of 2026-11-12). The background start latency benchmark (hidden test
#                "[benchmark]" of hefesto_drc_engine_tests, target <= 100 ms) runs in the same
#                job. Results: the job summary and the artifact "drc-bench"; they are recorded
#                in docs/design/m3-ui-conformance.md "Performance".
#   drc-profile  The DRC throughput gate (user decision of 2026-11-12): a GCC 14 Release build
#                with debug info and frame pointers runs one and two passes of the block workload
#                (bench/drc/drc_bench.py --emit) under callgrind; bench/drc/callgrind_pass_diff.py
#                gives the instructions of one pass per function, and bench/drc/instruction_gate.py
#                fails above the M3 baseline (12.14 billion) + 2 %. Instruction counts are stable
#                across runner types, where wall time moves by about 0.1 x. On pull requests
#                that touch the DRC paths only the gate runs (about 15 minutes); on main, the
#                weekly schedule and workflow_dispatch the job also profiles: `perf record` of
#                four passes, Magic's count under callgrind (inside the reference image, for
#                information) and drc_bench.py with GCC 14 and Clang builds against Magic, to
#                separate compiler from algorithm. Reports: the job summary and the artifact
#                "drc-profile".
#   golden-slow  The standard-cell corpus cases (CTest label golden-slow, design D14) in a
#                Release build, timed. They also replay on every CI leg (ci.yml, golden replay).

name: Performance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/core/include/hefesto/drc/**
      - src/core/src/drc/**
      - src/core/src/db/**
      - bench/drc/**
      - tests/unit/drc/engine/latency_bench_test.cpp
      - tests/golden/DRC/cases/DRC-STD-*/**
      - tools/golden/container/**
      - .github/workflows/perf.yml
  pull_request:
    paths:
      - src/core/include/hefesto/drc/**
      - src/core/src/drc/**
      - src/core/src/db/**
      - bench/drc/**
      - tests/unit/drc/engine/latency_bench_test.cpp
      - tests/golden/DRC/cases/DRC-STD-*/**
      - tools/golden/container/**
      - .github/workflows/perf.yml
  schedule:
    - cron: "41 3 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_VERSION: "3.31.6"
  NINJA_VERSION: "1.11.1.4"
  PYTHON_VERSION: "3.12"
  CC: gcc-14
  CXX: g++-14

jobs:
  drc-bench:
    name: DRC throughput vs Magic and background start latency
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja and the OpenSSL headers for libcurl
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli and the engine benchmark (Release)
        run: |
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli hefesto_drc_engine_tests

      - name: Fetch or verify sky130
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the reference-tool image (Magic)
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Runner
        run: |
          {
            echo "## DRC performance"
            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Background start latency (100 x 100 dfxtp_1 array)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          build/linux-release/tests/unit/drc/engine/hefesto_drc_engine_tests \
            "Background start latency after a paint on the 100 x 100 dfxtp_1 array" 2>&1 | tee latency.txt
          {
            echo
            echo '```'
            grep -A2 'background start latency' latency.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: drc check; drc catchup against Magic (same runner)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          status=0
          # No --max-ratio: the timed ratio is information, the error counts must agree.
          python3 bench/drc/drc_bench.py --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --magic-image hefesto-golden:ci --repeat 3 --json drc-bench.json | tee drc-bench.txt || status=$?
          {
            echo
            echo '```'
            cat drc-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drc-bench
          path: |
            drc-bench.json
            latency.txt
          if-no-files-found: ignore
          retention-days: 90

  drc-profile:
    name: DRC instruction gate and profile (callgrind, perf, GCC vs Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Pull requests run only the gate; main, the schedule and dispatch also profile.
      PROFILE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja, the OpenSSL headers, perf and valgrind
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev valgrind linux-tools-common \
            "linux-tools-$(uname -r)" || sudo apt-get install -y --no-install-recommends linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli, GCC 14 (Release, debug info, frame pointers)
        run: |
          flags="-g -fno-omit-frame-pointer"
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF -DHEFESTO_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_C_FLAGS="$flags"
          cmake --build --preset linux-release --target hefesto-cli

      - name: Build hefesto-cli, Clang (Release, debug info, frame pointers)
        if: env.PROFILE == 'true'
        run: |
          flags="-g -fno-omit-frame-pointer"
          CC=clang CXX=clang++ cmake --preset linux-release -B build/linux-release-clang -DHEFESTO_BUILD_DESKTOP=OFF \
            -DHEFESTO_BUILD_TESTS=OFF -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_C_FLAGS="$flags"
          cmake --build build/linux-release-clang --target hefesto-cli

      - name: Fetch or verify sky130
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the reference-tool image (Magic)
        if: env.PROFILE == 'true'
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Scripts of the block workload
        run: |
          python3 bench/drc/drc_bench.py --emit profile --workload block --checks 4
          python3 bench/drc/drc_bench.py --emit profile --workload block --checks 2
          mkdir -p drc-profile

      - name: perf record (GCC build, 4 passes of the block)
        if: env.PROFILE == 'true'
        shell: bash
        continue-on-error: true
        run: |
          cd profile
          perf record -F 2999 -g -o ../perf.data ../build/linux-release/src/cli/hefesto-cli \
            --no-log --magic -dnull -noconsole block-hefesto-4.tcl > /dev/null 2>&1
          cd ..
          perf report -i perf.data --no-children --percent-limit 0.3 --stdio -g none \
            --sort symbol > drc-profile/perf-self.txt
          perf report -i perf.data --children --percent-limit 1 --stdio -g none \
            --sort symbol > drc-profile/perf-children.txt
          perf report -i perf.data --no-children --percent-limit 2 --stdio -g caller,0.5,callee \
            --sort symbol > drc-profile/perf-callers.txt
          grep -v '^#' drc-profile/perf-self.txt | sed '/^$/d' | head -40 | tee drc-profile/perf-top.txt
          {
            echo "## perf, block, GCC 14 (self)"
            echo '```'
            cat drc-profile/perf-top.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: callgrind, instructions per pass of the block (Hefesto GCC build)
        shell: bash
        run: |
          cd profile
          for passes in 1 2; do
            valgrind --tool=callgrind --callgrind-out-file="../drc-profile/callgrind.hefesto.$passes" \
              ../build/linux-release/src/cli/hefesto-cli --no-log --magic -dnull -noconsole \
              "block-hefesto-$passes.tcl" > /dev/null 2>&1 &
          done
          wait
          cd ../drc-profile
          python3 ../bench/drc/callgrind_pass_diff.py callgrind.hefesto.1 callgrind.hefesto.2 > callgrind-hefesto-pass.txt
          cat callgrind-hefesto-pass.txt

      - name: callgrind, instructions per pass of the block (Magic, for information)
        if: env.PROFILE == 'true'
        shell: bash
        continue-on-error: true
        run: |
          cd profile
          # magic is a wrapper script: trace into the Tcl interpreter it starts, keep the largest profile.
          docker run --rm -v "$PWD:/work" -v "$PWD/../drc-profile:/out" -v "$PWD/../bench/drc:/bench:ro" -w /work \
            hefesto-golden:ci bash -c '
              status=0
              { apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-install-recommends valgrind; } \
                > /dev/null 2>&1 || status=1
              for passes in 1 2; do
                mkdir -p "/tmp/cg$passes"
                valgrind --tool=callgrind --trace-children=yes --callgrind-out-file="/tmp/cg$passes/out.%p" \
                  magic -dnull -noconsole "block-magic-$passes.tcl" > /dev/null 2>&1 || status=1
                cp "$(ls -S /tmp/cg$passes/out.* | head -1)" "/out/callgrind.magic.$passes" || status=1
              done
              python3 /bench/callgrind_pass_diff.py /out/callgrind.magic.1 /out/callgrind.magic.2 \
                > /out/callgrind-magic-pass.txt || status=1
              chmod -R a+rwX /out
              exit $status'
          cat ../drc-profile/callgrind-magic-pass.txt

      - name: Instruction gate (M3 baseline + 2 %)
        shell: bash
        run: |
          cd drc-profile
          magic=()
          [ -s callgrind-magic-pass.txt ] && magic=(--magic callgrind-magic-pass.txt)
          status=0
          python3 ../bench/drc/instruction_gate.py callgrind-hefesto-pass.txt "${magic[@]}" | tee gate.txt || status=$?
          {
            echo "## DRC instruction gate, one pass of the block"
            echo '```'
            cat gate.txt
            echo '```'
            echo "## callgrind, instructions per pass of the block"
            for f in callgrind-hefesto-pass.txt callgrind-magic-pass.txt; do
              [ -s "$f" ] || continue
              echo "### $f"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: GCC 14 and Clang against Magic (same runner)
        if: env.PROFILE == 'true'
        shell: bash
        run: |
          for build in linux-release linux-release-clang; do
            echo "$build:" | tee "drc-profile/bench-$build.txt"
            python3 bench/drc/drc_bench.py --hefesto-cli "build/$build/src/cli/hefesto-cli" \
              --magic-image hefesto-golden:ci --repeat 3 --json "drc-profile/bench-$build.json" \
              | tee -a "drc-profile/bench-$build.txt" || true
          done
          {
            echo "## drc_bench, GCC 14 then Clang"
            echo '```'
            cat drc-profile/bench-*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drc-profile
          path: |
            drc-profile
          if-no-files-found: ignore
          retention-days: 30

  golden-slow:
    name: golden-slow corpus (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja and the OpenSSL headers for libcurl
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Restore gf180mcu
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.gf180mcu_path }}
          key: ${{ steps.keys.outputs.gf180mcu_key }}
      - uses: actions/cache@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli (Release)
        run: |
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch or verify sky130 and gf180mcu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 gf180mcu --cli build/linux-release/src/cli/hefesto-cli

      - name: Run the golden-slow cases
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          start=$(date +%s)
          ctest --test-dir build/linux-release -L golden-slow --output-on-failure --no-tests=error
          echo "golden-slow: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
