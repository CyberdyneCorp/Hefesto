      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      # The keys ci.yml's reference-data job saves sky130-lef under (task 16.2, Round 1 note).
      - name: Restore sky130-lef
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_lef_path }}
          key: ${{ steps.keys.outputs.sky130_lef_key }}
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli, GCC 14 (Release, debug info, frame pointers)
        run: |
          flags="-g -fno-omit-frame-pointer"
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF -DHEFESTO_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_C_FLAGS="$flags"
          cmake --build --preset linux-release --target hefesto-cli

      # ci.yml's reference-data job saves both sets; a miss here fetches without saving.
      - name: Fetch or verify sky130 and sky130-lef
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 sky130-lef --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the reference-tool image (Magic)
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Scripts of the three workloads
        run: |
          python3 bench/lefdef/lefdef_bench.py --emit profile
          mkdir -p lefdef-bench
          {
            echo "## LEF/DEF performance"
            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: callgrind, base and op scripts (Hefesto GCC build)
        shell: bash
        run: |
          cd profile
          pids=()
          for workload in lef-read def-read lef-writeall; do
            for kind in base op; do
              valgrind --tool=callgrind --callgrind-out-file="../lefdef-bench/callgrind.hefesto.$workload.$kind" \
                ../build/linux-release/src/cli/hefesto-cli --no-log --magic -dnull -noconsole \
                "$workload-hefesto-$kind.tcl" > "../lefdef-bench/hefesto.$workload.$kind.log" 2>&1 &
              pids+=("$!")
            done
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"

      - name: callgrind, base and op scripts (Magic, for information)
        shell: bash
        continue-on-error: true
        run: |
          cd profile
          # magic is a wrapper script: trace into the Tcl interpreter it starts, keep the largest profile.
          docker run --rm -v "$PWD:/work" -v "$PWD/../lefdef-bench:/out" -w /work hefesto-golden:ci bash -c '
              status=0
              { apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-install-recommends valgrind; } \
                > /dev/null 2>&1 || status=1
              for workload in lef-read def-read lef-writeall; do
                for kind in base op; do
                  dir="/tmp/cg.$workload.$kind"
                  mkdir -p "$dir"
                  valgrind --tool=callgrind --trace-children=yes --callgrind-out-file="$dir/out.%p" \
                    magic -dnull -noconsole "$workload-magic-$kind.tcl" > "/out/magic.$workload.$kind.log" 2>&1 || status=1
                  cp "$(ls -S "$dir"/out.* | head -1)" "/out/callgrind.magic.$workload.$kind" || status=1
                done
              done
              chmod -R a+rwX /out
              exit $status'

      - name: Instructions by function (information)
        shell: bash
        continue-on-error: true
        run: |
          cd lefdef-bench
          for workload in lef-read def-read lef-writeall; do
            python3 ../bench/drc/callgrind_pass_diff.py "callgrind.hefesto.$workload.base" \
              "callgrind.hefesto.$workload.op" --top 30 > "functions-hefesto-$workload.txt"
          done

      - name: Instruction gate (each workload's baseline + 2 %)
        shell: bash
        run: |
          status=0
          python3 bench/lefdef/baseline_gate.py lefdef-bench --baseline bench/lefdef/baseline.json \
            --tool hefesto --reference magic --workload lef-read --workload def-read --workload lef-writeall \
            | tee lefdef-bench/gate.txt || status=$?
          {
            echo "## LEF/DEF instruction gate (op minus base, callgrind)"
            echo
            cat lefdef-bench/gate.txt
            for f in lefdef-bench/functions-*.txt; do
              [ -s "$f" ] || continue
              echo
              echo "<details><summary>$(basename "$f" .txt)</summary>"
              echo
              echo '```'
              head -32 "$f"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Wall time against Magic (same runner, information)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          status=0
          python3 bench/lefdef/lefdef_bench.py --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --magic-image hefesto-golden:ci --repeat 3 --json lefdef-bench/lefdef-bench.json \
            --outputs lefdef-bench/outputs | tee lefdef-bench/timing.txt || status=$?
          {
            echo
            echo "## LEF/DEF wall time, op minus base (information)"
            echo '```'
            cat lefdef-bench/timing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lefdef-bench
          path: lefdef-bench
          if-no-files-found: ignore
          retention-days: 90

  # m6-lef-def-oasis design D22, tasks 16.1 and 16.2: each OASIS workload is gated at its own callgrind baseline
  # (bench/oasis/baseline.json) + 2 %; Hefesto's GDS path over the same layouts is information (Magic has no OASIS).
  oasis-bench:
    name: OASIS instruction gate and timing vs the GDS path (callgrind)
    needs: plan
    if: needs.plan.outputs.oasis == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja, the OpenSSL headers and valgrind
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev valgrind

      - name: Unit tests of the bench scripts
        run: python3 -m unittest discover -s bench/lefdef/tests -v

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - name: Restore sky130-gds-sc
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_gds_sc_path }}
          key: ${{ steps.keys.outputs.sky130_gds_sc_key }}
      # Magic's outline fonts (graphics/*.pt3), staged as gds-bench stages them.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      - name: Build hefesto-cli, GCC 14 (Release, debug info, frame pointers)
        run: |
          flags="-g -fno-omit-frame-pointer"
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF -DHEFESTO_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_C_FLAGS="$flags"
          cmake --build --preset linux-release --target hefesto-cli

      - name: Fetch or verify sky130 and sky130-gds-sc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 sky130-gds-sc --cli build/linux-release/src/cli/hefesto-cli

      - name: Scripts of the three workloads (and the OASIS library)
        run: |
          python3 bench/oasis/oasis_bench.py --hefesto-cli build/linux-release/src/cli/hefesto-cli --emit profile
          mkdir -p oasis-bench
          ls -l profile/sky130_fd_sc_hd.gds profile/sky130_fd_sc_hd.oas
          {
            echo "## OASIS performance"
            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: callgrind, base and op scripts (OASIS, then the GDS path)
        shell: bash
        run: |
          cd profile
          # Magic's outline fonts, staged by oasis_bench.py --emit.
          export CAD_ROOT="$PWD/cadroot"
          status=0
          # One format at a time: six callgrind processes, as gds-bench runs.
          for format in oasis gds; do
            pids=()
            for workload in read write write-merge; do
              for kind in base op; do
                valgrind --tool=callgrind --callgrind-out-file="../oasis-bench/callgrind.$format.$workload.$kind" \
                  ../build/linux-release/src/cli/hefesto-cli --no-log --magic -dnull -noconsole \
                  "$workload-$format-$kind.tcl" > "../oasis-bench/$format.$workload.$kind.log" 2>&1 &
                pids+=("$!")
              done
            done
            for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          done
          exit "$status"

      - name: Instructions by function (information)
        shell: bash
        continue-on-error: true
        run: |
          cd oasis-bench
          for workload in read write write-merge; do
            python3 ../bench/drc/callgrind_pass_diff.py "callgrind.oasis.$workload.base" \
              "callgrind.oasis.$workload.op" --top 30 > "functions-oasis-$workload.txt"
          done

      - name: Instruction gate (each workload's baseline + 2 %)
        shell: bash
        run: |
          status=0
          python3 bench/lefdef/baseline_gate.py oasis-bench --baseline bench/oasis/baseline.json \
            --tool oasis --reference gds --workload read --workload write --workload write-merge \
            | tee oasis-bench/gate.txt || status=$?
          {
            echo "## OASIS instruction gate (op minus base, callgrind)"
            echo
            cat oasis-bench/gate.txt
            for f in oasis-bench/functions-*.txt; do
              [ -s "$f" ] || continue
              echo
              echo "<details><summary>$(basename "$f" .txt)</summary>"
              echo
              echo '```'
              head -32 "$f"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Wall time against the GDS path (same runner, information)
        # bash -eo pipefail: without it `cmd | tee` takes tee's status and hides cmd's failure.
        shell: bash
        run: |
          status=0
          python3 bench/oasis/oasis_bench.py --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --repeat 3 --json oasis-bench/oasis-bench.json | tee oasis-bench/timing.txt || status=$?
          {
            echo
            echo "## OASIS wall time, op minus base (information)"
            echo '```'
            cat oasis-bench/timing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oasis-bench
          path: oasis-bench
          if-no-files-found: ignore
          retention-days: 90

  view3d-bench:
    name: 3D mesh build time and memory (bench/view3d)
    needs: plan
    if: needs.plan.outputs.view3d == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja, the OpenSSL headers, the Vulkan loader and Mesa lavapipe
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libvulkan-dev mesa-vulkan-drivers libx11-dev

      - name: Unit tests of the gate script
        run: python3 -m unittest discover -s bench/view3d/tests -v

      - name: Cache keys of the reference data
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - name: Restore sky130
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.sky130_path }}
          key: ${{ steps.keys.outputs.sky130_key }}
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.keys.outputs.magic_ref_path }}
          key: ${{ steps.keys.outputs.magic_ref_key }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      # The display styles of sky130A's styletype (mos.OpenGL.dstyle and its cmap) come from Magic's scmos/,
      # the cursor glyphs (color.glyphs) from graphics/.
      - name: Fetch the Magic reference sources (sparse, pinned)
        run: python3 scripts/fetch_pdk.py magic-ref

      # With the Vulkan renderer (HEFESTO_BUILD_DESKTOP=ON), so the benchmark times frames (task 13.2).
      - name: Build hefesto-cli and the 3D benchmark (Release)
        run: |
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=ON -DHEFESTO_BUILD_TESTS=OFF \
            -DHEFESTO_BUILD_VIEW3D_BENCH=ON
          cmake --build --preset linux-release --target hefesto-cli hefesto-bench-view3d

      - name: Fetch or verify sky130
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the meshes (synthetic 1M rectangles, dfxtp_1 array, all-cells block)
        shell: bash
        run: |
          bench=build/linux-release/bench/view3d/hefesto-bench-view3d
          pdk="${{ steps.keys.outputs.sky130_path }}/sky130A"
          mkdir -p view3d-bench
          # Frames of the synthetic mesh on lavapipe only (VK_DRIVER_FILES), 10 per level: recorded, not gated.
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$icd" || { echo "::error::no lavapipe ICD manifest in /usr/share/vulkan/icd.d"; exit 1; }
          # One process per workload, so each peak resident set is its own.
          VK_DRIVER_FILES="$icd" "$bench" --workload synthetic --rects 1000000 --repeat 5 --frames 10 \
            --json view3d-bench/synthetic.json > /dev/null
          # The same region in mask-layer mode (task 13.3): generation plus mesh, then frames on lavapipe.
          VK_DRIVER_FILES="$icd" "$bench" --workload mask --rects 1000000 --repeat 5 --frames 10 \
            --json view3d-bench/mask.json > /dev/null
          for w in array block; do
            "$bench" --workload "$w" --repeat 5 --frames 0 --pdk-root "$pdk" --style-dir build/ref/magic/scmos \
              --style-dir build/ref/magic/graphics --json "view3d-bench/$w.json" > /dev/null
          done

      - name: Gate build time and memory
        shell: bash
        run: |
          {
            echo "## 3D mesh benchmark"
            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 bench/view3d/view3d_gate.py view3d-bench/synthetic.json view3d-bench/mask.json \
            view3d-bench/array.json view3d-bench/block.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Frame time of the synthetic and mask meshes on lavapipe (recorded, not gated)
        if: always()
        shell: bash
        run: |
          python3 - view3d-bench/synthetic.json view3d-bench/mask.json >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          for path in sys.argv[1:]:
              try:
                  r = json.load(open(path))["results"][0]
              except OSError:
                  continue
              f = r.get("frame")
              print(f"\n### Frame time, {r['workload']} (tasks 13.2, 13.3, recorded, not gated)\n")
              if not f:
                  print(f"not measured: {r.get('frame_time_note', '')}")
                  continue
              print(f"{f['device']}, {f['width']} x {f['height']}, {f['view']}; upload {f['upload_s']:.3f} s, "
                    f"upload plus first frame {f['first_frame_ms']:.0f} ms\n")
              print("| Level | Median | p95 | fps (median) |\n|---|---|---|---|")
              for level in ("level0", "level1", "level0_ghost", "level1_ghost", "level0_overlay", "level1_overlay"):
                  l = f.get(level)
                  if l:
                      print(f"| {level[5:]} | {l['median_ms']:.1f} ms | {l['p95_ms']:.1f} ms | {l['fps']:.2f} |")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: view3d-bench
          path: view3d-bench
          if-no-files-found: ignore
          retention-days: 90

  # Schematic benchmark (openspec/changes/m8-schematic task 14.1): a Release build of
  # bench/schem/hefesto-bench-schem times load, save and netlist of the generated 10k-instance
  # hierarchy (scripts/gen_schem_hierarchy.py; hierarchical and flat) and of the two largest
  # example schematics of each xschem data set (sky130, gf180mcu, IHP), and
  # bench/schem/schem_bench.py compares the medians with the linux-runner entry of
  # bench/schem/baseline.json (no entry: reported, not gated). The artifact "schem-bench" holds
  # the report and baseline.json with this run's medians as the linux-runner entry. The job
  # selects itself on pull requests (schem paths, bench/schem, this workflow), so `plan` is
  # unchanged.
  schem-bench:
    name: Schematic load, save and netlist time (bench/schem)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            run=false
            if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq \
              '^(src/core/include/hefesto/schem/|src/core/src/schem/|bench/schem/|scripts/gen_schem_hierarchy\.py|\.github/workflows/perf\.yml)'; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice::schem-bench: $run"

      - uses: actions/setup-python@v5
        if: steps.select.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CMake, Ninja and the OpenSSL headers
        if: steps.select.outputs.run == 'true'
        run: |
          python3 -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Unit tests of the driver and the hierarchy generator
        if: steps.select.outputs.run == 'true'
        run: python3 -m unittest discover -s bench/schem/tests -v

      - name: Cache keys of the xschem data sets
        if: steps.select.outputs.run == 'true'
        id: keys
        run: python3 scripts/fetch_pdk.py --cache-info >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.select.outputs.run == 'true'
        with:
          path: ${{ steps.keys.outputs.sky130_xschem_path }}
          key: ${{ steps.keys.outputs.sky130_xschem_key }}
      - uses: actions/cache/restore@v4
        if: steps.select.outputs.run == 'true'
        with:
          path: ${{ steps.keys.outputs.gf180mcu_xschem_path }}
          key: ${{ steps.keys.outputs.gf180mcu_xschem_key }}
      - uses: actions/cache/restore@v4
        if: steps.select.outputs.run == 'true'
        with:
          path: ${{ steps.keys.outputs.ihp_xschem_path }}
          key: ${{ steps.keys.outputs.ihp_xschem_key }}
      - uses: actions/cache/restore@v4
        if: steps.select.outputs.run == 'true'
        with:
          path: .cache/deps
          key: deps-perf-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Tcl.cmake', 'third_party/patches/**') }}
          restore-keys: deps-perf-

      - name: Build hefesto-cli and the schematic benchmark (Release)
        if: steps.select.outputs.run == 'true'
        run: |
          cmake --preset linux-release -DHEFESTO_BUILD_DESKTOP=OFF -DHEFESTO_BUILD_TESTS=OFF \
            -DHEFESTO_BUILD_SCHEM_BENCH=ON
          cmake --build --preset linux-release --target hefesto-cli hefesto-bench-schem

      # A data set that cannot be fetched is skipped by the driver with a note.
      - name: Fetch or verify the xschem data sets
        if: steps.select.outputs.run == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_pdk.py sky130-xschem gf180mcu-xschem ihp-xschem \
            --cli build/linux-release/src/cli/hefesto-cli

      - name: Time load, save and netlist
        if: steps.select.outputs.run == 'true'
        shell: bash
        run: |
          {
            echo "## Schematic benchmark"
            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p schem-bench
          python3 bench/schem/schem_bench.py --bench build/linux-release/bench/schem/hefesto-bench-schem \
            --host linux-runner --work build/schem-bench --json schem-bench/report.json \
            --record schem-bench/baseline.json --commit "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.run == 'true'
        with:
          name: schem-bench
          path: schem-bench
          if-no-files-found: ignore
          retention-days: 90
