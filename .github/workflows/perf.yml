        run: |
          status=0
          python3 bench/lefdef/lefdef_bench.py --hefesto-cli build/linux-release/src/cli/hefesto-cli \
            --magic-image hefesto-golden:ci --repeat 3 --json lefdef-bench/lefdef-bench.json \
            --outputs lefdef-bench/outputs | tee lefdef-bench/timing.txt || status=$?
