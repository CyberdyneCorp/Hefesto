            echo
            echo "Runner: $(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: callgrind, base and op scripts (Hefesto GCC build)
        shell: bash
        run: |
          cd profile
          pids=()
          for workload in lef-read def-read lef-writeall; do
            for kind in base op; do
              valgrind --tool=callgrind --callgrind-out-file="../lefdef-bench/callgrind.hefesto.$workload.$kind" \
                ../build/linux-release/src/cli/hefesto-cli --no-log --magic -dnull -noconsole \
                "$workload-hefesto-$kind.tcl" > "../lefdef-bench/hefesto.$workload.$kind.log" 2>&1 &
              pids+=("$!")
            done
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"

      - name: callgrind, base and op scripts (Magic, for information)
        shell: bash
        continue-on-error: true
        run: |
          cd profile
          # magic is a wrapper script: trace into the Tcl interpreter it starts, keep the largest profile.
          docker run --rm -v "$PWD:/work" -v "$PWD/../lefdef-bench:/out" -w /work hefesto-golden:ci bash -c '
              status=0
              { apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-install-recommends valgrind; } \
                > /dev/null 2>&1 || status=1
              for workload in lef-read def-read lef-writeall; do
                for kind in base op; do
                  dir="/tmp/cg.$workload.$kind"
                  mkdir -p "$dir"
                  valgrind --tool=callgrind --trace-children=yes --callgrind-out-file="$dir/out.%p" \
                    magic -dnull -noconsole "$workload-magic-$kind.tcl" > "/out/magic.$workload.$kind.log" 2>&1 || status=1
                  cp "$(ls -S "$dir"/out.* | head -1)" "/out/callgrind.magic.$workload.$kind" || status=1
                done
              done
              chmod -R a+rwX /out
              exit $status'

      - name: Instructions by function (information)
        shell: bash
        continue-on-error: true
        run: |
          cd lefdef-bench
          for workload in lef-read def-read lef-writeall; do
            python3 ../bench/drc/callgrind_pass_diff.py "callgrind.hefesto.$workload.base" \
              "callgrind.hefesto.$workload.op" --top 30 > "functions-hefesto-$workload.txt"
          done

      - name: Instruction gate (each workload's baseline + 2 %)
        shell: bash
        run: |
          status=0
          python3 bench/lefdef/baseline_gate.py lefdef-bench --baseline bench/lefdef/baseline.json \
            --tool hefesto --reference magic --workload lef-read --workload def-read --workload lef-writeall \
            | tee lefdef-bench/gate.txt || status=$?
          {
            echo "## LEF/DEF instruction gate (op minus base, callgrind)"
