          cmake --build --preset linux-release --target hefesto-cli

      # ci.yml's reference-data job saves both sets; a miss here fetches without saving.
      - name: Fetch or verify sky130 and sky130-lef
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_pdk.py sky130 sky130-lef --cli build/linux-release/src/cli/hefesto-cli

      - name: Build the reference-tool image (Magic)
        run: docker build -f tools/golden/container/Containerfile -t hefesto-golden:ci tools/golden

      - name: Scripts of the three workloads
        run: |
